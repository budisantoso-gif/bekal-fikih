<style>
:root{
  --bg:#F6F4EE;--card:#FFFFFF;--ink:#1F2A37;--muted:#6B7280;--line:#E5E1D8;--brand:#1F5FBF;--brand-ink:#0E3A7A;
  --sy-bg:#FAEEDA;--sy-fg:#854F0B;--sy-ink:#633806;
  --ru-bg:#EEEDFE;--ru-fg:#534AB7;--ru-ink:#3C3489;
  --wj-bg:#E6F1FB;--wj-fg:#185FA5;--wj-ink:#0C447C;
  --su-bg:#EAF3DE;--su-fg:#3B6D11;--su-ink:#27500A;
  --mk-bg:#F1EFE8;--mk-fg:#5F5E5A;--mk-ink:#444441;
  --pb-bg:#FCEBEB;--pb-fg:#A32D2D;--pb-ink:#791F1F;
  --nt-bg:#F3F4F6;--nt-fg:#4B5563;--nt-ink:#1F2937;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14161A;--card:#1E2127;--ink:#ECEDEF;--muted:#A0A4AB;--line:#30343B;--brand:#6EA8FF;--brand-ink:#CFE1FF;
  --sy-bg:#412402;--sy-fg:#EF9F27;--sy-ink:#FAC775;
  --ru-bg:#26215C;--ru-fg:#AFA9EC;--ru-ink:#CECBF6;
  --wj-bg:#042C53;--wj-fg:#85B7EB;--wj-ink:#B5D4F4;
  --su-bg:#173404;--su-fg:#97C459;--su-ink:#C0DD97;
  --mk-bg:#2C2C2A;--mk-fg:#B4B2A9;--mk-ink:#D3D1C7;
  --pb-bg:#501313;--pb-fg:#F09595;--pb-ink:#F7C1C1;
  --nt-bg:#262A31;--nt-fg:#A0A4AB;--nt-ink:#E5E7EB;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:22px;margin:0 0 4px;font-weight:700}
h2{font-size:18px;margin:24px 0 10px;font-weight:700}
h3{font-size:16px;margin:0;font-weight:500}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
.ar{font-family:'Noto Naskh Arabic','Amiri',serif;font-weight:600;direction:rtl;font-size:20px;line-height:1.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
button:active{transform:scale(.98)}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.lg{width:26px;height:26px}
.cat-syarat{background:var(--sy-bg);color:var(--sy-ink)} .cat-syarat .ico{color:var(--sy-fg)}
.cat-rukun{background:var(--ru-bg);color:var(--ru-ink)} .cat-rukun .ico{color:var(--ru-fg)}
.cat-wajib{background:var(--wj-bg);color:var(--wj-ink)} .cat-wajib .ico{color:var(--wj-fg)}
.cat-sunnah{background:var(--su-bg);color:var(--su-ink)} .cat-sunnah .ico{color:var(--su-fg)}
.cat-makruh{background:var(--mk-bg);color:var(--mk-ink)} .cat-makruh .ico{color:var(--mk-fg)}
.cat-pembatal{background:var(--pb-bg);color:var(--pb-ink)} .cat-pembatal .ico{color:var(--pb-fg)}
.cat-netral{background:var(--nt-bg);color:var(--nt-ink)} .cat-netral .ico{color:var(--nt-fg)}
.map{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(96px,auto);gap:8px}
.region{position:relative;overflow:hidden;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid color-mix(in srgb,var(--rc) 35%,transparent);background:color-mix(in srgb,var(--rc) 13%,var(--card));color:var(--ink);cursor:pointer;text-align:left}
.region.lit{background:var(--rc);border-color:var(--rc);color:#fff}
.region .rar{font-size:18px;line-height:1.2;color:var(--rc);position:relative}
.region.lit .rar{color:#fff}
.region .wm{position:absolute;right:-4px;bottom:-12px;line-height:1;color:var(--rc);opacity:.13;pointer-events:none}
.region.lit .wm{color:#fff;opacity:.2}
.region .rft{position:relative;display:flex;flex-direction:column}
.region small{font-size:11px;opacity:.85}
.hero{position:relative;overflow:hidden;background:#0F5C4A;color:#fff;border-radius:20px;padding:18px 18px 16px}
.hk{font-size:12.5px;opacity:.85}
.hprog{margin-top:14px;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;font-size:14px}
.hpat{position:absolute;right:-30px;top:-30px;width:210px;height:210px;opacity:.14;pointer-events:none}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}
.tabs button{font-size:13px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button.on{border-color:var(--brand);color:var(--brand);font-weight:500}
details.node{border-radius:12px;overflow:hidden}
details.node>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
details.node>summary::-webkit-details-marker{display:none}
details.node .kids{padding:0 0 8px 22px;display:flex;flex-direction:column;gap:6px}
.leaf{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px}
.pg{margin-left:auto;font-size:11px;opacity:.8;white-space:nowrap}
.quizcard{min-height:220px;display:flex;flex-direction:column;justify-content:space-between;touch-action:pan-y;transition:transform .2s}
.sortrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;border:0.5px solid var(--line,#ccc)}
.sortrow .bins{display:flex;gap:4px}.sortrow .bins button{padding:6px 10px;font-size:13px}
.sortrow .bins button.on{outline:2px solid var(--ru-fg)}
.sortrow.right,.opt.right{background:var(--su-bg);color:var(--su-ink)}.sortrow.wrong,.opt.wrong{background:var(--pb-bg);color:var(--pb-ink)}
.flowpick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.flowpick button{font-size:13px;padding:6px 10px}.flowpick button.on{outline:2px solid var(--brand,#1D9E75)}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);width:min(92vw,420px);background:#0F3D2E;color:#fff;border:1px solid #FAC775;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast b{color:#FAC775}
.sapa input{width:100%;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line,#ccc);background:transparent;color:inherit;margin-top:10px}
.feedback{font-size:14px;padding:10px 12px;border-radius:10px;margin-top:10px}
.ok{background:var(--su-bg);color:var(--su-ink)} .no{background:var(--pb-bg);color:var(--pb-ink)}
.flash{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:18px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:center;gap:4px;z-index:5}
.nav button{border:none;background:none;flex:1;max-width:120px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;min-height:52px;color:var(--muted)}
.nav button.on{color:var(--brand);font-weight:500}
.rk{display:inline-block;font:600 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#E8ECF4;color:#2B3A55;border:1px solid #C9D2E3;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle;white-space:nowrap;user-select:all}
.rvbar{position:sticky;top:0;z-index:50;background:#B4232A;color:#fff;font-size:12.5px;font-weight:600;text-align:center;padding:7px 10px;margin:0 -16px 12px;letter-spacing:.02em}
.rvbar a{color:#FFE7A3}
.rvguide ol{margin:6px 0 0 18px;padding:0}.rvguide li{margin:3px 0;font-size:13.5px}.rvguide td{font-size:12.5px;padding:3px 6px;vertical-align:top;border-top:1px solid var(--line,#e5e5e5)}
.hlogo{position:absolute;top:16px;right:16px;width:60px;height:auto;z-index:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.hero .hk:first-child{padding-right:70px}
.vlogo{position:relative;z-index:1;display:block;width:112px;height:auto;margin:4px auto 18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.mianbar{background:#fff;border-radius:14px;padding:8px 12px;margin-bottom:10px;display:flex;justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.mianbar img{height:46px;width:auto;display:block}
.mianv{display:flex;justify-content:center;background:#fff;border-radius:18px;padding:16px 0 12px;margin-bottom:12px}
.mianv img{width:120px;height:auto;display:block}
.banner{background:var(--sy-bg);color:var(--sy-ink);font-size:13px;border-radius:10px;padding:10px 12px}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:8px}
textarea{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);min-height:70px}
.hidden{display:none}
.pstrip{display:flex;gap:4px;margin:10px 0 12px}
.pstrip button{flex:1;height:8px;min-height:8px;padding:0;border:none;border-radius:4px}
.pst{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pst.open{border-color:color-mix(in srgb,var(--mmc) 45%,var(--line))}
.phead{width:100%;border:none;border-radius:0;background:none;display:flex;align-items:center;gap:10px;padding:10px 12px;text-align:left}
.phead .ico{color:var(--muted);width:18px;height:18px}
.pnum{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:color-mix(in srgb,var(--mmc) 16%,var(--card));color:var(--mmc)}
.pst.open .pnum{background:var(--mmc);color:#fff}
.plist{padding:0 12px 6px 50px}
.prow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 0;border:none;border-top:1px solid var(--line);border-radius:0;background:none;font-size:14px;text-align:left;min-height:42px}
.prow.sub{padding-left:16px;font-size:13px;color:var(--muted)}
.pdot{width:9px;height:9px;border-radius:50%;flex:none}
.pgo{color:var(--brand);font-size:13px;font-weight:500;white-space:nowrap}
.pgo.dim{color:var(--muted);font-weight:400}
.kaidah{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px}
.kaidah .kl{font-size:11px;letter-spacing:.08em;font-weight:700;color:#FAC775;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.kaidah .kl .ico{width:15px;height:15px}
.warn{border:1.5px solid var(--pb-fg);background:var(--pb-bg);color:var(--pb-ink);border-radius:12px;padding:10px 12px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{font-size:13px;padding:8px;min-height:44px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
.mrow{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:12px}
.stat{margin-left:auto;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--card)}
.mgrid{width:100%;border-collapse:separate;border-spacing:3px;font-size:13px}
.mgrid td{padding:7px 3px;border-radius:6px;text-align:center;vertical-align:middle}
.mgrid td .ico{width:17px;height:17px;stroke-width:2.6;vertical-align:middle}
.mm-root{border-radius:16px;padding:14px 16px;color:#fff;display:flex;align-items:center;gap:14px}
.mm{position:relative;margin-top:16px;padding-left:38px}
.mm:before{content:'';position:absolute;left:14px;top:10px;bottom:24px;width:3px;border-radius:3px;background:var(--mmc);opacity:.35}
.mm-st{position:relative;margin-bottom:12px}
.mm-dot{position:absolute;left:-38px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--mmc);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--bg)}
.mm-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--mmc);border-radius:0 14px 14px 0;padding:10px 12px}
.mm-t{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mmc);font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:999px;padding:6px 11px;font-size:13px;min-height:34px;line-height:1.25;text-align:left;cursor:default}
.chip .ico{width:15px;height:15px}
.chip.sub{background:transparent;border:1px dashed currentColor;font-size:12px;min-height:30px;padding:4px 10px}
.chip.go{box-shadow:inset 0 0 0 1.5px currentColor;font-weight:500;cursor:pointer}
.chip .gt{font-weight:700;margin-left:2px}
.open{min-height:32px;padding:4px 10px;font-size:12px;border-radius:8px;flex:none}
.fitem{border-radius:12px;padding:10px 12px}
.fitem .ar{font-size:16px;line-height:1.4}
.fnum{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;background:var(--card)}
.fmore summary{cursor:pointer;color:var(--brand);font-size:13px;margin-top:6px}
.fmore p{font-size:13px;margin-top:6px}

#disc{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
#disc .dbox{background:var(--card,#fff);color:var(--ink,#1F2A37);border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.dbtn{background:#0F5C4A;color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.dbtn2{background:transparent;color:inherit;border:1px solid var(--line,#ccc);border-radius:10px;padding:11px 16px;font:inherit;cursor:pointer}
.warn{background:#FFF1CC;color:#4A3500;border:1px solid #E8C766;border-radius:14px;padding:14px;margin-top:14px}
.warn .dbtn2{border-color:#C9A63F;color:#4A3500}
@media (prefers-color-scheme:dark){.warn{background:#3A2E0B;color:#F6E3A6;border-color:#6B5513}.warn .dbtn2{border-color:#8A6F1B;color:#F6E3A6}}
</style>

q2:{q:'Berapa banyak airnya?',more:'Dua qullah secara bahasa berarti dua tempayan besar. Secara syar\'i kira-kira 500 rithl Baghdad. Konversinya ke liter diperselisihkan ulama kontemporer, dan syarah menyarankan mengambil angka yang lebih besar sebagai kehati-hatian. (hlm. 116)',o:[['Kurang dari dua qullah (air sedikit)','q3'],['Dua qullah atau lebih (air banyak)','q4']]},
q3:{q:'Apakah najisnya termasuk yang dimaafkan?',h:[
 ['Sedikit bulu najis, bukan dari anjing atau babi','Bulu najis yang banyak juga dimaafkan bila berasal dari hewan tunggangan, karena sulit dihindari. Ukuran sedikit dan banyak dikembalikan pada kebiasaan (\'urf). (hlm. 117)'],
 ['Bangkai hewan yang darahnya tidak mengalir, misalnya lalat','Yaitu hewan yang darahnya tidak mengalir saat tubuhnya dibelah ketika hidup, seperti cicak dan yang lebih kecil. Syaratnya: tidak mengubah air walau sedikit, dan tidak dilemparkan setelah mati, kecuali oleh angin atau hewan. (hlm. 117)'],
 ['Najis yang tidak terlihat oleh mata normal','Syaratnya bukan karena perbuatan orang itu sendiri. Ibn Hajar menambah syarat: bukan najis anjing atau babi. Ar-Ramli tidak membedakannya. (hlm. 118)'],
 ['Najis pada dubur burung atau tikus yang jatuh ke air','Hewan selain manusia. Syaratnya tidak ada najis lain dari luar yang menempel. Tetap dimaafkan walau airnya sedikit. Sebagian ulama menyamakan najis di kaki dan mulutnya. (hlm. 118)'],
 ['Sedikit debu kotoran hewan','Dimaafkan karena sulit dihindari. Tidak menajiskan air, juga anggota badan dan pakaian yang basah. (hlm. 118)'],

function viewMatriks(key){

  const S2={H:['Haram','cat-pembatal','i-ban','✕'],B:['Boleh','cat-sunnah','i-check','✓'],S:['Haram bila mengotori','cat-pembatal','i-ban','✕*'],R:['Perlu konfirmasi','cat-makruh','i-quiz','?']};
  let h=`<button onclick="btab='pohon';go('bab-${F.bab}')" class="row">${ico('i-left')}${r.name}</button>
  <p class="muted" style="margin-top:14px">${r.name} · al-Bayan hlm. ${F.p}</p><p class="ar" style="margin:6px 0 2px;font-size:17px">${F.ar}</p><h1 style="margin:0">${F.judul}</h1><p class="muted" style="margin:6px 0 12px">${F.intro}</p>${matanHTML(F)}
  <p style="font-size:13px;font-weight:500;margin-bottom:6px">Pilih keadaan</p><div class="seg">${F.states.map((s,i)=>`<button class="${MX===i&&!MXG?'on':''}" onclick="MX=${i};MXG=false;render()">${s}</button>`).join('')}</div>
  <button style="width:100%;margin-top:6px;font-size:13px" onclick="MXG=!MXG;render()">${MXG?'Kembali ke satu keadaan':'Lihat semua keadaan sekaligus'}</button>`;
  if(MXG){
    h+=`<table class="mgrid" style="margin-top:14px"><tr><td></td>${F.short.map(s=>`<td style="font-size:11px;font-weight:700">${s}</td>`).join('')}</tr>`+F.rows.map(x=>`<tr><td style="text-align:left;font-size:12px">${x.t}</td>${x.s.split('').map(c=>`<td class="${S2[c][1]}" style="font-weight:700">${c==='H'?ico('i-x'):c==='B'?ico('i-check'):c==='S'?ico('i-x')+'*':'?'}</td>`).join('')}</tr>`).join('')+`</table><p class="muted" style="margin-top:6px">✕ haram · ✓ boleh · ✕* haram bila khawatir mengotori · ? perlu konfirmasi.</p><div class="kaidah" style="margin-top:10px"><div class="kl">${ico('i-scale')} POLA</div>Tiap keadaan menambah larangan dari keadaan sebelumnya: 4 → 6 → 9. Begitu darah berhenti, puasa kembali halal, sedangkan yang lain menunggu mandi.</div>`;
  }else{
    const n=F.rows.filter(x=>x.s[MX]!=='B').length;
    h+=`<p style="margin:14px 0 8px"><b>${n}</b> dari ${F.rows.length} perbuatan terlarang saat <b>${F.states[MX].toLowerCase()}</b></p><div class="stack" style="gap:6px">`+F.rows.map(x=>{const st=S2[x.s[MX]];return `<div class="mrow ${st[1]}">${ico(st[2])}<div style="flex:1"><b style="font-size:14px">${x.t}</b>${rk('F'+F.p+'.'+(F.rows.indexOf(x)+1))}${x.more?`<details class="fmore"><summary>Selengkapnya</summary><p>${x.more}</p><p class="muted" style="margin-top:4px">al-Bayan hlm. ${x.p}</p></details>`:''}</div><span class="stat">${st[0]}</span></div>`}).join('')+`</div>`;
    h+=F.kaidah.filter(k=>k.st.includes(MX)).map(k=>k.warn?`<div class="warn" style="margin-top:10px"><b>Peringatan.</b> ${k.t}<div style="font-size:11px;margin-top:4px">al-Bayan hlm. ${k.p}</div></div>`:`<div class="kaidah" style="margin-top:10px"><div class="kl">${ico('i-scale')} KAIDAH</div>${k.t}<div style="font-size:11px;opacity:.7;margin-top:4px">al-Bayan hlm. ${k.p}</div></div>`).join('');
  }
  return h+`<div class="banner" style="margin-top:14px">Draf dari OCR al-Bayan, belum direview. Tanda "Perlu konfirmasi" ditanyakan ke ustadz.</div>`;
}

  let h=`<button onclick="btab='pohon';go('bab-${F.bab}')" class="row">${ico('i-left')}${r.name}</button>
  <p class="muted" style="margin-top:14px">${r.name} · al-Bayan hlm. ${F.p}</p>
  <p class="ar" style="margin:6px 0 2px">${F.ar}</p>

  h+=F.items.map((it,i)=>`<div class="fitem cat-${F.c}"><div class="row" style="align-items:flex-start"><span class="fnum" style="color:var(--${v}-fg)">${i+1}</span><div style="flex:1"><div class="row" style="justify-content:space-between;align-items:baseline;gap:8px"><b style="font-size:15px">${it.t}${rk('F'+F.p+'.'+(i+1))}</b><span class="ar">${it.ar}</span></div>${it.n?`<p style="font-size:13px;margin-top:2px">${it.n}</p>`:''}${more(it.more,it.p,it.tm)}</div></div></div>`).join('');
  h+=(F.kaidah||[]).map((k,j)=>`<div class="kaidah"><div class="kl">${ico('i-scale')} KAIDAH${rk('F'+F.p+'.KD'+(j+1))}</div>${k.t}<div style="font-size:11px;opacity:.7;margin-top:4px">al-Bayan hlm. ${k.p}</div></div>`).join('');
  h+=`</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px">`;
  h+=F.quiz?`<button onclick="goQuiz(${F.quiz})">${ico('i-quiz')} Kuis fasal ini</button>`:`<button onclick="document.getElementById('qmsg').textContent='Kuis fasal ini disusun dari transkrip video.'">${ico('i-quiz')} Kuis fasal ini</button>`;
  h+=F.banding?`<button onclick="go('banding-${key}')">${ico('i-cards')} Bandingkan: ${DETAIL[F.banding].judul.toLowerCase()}</button>`:`<span></span>`;
  h+=`</div>${F.flow?(()=>{const FF=(FLOWS[F.bab]||[]).find(x=>x.id===F.flow);return FF?`<button style="width:100%;margin-top:8px;text-align:left" onclick="btab='alur';FL={f:'${FF.id}',node:'${FF.start}',path:[]};go('bab-${F.bab}')">${ico('i-quiz')} Diagram alur: ${FF.judul}</button>`:''})():''}<p id="qmsg" class="muted" style="margin-top:6px"></p><div class="banner" style="margin-top:14px">Draf, belum direview. Matan dari cetakan al-Bayan (tidak tersedia di Shamela).</div>`;

}
window.goQuiz=function(n){go('sesi-'+n);tab='kuis';};
let FL={f:null,node:null,path:[]};
function flowHTML(rid){
  const fs=FLOWS[rid]||[];
  if(!fs.length)return `<div class="banner">Diagram alur bab ini disusun setelah transkrip tersedia.</div>`;
  if(!FL.f||!fs.find(x=>x.id===FL.f)){FL={f:fs[0].id,node:fs[0].start,path:[]};}
  const F=fs.find(x=>x.id===FL.f);if(!FL.node||!F.N[FL.node]){FL.node=F.start;FL.path=[];}const n=F.N[FL.node];
  const more=t=>`<details style="margin-top:6px"><summary class="muted" style="cursor:pointer;color:var(--brand)">Selengkapnya</summary><p style="font-size:13px;margin-top:6px">${t}</p></details>`;
  let h=(fs.length>1?`<div class="flowpick">${fs.map(x=>`<button class="${x.id===F.id?'on':''}" onclick="FL={f:'${x.id}',node:'${x.start}',path:[]};render()">${x.judul}</button>`).join('')}</div>`:'')+`<p class="muted">${F.ref}</p><h3 style="margin:2px 0 10px">${F.judul}</h3>${typeof matanHTML==='function'?matanHTML(F):''}`;
  h+=FL.path.map(x=>`<div class="row muted" style="gap:6px">${ico('i-check')}${x}</div>`).join('');
  if(n.r){const ok=n.r==='suci'||n.r==='ok',inf=n.r==='info';h+=`<div class="card ${ok?'cat-sunnah':inf?'cat-syarat':'cat-pembatal'}" style="border:none;margin-top:10px"><div class="row">${ico(ok?'i-check':inf?'i-quiz':'i-ban','lg')}<b style="font-size:18px">${n.t}</b>${rk('A:'+F.id+'/'+FL.node)}</div><p style="font-size:14px;margin-top:8px">${n.d}</p><p style="font-size:12px;margin-top:4px">Rujukan: al-Bayan ${n.p}</p></div>`;}
  else{h+=`<div class="card" style="margin-top:10px"><b>${n.q}</b>${rk('A:'+F.id+'/'+FL.node)}${n.more?more(n.more):''}${n.h?`<div class="stack" style="margin-top:10px">${n.h.map(x=>`<div class="leaf cat-netral" style="display:block;font-size:13px">${x[0]}${more(x[1])}</div>`).join('')}</div>`:''}<div class="stack" style="margin-top:12px">${n.o.map((o,i)=>`<button style="text-align:left" onclick="flowPick(${i})">${o[0]}</button>`).join('')}</div></div>`;}
  h+=`<div class="row" style="justify-content:space-between;margin-top:10px"><span class="muted">Draf, wajib review</span><button onclick="FL.node=null;FL.path=[];render()">Ulang</button></div>`;
  return h;
}
window.flowPick=function(i){const F=Object.values(FLOWS).flat().find(x=>x.id===FL.f);const o=F.N[FL.node].o[i];FL.path.push(o[0]);FL.node=o[1];render();
  if(F.N[FL.node].r){S.flowDone=S.flowDone||{};if(!S.flowDone[F.id]){S.flowDone[F.id]=1;save();toast(pick([`<b>Bagus${nm()}!</b> Kamu sampai di kesimpulan. Coba tekan Ulang dan pilih jalur lain.`,`<b>Sudah sampai${nm()}!</b> Bandingkan dengan jalur lain supaya polanya terlihat.`]));}}};

const FLASH1=[
 {f:'Siapa penulis matan ini?',b:'Abdullah bin Abdurrahman Bafadhl. Menurut ustadz: lahir di Tarim 850 H, wafat Ramadhan 918 H. Kitab ini ringkasan dari karyanya al-Muqaddimah al-Hadhramiyyah.',c:'netral',tm:178},
 {f:'Apa hukum mempelajari isi kitab ini?',b:'Wajib dipelajari dan diajarkan kepada yang membutuhkan: laki-laki dan perempuan, anak dan dewasa, budak dan merdeka (mukadimah matan).',c:'netral',tm:549},
 {f:'Thaharah secara bahasa dan istilah?',b:'Bahasa: bersih dari kotoran. Istilah: mengangkat hadats, menghilangkan najis, atau yang semakna dengan keduanya (tayammum, istinja\' dengan batu).',c:'netral',tm:838},
 {f:'Berapa fardhu wudhu? Sebutkan.',b:'Enam: niat, membasuh wajah, kedua tangan bersama siku, mengusap sebagian kepala, kedua kaki bersama mata kaki, tertib.',c:'rukun',tm:964},
 {f:'Lafaz niat wudhu menurut matan?',b:'Salah satu: niat mengangkat hadats, atau thaharah untuk shalat, atau (fardhu) wudhu.',c:'rukun',tm:1058},
 {f:'Kapan niat wudhu dihadirkan?',b:'Saat awal membasuh wajah. Saat membasuh telapak tangan dan berkumur, niatkan sunnah wudhu.',c:'rukun',tm:1058},
 {f:'Niat wudhu penderita salisul baul?',b:'Niat istibahah (agar boleh shalat), bukan mengangkat hadats.',c:'rukun',tm:1058},
 {f:'Batas wajah dalam wudhu?',b:'Panjang: dari tempat tumbuh rambut kepala yang biasa sampai bawah dagu. Lebar: dari telinga ke telinga.',c:'rukun',tm:1280},
 {f:'Bagian wajah yang tidak wajib dibasuh sampai ke dalam?',b:'Bagian dalam jenggot tebal dan dua cambang (\'aridh) tebal. Kumis dan alis tetap wajib sampai dalam walaupun tebal.',c:'rukun',tm:1280},
 {f:'Kapan jenggot disebut "tebal"?',b:'Kulit di bawahnya tidak terlihat dari jarak orang bercakap, kira-kira 1–1,5 m (perkiraan dari ustadz).',c:'rukun',tm:1280},
 {f:'Mengapa siku ikut dibasuh, bahkan dilebihkan?',b:'Matan: مَعَ مِرْفَقَيْهِ. Kaidah: مَا لَا يَتِمُّ الْوَاجِبُ إِلَّا بِهِ فَهُوَ وَاجِبٌ — yang wajib tak sempurna kecuali dengannya, ikut wajib.',c:'netral',tm:1466},
 {f:'Minimal mengusap kepala?',b:'Sebagian kulit atau rambut kepala, walau sehelai, asal masih dalam batas kepala. Cukup ada basah yang sampai.',c:'rukun',tm:1590},
 {f:'Berapa sunnah wudhu dalam matan?',b:'14: siwak, basmalah, membasuh telapak tangan, berkumur, istinsyaq & istintsar, tiga kali, mengusap seluruh kepala, telinga & lubangnya, takhlil jenggot tebal, takhlil jari, memanjangkan ghurrah & tahjil, muwalah, tidak minta dituangkan, tidak mengeringkan dengan kain.',c:'sunnah',tm:1842},
 {f:'Kapan bersiwak dalam wudhu?',b:'Ada khilaf. Ibnu Hajar: setelah membasuh telapak tangan, tanpa niat tersendiri. Ar-Ramli: sebelumnya, dengan niat tersendiri.',c:'sunnah',tm:1842},
 {f:'Lupa basmalah di awal wudhu?',b:'Baca di tengah wudhu: بِسْمِ اللهِ أَوَّلَهُ وَآخِرَهُ.',c:'sunnah',tm:2060},
 {f:'Membasuh telapak tangan sebelum dicelup ke wadah air sedikit?',b:'Sunnah 3 kali bila tidak yakin tangannya suci. Bila yakin najis, haram mencelupkannya.',c:'sunnah',tm:2154},
 {f:'Madhmadhah & istinsyaq: minimal, afdhal, dan hukum meninggalkannya?',b:'Minimal: air masuk mulut/hidung. Afdhal: digerakkan, ditarik, lalu dikeluarkan (istintsar). Meninggalkannya makruh menurut Syafi\'iyyah, karena Imam Ahmad mewajibkannya.',c:'sunnah',tm:2220},
 {f:'Mengapa disunnahkan mengusap seluruh kepala?',b:'Keluar dari khilaf: Hanabilah mewajibkan seluruh kepala, Hanafiyah seperempat. Caranya: ibu jari di pelipis, tarik ke tengkuk, lalu kembalikan bila rambutnya bisa berbalik.',c:'sunnah',tm:2441},
 {f:'Cara mengusap telinga?',b:'Usap luar dan dalam serta kedua lubangnya: telunjuk diputar di lubang telinga, ibu jari di bagian luar.',c:'sunnah',tm:2534},
 {f:'Cara takhlil jari kaki?',b:'Dengan kelingking tangan kiri, mulai dari kelingking kaki kanan, berakhir di kelingking kaki kiri. Jari tangan: tasybik.',c:'sunnah',tm:2596},
 {f:'Ghurrah dan tahjil?',b:'Ghurrah: melebihkan basuhan wajah. Tahjil: melebihkan basuhan tangan dan kaki, paling jauh sampai lengan atas dan betis.',c:'sunnah',tm:2721},
 {f:'Apa itu muwalah dan hukumnya?',b:'Membasuh anggota berikutnya sebelum yang sebelumnya kering. Sunnah menurut Syafi\'i; ditinggalkan pun wudhu tetap sah.',c:'sunnah',tm:2812},
 {f:'Dua sunnah yang berupa "meninggalkan"?',b:'Tidak minta dituangkan air tanpa uzur, dan tidak mengeringkan anggota wudhu dengan kain.',c:'sunnah',tm:2875},
 {f:'Berapa pembatal wudhu? Sebutkan.',b:'Empat: keluar sesuatu dari qubul atau dubur; hilang akal; bersentuhan kulit laki-laki dan perempuan dewasa yang bukan mahram; menyentuh qubul manusia atau lingkaran duburnya dengan bagian dalam telapak/jari.',c:'pembatal',tm:2943},
 {f:'Keluar mani: batal wudhu?',b:'Tidak membatalkan wudhu, tetapi mewajibkan mandi. Pengecualian ini dari syarah (hlm. 71), bukan teks matan.',c:'pembatal',tm:3038},
 {f:'Tidur yang tidak membatalkan wudhu?',b:'Tidur dengan pantat menetap di tempat duduk (mutamakkin). Patokan Syafi\'iyyah posisi, bukan nyenyaknya. Kantuk (masih mendengar orang) tidak membatalkan; ragu tidur atau kantuk juga tidak.',c:'pembatal',tm:3102},
 {f:'Syarat sentuhan kulit yang membatalkan wudhu?',b:'Laki-laki dan perempuan, keduanya sudah mencapai usia yang menimbulkan syahwat (tidak harus baligh), bukan mahram, dan yang bersentuhan kulit, bukan gigi, kuku, atau rambut.',c:'pembatal',tm:3227},
 {f:'Mahram ada berapa, menurut ustadz?',b:'18: 7 karena nasab, 7 karena persusuan, 4 karena pernikahan (mertua, anak tiri bila ibunya sudah digauli, ibu tiri, menantu). Rincian ini perlu dicek ke al-Bayan.',c:'netral',tm:3227},
 {f:'Bagian tangan yang membatalkan saat menyentuh kemaluan?',b:'Bagian dalam telapak dan jari, yaitu bagian yang tidak terlihat saat kedua telapak ditempelkan. Ujung jari dan sela-selanya tidak membatalkan.',c:'pembatal',tm:3507},
 {f:'Apa yang haram bagi orang berhadats kecil?',b:'Shalat (wajib/sunnah), thawaf apa pun, menyentuh mushaf (termasuk sampul, tali, kotaknya), membawa mushaf, dan menyentuh papan bertuliskan ayat untuk belajar. Boleh membawanya di antara barang atau pada dirham; anak mumayyiz boleh untuk belajar.',c:'pembatal',tm:3570}
];

 {t:'pg',q:'Saat mandi junub, Ahmad cukup berniat "aku niat mandi". Bagaimana niatnya?',

const FLASH2=[
 {f:'Kaki mana yang didahulukan masuk dan keluar WC?',b:'Masuk kaki kiri, keluar kaki kanan. Kaidah (an-Nawawi): hal mulia dengan kanan, kebalikannya dengan kiri.',c:'sunnah',tm:57},
 {f:'Kaidah hukum larangan dan perintah di bab adab?',b:'Larangan asalnya makruh, perintah asalnya sunnah. Bisa naik menjadi haram atau wajib karena sebab lain.',c:'netral',tm:90},
 {f:'Membawa nama Allah, Rasul, atau Al-Qur\'an ke WC?',b:'Makruh walau disembunyikan (muktamad), termasuk nama nabi dan malaikat. Al-Adzra\'i: haram membawa masuk mushaf tanpa darurat.',c:'makruh',tm:120},
 {f:'Menjauh dan menutup diri saat buang hajat: ukurannya?',b:'Menjauh sampai suara dan bau tak terasa. Penutup ±2/3 hasta bila duduk (sampai pusar bila berdiri), berjarak paling jauh ±3 hasta (±1,5 m). Angka dari ustadz.',c:'sunnah',tm:213},
 {f:'Kencing di air tergenang dan air mengalir?',b:'Makruh di air tergenang, sedikit atau banyak (kecuali seluas laut/danau), dan di air mengalir yang sedikit. Malam hari makruh secara mutlak.',c:'makruh',tm:434},
 {f:'Mengapa makruh kencing di lubang (juhr)?',b:'Bisa menyakiti hewan lemah atau membahayakan diri (ular, kalajengking). Bila diduga kuat menyakiti hewan muhtaram, haram.',c:'makruh',tm:529},
 {f:'Tempat lain yang makruh untuk buang hajat (matan)?',b:'Arah hembusan angin, tempat bernaung yang dituju orang, jalan yang dilalui, dan di bawah pohon berbuah (walau belum musim).',c:'makruh',tm:595},
 {f:'Berbicara saat buang hajat?',b:'Makruh kecuali darurat; bisa wajib, misalnya memperingatkan orang buta yang hampir jatuh ke sumur. Dzikir dan Qur\'an makruh sepanjang berada di sana (muktamad).',c:'makruh',tm:849},
 {f:'Apa itu istibra\'?',b:'Membersihkan sisa kencing, misalnya dengan berdehem atau mengurut perlahan.',c:'sunnah',tm:1006},
 {f:'Doa masuk WC?',b:'بِاسْمِ اللهِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ — perlindungan dari setan laki-laki dan perempuan. Dibaca walau masuk bukan untuk buang hajat.',c:'sunnah',tm:1037},
 {f:'Doa keluar WC dan hikmah "ghufranaka"?',b:'غُفْرَانَكَ، الْحَمْدُ لِلَّهِ الَّذِي أَذْهَبَ عَنِّي الْأَذَى وَعَافَانِي. Minta ampun karena tidak berdzikir selama di sana, atau khawatir kurang bersyukur atas nikmat makan hingga keluarnya kotoran (ustadz condong ke yang kedua).',c:'sunnah',tm:1037},
 {f:'Berapa sebab wajib mandi? Sebutkan.',b:'Lima: jimak (masuk hasyafah), keluar mani, haid, nifas, melahirkan.',c:'netral',tm:1286},
 {f:'Batas jimak yang mewajibkan mandi?',b:'Masuknya hasyafah (atau seukurannya bila terpotong) ke farji, walau dubur, mayit, atau hewan — tanpa harus keluar mani.',c:'netral',tm:1316},
 {f:'Kapan mani dihitung "keluar"?',b:'Laki-laki: keluar dari ujung hasyafah. Perawan: keluar dari farji. Bukan perawan: sampai ke bagian yang tampak saat jongkok.',c:'netral',tm:1347},
 {f:'Ciri-ciri mani?',b:'Keluar dengan syahwat lalu lemas; memancar bertahap; bau seperti adonan roti saat basah, seperti putih telur saat kering. Satu ciri sudah cukup.',c:'netral',tm:1347},
 {f:'Melahirkan dan keguguran: wajib mandi?',b:'Wajib walau kering tanpa darah, termasuk \'alaqah/mudhghah yang dinyatakan bidan calon manusia. Operasi caesar: menurut al-Bajuri tetap wajib (ada pendapat lain).',c:'netral',tm:1535},
 {f:'Angka hafalan sejauh ini?',b:'Fardhu wudhu 6, pembatal wudhu 4, fardhu mandi 2.',c:'rukun',tm:1664},
 {f:'Lafaz niat mandi wajib dan waktunya?',b:'Mengangkat janabah, hadats besar, atau fardhu mandi. Niat "mandi" saja tidak cukup. Dihadirkan bersama basuhan pertama di bagian tubuh mana pun.',c:'rukun',tm:1694},
 {f:'Meratakan air dalam mandi: ada pengecualian?',b:'Tidak. Seluruh rambut tebal maupun tipis dan seluruh kulit, sampai bagian bawah kulup bagi yang belum khitan.',c:'rukun',tm:1820},
 {f:'Sunnah mandi dalam matan?',b:'Tujuh: siwak, basmalah, wudhu sebelum mandi, memperhatikan lipatan, menyela pangkal rambut, menggosok (dalk), tiga kali.',c:'sunnah',tm:1945},
 {f:'Wudhu sebelum mandi: kakinya?',b:'Disempurnakan sampai kaki. Al-Ghazali: membasuh kaki diakhirkan setelah mandi.',c:'sunnah',tm:1945},
 {f:'Hukum dalk (menggosok) saat mandi?',b:'Sunnah menurut Syafi\'i; wajib menurut Malikiyah.',c:'sunnah',tm:2198},
 {f:'Syarat thaharah menurut matan?',b:'Tiga: Islam, tamyiz, air suci menyucikan. Ustadz menambah dari syarah, antara lain: bebas haid/nifas, tak ada penghalang air, air mengalir ke anggota, mengetahui kefardhuan.',c:'syarat',tm:2329},
 {f:'Apa itu air mutlak?',b:'Air yang turun dari langit (hujan, salju, embun) atau keluar dari bumi (sungai, laut, mata air, sumur). Hanya air ini yang sah untuk hadats dan najis.',c:'syarat',tm:2582},
 {f:'Kapan air berubah oleh benda suci tidak sah dipakai?',b:'Bila perubahannya banyak (namanya berubah), bendanya menyatu (mukhalith), suci, dan bisa dihindari air — seperti za\'faran, usynan, gipsum, kapur, celak.',c:'syarat',tm:2614},
 {f:'Perubahan air yang dimaafkan?',b:'Karena lama tergenang, tanah, lumut, benda di tempat diam/aliran air yang sulit dihindari, dan benda yang hanya berdekatan (mujawir) seperti gaharu dan minyak wangi.',c:'syarat',tm:2897},
 {f:'Apa itu air musta\'mal?',b:'Air sedikit (kurang dari dua qullah) bekas basuhan wajib yang pertama. Basuhan kedua dan ketiga tidak menjadikannya musta\'mal. Tidak sah untuk bersuci.',c:'syarat',tm:3086},
 {f:'Apa itu niat ightiraf?',b:'Niat menciduk saat memasukkan tangan ke air sedikit setelah membasuh wajah (wudhu) atau setelah niat (mandi), agar sisa air tidak musta\'mal. Ustadz: masalah rumit, jangan dibebankan ke orang awam; sebagian ulama (al-Baghawi, al-Ghazali) tidak mewajibkannya.',c:'syarat',tm:3208},
 {f:'Air sedikit dan cairan lain terkena najis?',b:'Air kurang dari dua qullah, dan cairan selain air berapa pun banyaknya, langsung najis walau tidak berubah. Dua qullah ±200–216 L (ustadz menyebut beberapa versi).',c:'pembatal',tm:3459},
 {f:'Najis yang dimaafkan pada air sedikit (matan)?',b:'Bulu najis yang sedikit; bangkai hewan yang darahnya tidak mengalir; najis yang tak terlihat mata; sisa di dubur burung dan tikus; sedikit debu kotoran hewan; sisa minum kucing yang makan najis lalu pergi dan mungkin minum di air banyak.',c:'pembatal',tm:3585}
];

 {f:'Cara afdhal berkumur dan istinsyaq?',b:'Tiga cidukan; setiap cidukan untuk berkumur dan istinsyaq sekaligus (jawaban ustadz di sesi tanya-jawab).',c:'sunnah',tm:25},

const FLASH4=[
 {f:'Minimal haid? Bagaimana bila terputus-putus?',b:'Sehari semalam (24 jam), bersambung atau dijumlah dalam 15 hari. 2 jam × 15 hari = 30 jam → haid; 1 jam × 15 hari = 15 jam → istihadhah. Kapas yang ternoda berarti darah masih keluar.',c:'netral',tm:40},
 {f:'Maksimal dan umumnya haid?',b:'Maksimal 15 hari; umumnya 6 atau 7 hari (matan).',c:'netral',tm:40},
 {f:'Masa suci di antara dua haid?',b:'Minimal 15 hari, umumnya 23–24 hari, maksimal tidak terbatas (syarah).',c:'netral',tm:736},
 {f:'Yang haram karena haid dan janabah?',b:'Shalat, thawaf, menyentuh mushaf, membawanya, berdiam di masjid, membaca Al-Qur\'an dengan maksud tilawah.',c:'pembatal',tm:200},
 {f:'Membaca ayat dengan maksud dzikir saat junub/haid?',b:'Tidak haram, misalnya doa naik kendaraan atau istirja\' (inna lillahi…) yang diniatkan dzikir atau nasihat.',c:'netral',tm:200},
 {f:'Yang haram khusus bagi wanita haid?',b:'Puasa; melewati masjid bila khawatir mengotorinya; istimta\' antara pusar dan lutut tanpa penghalang.',c:'pembatal',tm:356},
 {f:'Wanita haid melewati masjid: rinciannya?',b:'Khawatir mengotori → haram. Aman → makruh. Aman dan ada kebutuhan → tidak makruh.',c:'makruh',tm:356},
 {f:'Hal lain yang diharamkan terkait haid?',b:'Jimak saat haid termasuk dosa besar (matan). Ustadz menambah: suami haram menalak istri saat haid; haram bersuci dengan niat ibadah (kecuali mandi-mandi sunnah manasik).',c:'pembatal',tm:356},
 {f:'Qadha bagi wanita haid?',b:'Wajib qadha puasa Ramadhan, tidak qadha shalat.',c:'netral',tm:514},
 {f:'Darah haid berhenti tapi belum mandi: apa yang sudah halal?',b:'Puasa (matan). Menurut ustadz juga talak dan bersuci dengan niat ibadah. Yang lain tetap haram sampai mandi.',c:'netral',tm:514},
 {f:'Apa itu nifas?',b:'Darah yang keluar setelah melahirkan, yaitu setelah rahim kosong (anak kembar: setelah semuanya lahir). Darah sebelum atau bersamaan dengan bayi bukan nifas. Hukumnya sama dengan haid.',c:'netral',tm:609},
 {f:'Kapan darah setelah melahirkan masih dihitung nifas?',b:'Bila mulai keluar dalam 15 hari sejak melahirkan. Mulai hari ke-7 → nifas; mulai hari ke-20 → haid.',c:'netral',tm:609},
 {f:'Masa nifas?',b:'Minimal setetes atau sesaat, maksimal 60 hari, umumnya 40 hari (syarah).',c:'netral',tm:609},
 {f:'Mendahulukan shalat sebelum waktunya atau menundanya keluar waktu tanpa uzur?',b:'Termasuk dosa besar (matan).',c:'pembatal',tm:797},
 {f:'Waktu zhuhur dan ashar?',b:'Zhuhur: dari zawal sampai bayangan benda sama panjang dengannya (selain bayangan istiwa\'). Ashar: setelah itu, ditambah sedikit, sampai matahari terbenam.',c:'syarat',tm:898},
 {f:'Waktu maghrib, isya, subuh?',b:'Maghrib: terbenam bulatan matahari sampai hilang mega merah (pendapat terpilih). Isya: hilang mega merah sampai fajar shadiq. Subuh: fajar shadiq sampai matahari terbit.',c:'syarat',tm:898},
 {f:'Amal paling utama terkait waktu shalat?',b:'Bersegera shalat di awal waktu. Keutamaannya tetap didapat walau sibuk dengan persiapan: bersuci, menutup aurat, adzan, iqamah.',c:'sunnah',tm:1155},
 {f:'Syarat ibrad (menunda zhuhur)?',b:'Sangat panas, di negeri panas, untuk yang shalat berjamaah, di masjid yang jauh.',c:'sunnah',tm:1155},
 {f:'Shalat yang sebagiannya keluar waktu?',b:'Menunda tanpa uzur sampai sebagian rakaat keluar waktu → maksiat. Bila ketika mulai masih cukup untuk 4 rakaat penuh dalam waktu → tidak berdosa (bisa makruh).',c:'pembatal',tm:1251},
 {f:'Tidak tahu masuk waktu?',b:'Wajib berijtihad, misalnya dengan wirid bacaan atau pekerjaan yang biasa dilakukan dalam rentang tertentu.',c:'syarat',tm:1343},
 {f:'Qadha shalat: segera atau boleh ditunda?',b:'Tanpa uzur → wajib segera (begitu juga puasa: mulai 2 Syawal). Karena uzur (tertidur, lupa) → wajib, boleh ditunda.',c:'netral',tm:1434},
 {f:'Lima waktu yang haram untuk shalat?',b:'Saat terbit sampai setinggi tombak (±16 menit); istiwa\' kecuali Jum\'at; saat menguning sampai terbenam; setelah shalat subuh sampai terbit; setelah shalat ashar sampai terbenam.',c:'pembatal',tm:1528},
 {f:'Shalat apa yang tetap boleh di waktu terlarang?',b:'Yang sebabnya mendahului (tahiyyatul masjid, sunnah wudhu) atau bersamaan (gerhana, istisqa\'), fardhu, dan qadha. Haram: sunnah mutlak dan yang sebabnya belakangan (ihram, istikharah, hajat).',c:'pembatal',tm:1744},
 {f:'Shalat saat khathib Jum\'at sudah naik mimbar?',b:'Haram memulai shalat, kecuali tahiyyatul masjid yang diringkas. Ringkas menurut ar-Ramli: sesuai kebiasaan (\'urf); menurut Ibnu Hajar: rukunnya saja.',c:'pembatal',tm:1744},
 {f:'Syarat wajib shalat?',b:'Muslim, baligh, berakal, suci dari haid/nifas (matan). Ustadz menambah: indra selamat, dakwah sampai. Kafir asli tidak qadha; murtad wajib qadha.',c:'syarat',tm:1932},
 {f:'Perintah shalat kepada anak?',b:'Wali wajib memerintah pada usia 7 tahun bila sudah mumayyiz, dan memukul (mendidik) bila meninggalkannya pada usia 10 tahun. Anak perempuan sama.',c:'netral',tm:2092},
 {f:'Kewajiban orang tua mengajar anak?',b:'Mengajarkan yang wajib setelah baligh (thaharah, shalat, puasa), dan haramnya zina, liwath, mencuri, khamr, dusta, ghibah, namimah. Menjelaskan tanda baligh: usia 15 tahun, mimpi basah, atau haid. Upah guru dari harta anak; bila tidak ada, dari yang menafkahinya.',c:'netral',tm:2438},
 {f:'Syarat sah shalat (matan)?',b:'Enam: tahu masuk waktu; menghadap kiblat (kecuali sunnah di perjalanan); menutup aurat; suci dari dua hadats; suci dari najis di pakaian, badan, tempat; mengetahui fardhu dan sunnah shalat.',c:'syarat',tm:2879},
 {f:'Aurat dalam shalat?',b:'Laki-laki dan budak perempuan: antara pusar dan lutut. Perempuan merdeka saat shalat dan di depan non-mahram: seluruh badan kecuali wajah dan telapak tangan. Di depan mahram: antara pusar dan lutut.',c:'syarat',tm:3377},
 {f:'Najis yang dimaafkan dalam shalat?',b:'Darah hewan yang darahnya tak mengalir (nyamuk, kutu), kotoran lalat, darah jerawat/bisul sedikit atau banyak (tidak dipencet, tidak bercampur benda lain), nanah dan cairan bisul, sedikit darah orang lain. Anjing dan babi tidak dimaafkan.',c:'syarat',tm:3597}
];

const FLASH5=[
 {f:'Fardhu shalat ada berapa?',b:'17 menurut matan (tuma\'ninah dihitung empat kali). 14 bila tuma\'ninah dihitung sekali; 13 bila digabung ke rukunnya.',c:'rukun',tm:59},
 {f:'Unsur niat shalat fardhu?',b:'Qashd fi\'il (sengaja melakukan: "ushalli"), ta\'yin (zhuhur, ashar…), dan niat fardhu. Niat fardhu bagi anak: ar-Ramli tidak wajib, Ibnu Hajar wajib.',c:'rukun',tm:121},
 {f:'Niat shalat sunnah?',b:'Berwaktu atau bersebab (witir, rawatib, \'id, gerhana, dhuha): qashd + ta\'yin. Sunnah mutlak: qashd saja. Tahiyyatul masjid, sunnah wudhu, istikharah, sunnah thawaf, hajat diikutkan sunnah mutlak.',c:'rukun',tm:121},
 {f:'Takbiratul ihram: lafaz dan syaratnya?',b:'اللهُ أَكْبَرُ (boleh اللهُ الْأَكْبَرُ). Diucapkan sambil berdiri. Niat menyertai seluruh takbir (muktamad); sebagian muta\'akhkhirin: cukup menyertai bagian mana saja (\'urfi).',c:'rukun',tm:432},
 {f:'Tidak mampu berdiri dalam shalat fardhu?',b:'Duduk (afdhal iftirasy; rukuk: dahi sejajar depan lutut) → berbaring miring kanan → telentang → isyarat kepala → kedipan mata → dalam hati. Tidak gugur selama berakal; tidak mengulang.',c:'rukun',tm:621},
 {f:'Tidak hafal Al-Fatihah?',b:'Tujuh ayat lain sejumlah hurufnya; bila tidak bisa, tujuh macam dzikir atau doa ukhrawi (syarah).',c:'rukun',tm:900},
 {f:'Yang wajib dijaga dalam membaca Al-Fatihah?',b:'Tertib, muwalah (bersambung), tasydid, dan membedakan dhad (ض) dari zha (ظ).',c:'rukun',tm:900},
 {f:'Menghilangkan tasydid, atau dhad dibaca zha?',b:'Menghilangkan tasydid membatalkan bacaan kata itu. Dhad dibaca zha oleh yang mampu atau yang tidak mau belajar: tidak sah.',c:'rukun',tm:900},
 {f:'Kapan Al-Fatihah gugur?',b:'Bagi makmum masbuq: tidak sempat waktu membaca Fatihah bersama imam, walau tetap mendapat rakaat.',c:'rukun',tm:900},
 {f:'Rukuk dan tuma\'ninah: batas minimal?',b:'Membungkuk sampai telapak tangan bisa mencapai lutut. Tuma\'ninah: ada jeda diam yang memisahkan gerakan turun dan bangkit; setiap anggota tenang di tempatnya.',c:'rukun',tm:1306},
 {f:'Syarat bangkit untuk i\'tidal?',b:'Tidak diniatkan atau disebabkan selain i\'tidal. Bangkit karena kaget tidak sah.',c:'rukun',tm:1555},
 {f:'Minimal sujud?',b:'Sebagian dahi (terbuka), bagian dalam jari tangan dan kaki, sebagian lutut; kepala dibebankan, bukan sekadar menyentuh; pantat lebih tinggi dari kepala. Hidung afdhal, tidak wajib.',c:'rukun',tm:1617},
 {f:'Rukun pendek dalam shalat?',b:'I\'tidal dan duduk antara dua sujud. Muktamad: tidak boleh dipanjangkan seukuran tasyahud minimal (batal bila tahu dan sengaja).',c:'rukun',tm:1902},
 {f:'Tasyahud awal dan akhir?',b:'Tasyahud akhir, duduknya, dan shalawat Nabi di dalamnya: rukun. Tasyahud awal: sunnah ab\'adh.',c:'rukun',tm:1967},
 {f:'Shalawat minimal di tasyahud akhir?',b:'صَلَّى اللهُ عَلَى مُحَمَّدٍ. Shalawat kepada keluarga bukan rukun.',c:'rukun',tm:1967},
 {f:'Apa gunanya tahu batas minimal sah?',b:'Untuk saat waktu sempit atau lelah, dan agar bijak menilai shalat orang lain.',c:'netral',tm:2191},
 {f:'Salam minimal?',b:'السَّلَامُ عَلَيْكُمْ (matan).',c:'rukun',tm:2318},
 {f:'Lupa satu rukun: aturannya?',b:'Ingat sebelum sampai rukun yang semisal di rakaat berikutnya → segera kembali (menunda membatalkan). Ingat setelah sampai rukun semisal → rakaat bergeser, tambah satu. Makmum: ikut imam, tambah satu rakaat setelah imam salam.',c:'rukun',tm:2318},
 {f:'Mengangkat tangan: di mana dan bagaimana?',b:'Empat tempat: takbiratul ihram, hendak rukuk, bangkit dari rukuk, bangkit dari tasyahud awal. Ujung jari sejajar atas telinga, ibu jari sejajar daun telinga, telapak sejajar bahu. Takbir tetap diucapkan.',c:'sunnah',tm:2536},
 {f:'Doa iftitah: kapan luput?',b:'Dibaca pelan setelah takbiratul ihram. Luput bila sudah ta\'awwudz, atau masbuq langsung duduk bersama imam. Tidak luput karena mengaminkan imam. Tidak disunnahkan pada shalat jenazah.',c:'sunnah',tm:2693},
 {f:'Ta\'awwudz di setiap rakaat?',b:'Sunnah di setiap rakaat menurut Syafi\'iyyah; rakaat pertama lebih ditekankan (matan: وَالْأُولَى آكَدُ).',c:'sunnah',tm:2788},
 {f:'Membaca surat setelah Al-Fatihah?',b:'Sunnah bagi selain makmum yang mendengar bacaan imam. Satu surat penuh lebih afdhal dari sebagian walau lebih panjang (mushannif, Ibnu Hajar); ar-Ramli: sebagian yang lebih panjang lebih afdhal.',c:'sunnah',tm:2822},
 {f:'Shalat apa yang bacaannya dikeraskan (jahr)?',b:'Subuh, dua rakaat awal maghrib dan isya; juga Jum\'at, \'id, istisqa\'. Perempuan jahr bila tidak ada laki-laki non-mahram; bila ada, makruh.',c:'sunnah',tm:3014},
 {f:'Sedekap dan takbir intiqal?',b:'Tangan kanan di atas pergelangan kiri, di bawah dada di atas pusar. Takbir intiqal sunnah (Hanabilah: wajib), dipanjangkan sampai rukun berikutnya.',c:'sunnah',tm:3239},
 {f:'Qunut: di mana dan minimalnya?',b:'I\'tidal rakaat kedua subuh; qunut nazilah di semua shalat fardhu. Minimal: ar-Ramli — doa dan pujian; Ibnu Hajar — doa saja. Hanafiyah dan Hanabilah tidak mensunnahkannya di subuh.',c:'sunnah',tm:3362},
 {f:'Tasbih rukuk/sujud dan urutan turun sujud?',b:'سُبْحَانَ رَبِّيَ الْعَظِيمِ وَبِحَمْدِهِ dan سُبْحَانَ رَبِّيَ الْأَعْلَى وَبِحَمْدِهِ, 3 kali (minimal 1); tidak membaca tetap sah. Turun: lutut, tangan, lalu dahi bersama hidung.',c:'sunnah',tm:3491},
 {f:'Duduk istirahat?',b:'Sunnah setelah sujud kedua di rakaat pertama dan ketiga (selain maghrib), bagi semua orang menurut Syafi\'iyyah; ringan saja. Dipanjangkan → makruh.',c:'sunnah',tm:3618},
 {f:'Iftirasy dan tawarruk?',b:'Iftirasy di semua duduk. Tawarruk di tasyahud akhir yang diikuti salam; bila hendak sujud sahwi, masih iftirasy.',c:'sunnah',tm:3725},
 {f:'Pandangan dan khusyu\' dalam shalat?',b:'Melihat tempat sujud; saat "illallāh" di tasyahud melihat telunjuk sampai salam. Khusyu\' = hati hadir dan anggota tenang; muktamad sunnah, ada pendapat (wajh) syarat sah.',c:'sunnah',tm:3852},
 {f:'Sunnah-sunnah penutup dalam matan?',b:'Tadabbur bacaan dan dzikir; rakaat pertama lebih panjang dari kedua; masuk shalat dengan semangat dan hati lapang; banyak berdoa saat sujud.',c:'sunnah',tm:4039}
];

const FLASH6=[
 {f:'Berbicara dalam shalat: kapan membatalkan?',b:'Sengaja dan tahu: dua huruf berturut-turut membatalkan. Lupa, atau jahil yang diuzur: sedikit tidak batal, banyak batal. Batas "sedikit" menurut ustadz ±4 kata (Ibnu Hajar) atau 6 kata (al-Qalyubi) — perlu dicek.',c:'pembatal',tm:108},
 {f:'Makan dan minum dalam shalat?',b:'Banyak → batal walau lupa. Sedikit karena lupa atau jahil → tidak batal. Sengaja dan tahu → batal, sedikit atau banyak.',c:'pembatal',tm:265},
 {f:'Gerakan yang membatalkan shalat?',b:'Tiga gerakan berturut-turut dengan anggota berat (tangan, kaki, kepala, badan), mis. tiga langkah; pukulan keras; lompatan besar. Anggota ringan (jari, kelopak mata, bibir) tidak membatalkan walau banyak.',c:'pembatal',tm:329},
 {f:'Yang tidak membatalkan tapi disunnahkan sujud sahwi?',b:'Bicara sedikit karena lupa, makan sedikit karena lupa, dan menambah rukuk atau sujud karena lupa.',c:'sunnah',tm:522},
 {f:'Sujud sahwi: hukum, jumlah, tempat?',b:'Sunnah. Dua sujud walau lupanya berkali-kali, setelah tasyahud akhir dan shalawat, sebelum salam.',c:'sunnah',tm:614},
 {f:'Sebab-sebab sujud sahwi?',b:'Meninggalkan sunnah ab\'adh (walau sengaja); melakukan sesuatu yang membatalkan bila disengaja, tetapi dilakukan karena lupa; memindah rukun qauli (Fatihah saat rukuk, tasyahud saat berdiri).',c:'sunnah',tm:614},
 {f:'Apa saja sunnah ab\'adh dalam matan?',b:'Tasyahud awal (dan duduknya), shalawat Nabi di dalamnya, qunut subuh, berdiri untuk qunut, shalawat Nabi di qunut.',c:'sunnah',tm:614},
 {f:'Imam tidak mengeraskan bacaan subuh/maghrib/isya?',b:'Shalatnya sah, karena jahr hanya sunnah (tanya-jawab Sesi 6).',c:'sunnah',tm:709},
 {f:'Makmum dan sujud sahwi?',b:'Wajib ikut sujud sahwi imam, walau lupanya imam sebelum ia bergabung. Lupa makmum ditanggung imam. Sujud sahwi sendiri, atau sengaja tidak ikut sujud imam, membatalkan shalat (bila tahu).',c:'pembatal',tm:927},
 {f:'Sujud tilawah disunnahkan bagi siapa?',b:'Qari\' (yang membaca), mustami\' (yang sengaja mendengarkan), dan sami\' (yang sekadar mendengar).',c:'sunnah',tm:1055},
 {f:'Jumlah ayat sajdah, dan bagaimana dengan surat Shad?',b:'14 ayat (matan; qaul jadid): al-A‘raf, ar-Ra‘d, an-Nahl, al-Isra’, Maryam, al-Hajj (2), al-Furqan, an-Naml, as-Sajdah, Fushshilat, an-Najm, al-Insyiqaq, al-‘Alaq. Sujud di surat Shad adalah sujud syukur, bukan sujud tilawah (Minhaj ath-Thalibin; Hasyiyah Qalyubi 1/235).',c:'sunnah',tm:1055},
 {f:'Sujud tilawah di dalam shalat?',b:'Imam dan munfarid sujud karena bacaannya sendiri; karena bacaan orang lain → batal. Makmum hanya sujud bila imamnya sujud.',c:'pembatal',tm:1149},
 {f:'Sujud tilawah di luar shalat: syarat dan rukun?',b:'Syaratnya seperti shalat (suci, menutup aurat, menghadap kiblat). Rukunnya: niat, takbiratul ihram, sujud, duduk, salam.',c:'rukun',tm:1306},
 {f:'Altsagh dan arat?',b:'Altsagh: mengganti satu huruf dengan huruf lain. Arat: meng-idgham-kan huruf di luar tempatnya. Tidak sah bermakmum kepada keduanya bagi makmum yang bacaannya benar.',c:'pembatal',tm:1368},
 {f:'Imam lain yang tidak sah diikuti?',b:'Orang yang masih bermakmum; yang diragukan imam atau makmum; yang berhadats atau junub (bila makmum tahu); kafir; yang ada najis tampak di badan/pakaiannya; faqid ath-thahurain.',c:'pembatal',tm:1368},
 {f:'Imam ternyata berhadats?',b:'Tahu setelah shalat → tidak mengulang. Tahu di tengah → niat mufaraqah, lanjutkan sendiri. Imam ternyata kafir atau gila → wajib mengulang.',c:'netral',tm:1368},
 {f:'Siapa yang boleh menjadi imam bagi siapa?',b:'Imam harus setara atau lebih tinggi: laki-laki > khuntsa > perempuan. Laki-laki tidak sah di belakang perempuan atau khuntsa.',c:'syarat',tm:1723},
 {f:'Enam syarat jamaah (matan)?',b:'Tidak mendahului imam; berkumpul di satu masjid atau dalam 300 hasta; mengetahui perpindahan imam; niat bermakmum; shalatnya sesuai dengan shalat imam; mengikuti imam (mutaba\'ah).',c:'syarat',tm:1817},
 {f:'Posisi makmum terhadap imam?',b:'Tumit tidak boleh di depan tumit imam (duduk: pantat; berbaring: lambung). Sejajar makruh, hilang keutamaan jamaah. Makmum seorang berdiri sedikit di belakang.',c:'syarat',tm:1817},
 {f:'Berjamaah di dalam dan di luar masjid?',b:'Satu masjid: sah sejauh apa pun asal bisa terhubung. Di luar masjid: dalam ±300 hasta (±150 m menurut ustadz) dari ujung masjid; saf yang bersambung sah walau jauh.',c:'syarat',tm:1950},
 {f:'Niat makmum dan niat imam?',b:'Niat bermakmum syarat sah, boleh di tengah shalat; mengikuti tanpa niat membatalkan. Imam tidak wajib niat menjadi imam kecuali shalat Jum\'at.',c:'syarat',tm:2203},
 {f:'Kesesuaian shalat makmum dan imam?',b:'Gerakan lahirnya harus serupa: fardhu di belakang shalat gerhana atau jenazah tidak sah. Beda niat dan jumlah rakaat boleh (qadha zhuhur di belakang ashar sah).',c:'syarat',tm:2327},
 {f:'Mutaba\'ah: kapan batal?',b:'Mendahului imam dua rukun fi\'li → batal. Tertinggal dua rukun tanpa uzur → batal. Dengan uzur: toleransi sampai tiga rukun panjang; imam masuk rukun keempat → ikut imam, tambah satu rakaat (atau mufaraqah).',c:'pembatal',tm:2420},
 {f:'Safar yang membolehkan qashar?',b:'Panjang (dua marhalah, ±83 km menurut ustadz) dan mubah (termasuk wajib, sunnah, makruh). Safar maksiat tidak boleh; berbuat maksiat di dalam safar mubah tetap boleh. Qashar itu boleh, bukan sunnah (menurut ustadz).',c:'syarat',tm:2702},
 {f:'Syarat lain qashar (matan)?',b:'Tujuan jelas (tidak sah bagi yang berjalan tanpa tujuan); tidak bermakmum kepada yang shalat sempurna atau yang diragukan; niat qashar saat takbiratul ihram. Ustadz: sudah keluar batas daerah.',c:'syarat',tm:2702},
 {f:'Syarat jamak taqdim dan ta\'khir?',b:'Taqdim: mulai dengan shalat pertama, niat jamak di dalamnya, tidak ada jeda lama (> ±2 rakaat ringan). Ta\'khir: niat menunda sebelum waktu shalat pertama habis.',c:'syarat',tm:3231},
 {f:'Wajib Jum\'at atas siapa? Apa saja uzurnya?',b:'Muslim mukallaf, laki-laki, merdeka, mukim, tidak sakit. Uzur: hujan, sakit, merawat orang sakit, kerabat sakaratul maut, takut atas diri/harta/kehormatan, menahan hadats, sangat lapar/haus, sangat panas/dingin, angin kencang malam, lumpur, rombongan safar berangkat.',c:'syarat',tm:3570},
 {f:'Syarat sah Jum\'at?',b:'Seluruhnya di waktu zhuhur; di pemukiman; tidak didahului Jum\'at lain di daerah itu; berjamaah; 40 laki-laki mukallaf merdeka mustauthin; didahului dua khutbah.',c:'syarat',tm:3852},
 {f:'Lima rukun khutbah?',b:'Hamdalah di keduanya; shalawat di keduanya; wasiat takwa di keduanya; satu ayat di salah satunya; doa untuk mukminin di khutbah kedua ("raḥimakumullāh" cukup).',c:'rukun',tm:4221},
 {f:'Syarat khutbah?',b:'Didengar 40 orang; muwalah antar-rukun dan antara khutbah dan shalat; suci dari hadats dan najis; berdiri bila mampu; menutup aurat; duduk di antara dua khutbah seukuran tuma\'ninah; berbahasa Arab; setelah zawal.',c:'syarat',tm:4436}
];

const CATHEX={syarat:'#BA7517',rukun:'#534AB7',wajib:'#185FA5',sunnah:'#3B6D11',makruh:'#5F5E5A',pembatal:'#A32D2D',netral:'#888780'};
function mindmapSVG(rid){
  const r=REGIONS.find(x=>x.id===rid);const rows=[];
  (TREE[rid]||[]).forEach(n=>{rows.push({n,d:0});(n.k||[]).forEach(k=>rows.push({n:k,d:1}));});
  const rh=34,top=10,H=rows.length*rh+top*2,W=360,rx=8,ry=H/2,x1=96;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Mindmap bab ${r.name}" style="font-family:inherit">`;
  let lastTop=null;
  rows.forEach((o,i)=>{const y=top+i*rh+rh/2;const x=o.d?x1+26:x1;const col=CATHEX[o.n.c];
    if(o.d===0){s+=`<path d="M${rx+72} ${ry} C ${rx+86} ${ry}, ${x-14} ${y}, ${x} ${y}" stroke="${r.color}" stroke-width="2" fill="none" opacity=".55"/>`;lastTop=y;}
    else{s+=`<path d="M${x1+6} ${lastTop} V ${y} H ${x}" stroke="${col}" stroke-width="1.5" fill="none" opacity=".6"/>`;}
    const dk=o.n.d;s+=dk?`<g style="cursor:pointer" onclick="go('fasal-${dk}')"><rect x="${x-4}" y="${y-13}" width="${W-x}" height="26" fill="transparent"/><circle cx="${x+5}" cy="${y}" r="8" fill="none" stroke="${col}" stroke-width="1.5"/>`:'';
    s+=`<circle cx="${x+5}" cy="${y}" r="5" fill="${col}"/><text x="${x+17}" y="${y+4}" font-size="${o.d?11.5:12.5}" font-weight="${o.d?400:500}" style="fill:${dk?'var(--brand)':'currentColor'}">${o.n.id}${dk?' ›':''}</text>`+(dk?'</g>':'');});
  s+=`<rect x="${rx}" y="${ry-26}" width="74" height="52" rx="12" fill="${r.color}"/><text x="${rx+37}" y="${ry-2}" text-anchor="middle" font-size="18" fill="#fff" font-family="Amiri,serif">${r.ar}</text><text x="${rx+37}" y="${ry+16}" text-anchor="middle" font-size="11" fill="#fff">${r.name}</text></svg>`;
  return s;
}

'thaharah-67':{none:true,note:'Di cetakan al-Bayan, halaman fasal ini tidak memuat teks matan: judul dan isinya berasal dari pensyarah. Fasal ini juga tidak terdengar dibahas di video kajian.'},
