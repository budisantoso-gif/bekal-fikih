 ['وَتَكُونُ هَذِهِ عِنْدَ غَسْلِ الْوَجْهِ.','dan niat ini dilakukan ketika membasuh wajah.'],
 ['الثَّانِي: غَسْلُ الْوَجْهِ جَمِيعِهِ شَعْرًا وَبَشَرًا إِلَّا بَاطِنَ اللِّحْيَةِ الْكَثِيفَةِ وَالْعَارِضَيْنِ الْكَثِيفَيْنِ.','Yang kedua: membasuh wajah seluruhnya, baik rambut maupun kulitnya, kecuali bagian dalam jenggot yang tebal dan dua cambang yang tebal.'],
 ['الثَّالِثُ: غَسْلُ يَدَيْهِ مَعَ مِرْفَقَيْهِ.','Yang ketiga: membasuh kedua tangan sampai kedua siku.'],
 ['الرَّابِعُ: مَسْحُ شَيْءٍ مِنْ بَشَرَةِ الرَّأْسِ أَوْ شَعْرِهِ، وَلَوْ بَعْضَ شَعْرَةٍ فِي حَدِّهِ.','Yang keempat: mengusap sebagian kepala, baik kulit maupun rambutnya, walaupun sebagian dari sehelai rambut, asalkan masih dalam batas kepala.'],
 ['الْخَامِسُ: غَسْلُ رِجْلَيْهِ مَعَ كَعْبَيْهِ.','Yang kelima: membasuh kedua kaki sampai kedua mata kaki.'],
 ['السَّادِسُ: التَّرْتِيبُ هَكَذَا.','Yang keenam: tertib, berurutan seperti yang telah disebutkan.']];
TR['thaharah-56']=[
 ['وَسُنَنُهُ: السِّوَاكُ.','Sunnah-sunnah wudhu: bersiwak,'],
 ['ثُمَّ التَّسْمِيَةُ.','kemudian membaca basmalah,'],
 ['وَغَسْلُ الْكَفَّيْنِ.','membasuh kedua telapak tangan,'],
 ['ثُمَّ الْمَضْمَضَةُ.','kemudian berkumur-kumur,'],
 ['ثُمَّ الاسْتِنْشَاقُ وَالاسْتِنْثَارُ.','kemudian memasukkan air ke dalam hidung lalu mengeluarkannya,'],
 ['وَالتَّثْلِيثُ.','melakukannya tiga kali,'],
 ['وَمَسْحُ جَمِيعِ الرَّأْسِ.','mengusap seluruh kepala,'],
 ['ثُمَّ الْأُذُنَيْنِ وَالصِّمَاخَيْنِ.','kemudian mengusap kedua telinga dan kedua lubang telinga,'],
 ['وَتَخْلِيلُ اللِّحْيَةِ الْكَثِيفَةِ.','menyela-nyela jenggot yang tebal,'],
 ['وَتَخْلِيلُ الْأَصَابِعِ.','menyela-nyela jari-jemari,'],
 ['وَتَطْوِيلُ الْغُرَّةِ وَالتَّحْجِيلِ.','memperpanjang ghurrah dan tahjil,'],
 ['وَالْمُوَالَاةُ.','berkesinambungan (muwalah),'],
 ['وَتَرْكُ الِاسْتِعَانَةِ فِي الصَّبِّ.','tidak meminta tolong dituangkan air,'],
 ['وَتَرْكُ التَّنْشِيفِ بِخِرْقَةٍ.','dan tidak mengelap dengan kain.']];
TR['thaharah-70']=[
 ['وَيَنْقُضُ الْوُضُوءَ أَرْبَعَةُ أَشْيَاءَ:','Yang membatalkan wudhu ada empat perkara:'],
 ['الْأَوَّلُ: الْخَارِجُ مِنْ أَحَدِ السَّبِيلَيْنِ: الْقُبُلِ وَالدُّبُرِ.','Yang pertama: sesuatu yang keluar dari salah satu dua jalan, yaitu qubul dan dubur.'],
 ['الثَّانِي: زَوَالُ الْعَقْلِ بِنَوْمٍ أَوْ غَيْرِهِ، إِلَّا نَوْمَ مُمَكِّنٍ مَقْعَدَتَهُ مِنَ الْأَرْضِ.','Yang kedua: hilangnya akal karena tidur atau selainnya, kecuali tidurnya orang yang duduk kokoh, pantatnya menetap di tempat duduknya.'],
 ['الثَّالِثُ: الْتِقَاءُ بَشَرَتَيْ رَجُلٍ وَامْرَأَةٍ كَبِيرَيْنِ أَجْنَبِيَّيْنِ.','Yang ketiga: bersentuhannya kulit laki-laki dan perempuan yang sudah besar dan bukan mahram.'],
 ['الرَّابِعُ: مَسُّ قُبُلِ الْآدَمِيِّ أَوْ حَلْقَةِ دُبُرِهِ بِبَطْنِ الرَّاحَةِ أَوْ بُطُونِ الْأَصَابِعِ.','Yang keempat: menyentuh kemaluan depan manusia atau lingkaran duburnya dengan bagian dalam telapak tangan atau bagian dalam jari-jari.']];
TR['thaharah-77']=[
 ['وَمَنِ انْتَقَضَ وُضُوءُهُ.. حَرُمَ عَلَيْهِ: الصَّلَاةُ، وَالطَّوَافُ، وَمَسُّ الْمُصْحَفِ، وَحَمْلُهُ، وَاللَّوْحِ الْمَكْتُوبِ لِلدِّرَاسَةِ.','Orang yang batal wudhunya, haram baginya: shalat, thawaf, menyentuh mushaf, membawanya, dan (menyentuh) papan yang ditulisi ayat untuk pelajaran.'],
 ['وَيَحِلُّ حَمْلُهُ فِي أَمْتِعَةٍ أَوْ دَرَاهِمَ.','Halal membawanya bersama barang-barang, atau (ayat yang tertulis) pada dirham.'],
 ['وَيَحِلُّ حَمْلُهُ لِلصَّبِيِّ الْمُمَيِّزِ وَمَسُّهُ لِلدِّرَاسَةِ.','Halal pula bagi anak yang sudah mumayyiz membawa dan menyentuhnya untuk belajar.']];
TR['thaharah-82']=[
 ['فَصْلٌ: يُقَدِّمُ دَاخِلُ الْخَلَاءِ يَسَارَهُ، وَإِذَا خَرَجَ يَمِينَهُ.','Fasal: Orang yang masuk tempat buang hajat mendahulukan kaki kirinya, dan bila keluar mendahulukan kaki kanannya.'],
 ['وَلَا يَحْمِلُ ذِكْرَ اللهِ تَعَالَى وَاسْمَ رَسُولِهِ وَالْقُرْآنَ.','Ia tidak membawa (tulisan) dzikir kepada Allah Ta‘ala, nama Rasul-Nya, dan Al-Qur’an.'],
 ['وَيُغَطِّي رَأْسَهُ.','Ia menutup kepalanya.'],
 ['وَيَبْعُدُ وَيَسْتَتِرُ.','Ia menjauh dari orang dan menutup diri.'],
 ['وَلَا يَبُولُ فِي مَاءٍ رَاكِدٍ وَقَلِيلِ جَارٍ، وَجُحْرٍ، وَمَهَبِّ رِيحٍ، وَظِلٍّ مَقْصُودٍ، وَطَرِيقٍ، وَتَحْتَ شَجَرَةٍ مُثْمِرَةٍ.','Ia tidak kencing di air yang menggenang dan air mengalir yang sedikit, di lubang, di tempat berhembusnya angin, di naungan yang dituju orang, di jalan, dan di bawah pohon yang berbuah.'],
 ['وَلَا يَتَكَلَّمُ.','Ia tidak berbicara.'],
 ['وَيَسْتَبْرِئُ مِنَ الْبَوْلِ.','Ia melakukan istibra’, membersihkan sisa kencing.'],
 ['وَيَقُولُ إِذَا دَخَلَ: «بِاسْمِ اللهِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ».','Ketika masuk ia mengucapkan: “Dengan nama Allah. Ya Allah, aku berlindung kepada-Mu dari setan laki-laki dan setan perempuan.”'],
 ['وَإِذَا خَرَجَ: «غُفْرَانَكَ، الْحَمْدُ لِلَّهِ الَّذِي أَذْهَبَ عَنِّي الْأَذَى وَعَافَانِي».','Ketika keluar: “Aku memohon ampunan-Mu. Segala puji bagi Allah yang telah menghilangkan gangguan dariku dan memberiku keselamatan.”']];
TR['thaharah-95']=[
 ['فَصْلٌ: وَيَجِبُ الْغُسْلُ مِنْ خَمْسَةِ أَشْيَاءَ:','Fasal: Mandi wajib karena lima perkara:'],
 ['مِنْ إِيلَاجِ الْحَشَفَةِ فِي الْفَرْجِ.','karena masuknya hasyafah (kepala zakar) ke dalam farji,'],
 ['وَمِنْ خُرُوجِ الْمَنِيِّ.','karena keluarnya mani,'],
 ['وَمِنَ الْحَيْضِ، وَالنِّفَاسِ، وَالْوِلَادَةِ.','dan karena haid, nifas, dan melahirkan.']];
TR['thaharah-100']=[
 ['فَصْلٌ: فُرُوضُ الْغُسْلِ شَيْئَانِ:','Fasal: Fardhu mandi ada dua:'],
 ['الْأَوَّلُ: النِّيَّةُ، وَهُوَ أَنْ يَنْوِيَ رَفْعَ الْجَنَابَةِ، أَوْ رَفْعَ الْحَدَثِ الْأَكْبَرِ، أَوْ فَرْضَ الْغُسْلِ، أَوْ نَحْوَ ذَلِكَ عِنْدَ غَسْلِ أَوَّلِ جُزْءٍ مِنْ بَدَنِهِ.','Yang pertama: niat, yaitu berniat mengangkat janabah, atau mengangkat hadats besar, atau fardhu mandi, atau yang semisal itu, ketika membasuh bagian pertama dari badannya.'],
 ['الثَّانِي: غَسْلُ جَمِيعِ شَعْرِهِ الْكَثِيفِ وَالْخَفِيفِ وَجَمِيعِ بَشَرَتِهِ حَتَّى مَا تَحْتَ قُلْفَةِ الْأَقْلَفِ.','Yang kedua: membasuh seluruh rambutnya, yang tebal maupun yang tipis, dan seluruh kulitnya, sampai bagian di bawah kulup orang yang belum dikhitan.']];
TR['thaharah-102']=[
 ['وَسُنَنُهُ: السِّوَاكُ، وَالتَّسْمِيَةُ، وَالْوُضُوءُ قَبْلَ الْغُسْلِ، وَتَعَهُّدُ الْمَعَاطِفِ، وَتَخْلِيلُ الشَّعْرِ، وَالدَّلْكُ، وَالتَّثْلِيثُ.','Sunnah-sunnahnya: bersiwak, membaca basmalah, berwudhu sebelum mandi, memperhatikan lipatan-lipatan tubuh, menyela-nyela pangkal rambut, menggosok badan, dan melakukannya tiga kali.']];
TR['thaharah-105']=[
 ['فَصْلٌ: وَشُرُوطُ الطَّهَارَةِ عَنِ الْحَدَثِ الْأَصْغَرِ وَالْأَكْبَرِ: الْإِسْلَامُ، وَالتَّمْيِيزُ، وَالْمَاءُ الطَّاهِرُ الْمُطَهِّرُ؛','Fasal: Syarat-syarat bersuci dari hadats kecil dan besar: Islam, tamyiz, dan air yang suci lagi menyucikan;'],
 ['فَلَا يَصِحُّ رَفْعُ الْحَدَثِ وَلَا إِزَالَةُ النَّجَسِ إِلَّا بِالْمَاءِ الْمُطْلَقِ، وَهُوَ: مَا نَزَلَ مِنَ السَّمَاءِ، أَوْ نَبَعَ مِنَ الْأَرْضِ.','maka tidak sah mengangkat hadats maupun menghilangkan najis kecuali dengan air mutlak, yaitu air yang turun dari langit atau yang keluar dari bumi.'],
 ['فَإِذَا تَغَيَّرَ طَعْمُ الْمَاءِ أَوْ لَوْنُهُ أَوْ رِيحُهُ تَغَيُّراً فَاحِشاً بِمُخَالَطَةِ شَيْءٍ طَاهِرٍ يَسْتَغْنِي الْمَاءُ عَنْهُ كَالزَّعْفَرَانِ وَالْأُشْنَانِ وَالْجِصِّ وَالنُّورَةِ وَالْكُحْلِ.. لَمْ تُجْزِ الطَّهَارَةُ بِهِ.','Jika rasa, warna, atau bau air berubah banyak karena bercampur dengan benda suci yang tidak dibutuhkan air, seperti za‘faran, usynan, gipsum, kapur, dan celak, maka tidak sah bersuci dengannya.'],
 ['وَلَا يَضُرُّ التَّغَيُّرُ بِالْمُكْثِ وَالتُّرَابِ وَالطُّحْلُبِ وَمَا فِي مَقَرِّهِ وَمَمَرِّهِ،','Tidak mengapa perubahan karena lama terdiam, karena tanah, lumut, dan apa yang ada di tempat diam serta tempat mengalirnya air,'],
 ['وَلَا التَّغَيُّرُ بِمُجَاوِرٍ كَالْعُودِ وَالدُّهْنِ الْمُطَيِّبِ.','tidak pula perubahan karena benda yang hanya berdekatan (tidak menyatu), seperti kayu gaharu dan minyak wangi.'],
 ['وَلَا تَصِحُّ الطَّهَارَةُ بِمَا تُطُهِّرَ بِهِ مِنْ حَدَثٍ أَوْ نَجَسٍ.','Tidak sah bersuci dengan air yang sudah dipakai bersuci dari hadats atau najis (air musta‘mal).']];
TR['thaharah-113']=[TR['thaharah-105'][5]];
TR['thaharah-114']=[
 ['تَنْبِيهٌ: لَوْ أَدْخَلَ الْمُتَوَضِّئُ يَدَهُ بَعْدَ غَسْلِ وَجْهِهِ جَمِيعِهِ مَرَّةً، أَوِ الْجُنُبُ بَعْدَ النِّيَّةِ فِي مَاءٍ دُونَ الْقُلَّتَيْنِ، فَاغْتَرَفَ وَنَوَى الِاغْتِرَافَ.. لَمْ يَضُرَّ،','Peringatan: Seandainya orang yang berwudhu memasukkan tangannya setelah membasuh seluruh wajahnya sekali, atau orang junub setelah berniat, ke dalam air yang kurang dari dua qullah, lalu ia menciduk dan meniatkan tangannya sebagai cidukan, maka tidak mengapa;'],
 ['وَإِنْ لَمْ يَنْوِ الِاغْتِرَافَ.. صَارَ الْبَاقِي مُسْتَعْمَلاً.','jika ia tidak meniatkan menciduk, sisa air itu menjadi musta‘mal.']];
TR['thaharah-116']=[
 ['فَصْلٌ: وَيَنْجُسُ الْمَاءُ الْقَلِيلُ وَغَيْرُهُ مِنَ الْمَائِعَاتِ بِوُقُوعِ النَّجَاسَةِ فِيهِ، سَوَاءٌ غَيَّرَتْهُ أَمْ لَمْ تُغَيِّرْهُ.','Fasal: Air yang sedikit dan benda cair lainnya menjadi najis karena kemasukan najis, baik najis itu mengubahnya maupun tidak.'],
 ['وَيُعْفَى عَنِ الْيَسِيرِ مِنَ الشَّعْرِ النَّجِسِ،','Dimaafkan: sedikit rambut atau bulu yang najis,'],
 ['وَعَنِ الْمَيْتَةِ الَّتِي لَا نَفْسَ لَهَا سَائِلَةٌ،','bangkai hewan yang tidak memiliki darah mengalir,'],
 ['وَالنَّجَاسَةِ الَّتِي لَا يُدْرِكُهَا الطَّرْفُ،','najis yang tidak terlihat oleh pandangan mata normal,'],
 ['وَمَنْفَذِ الطَّيْرِ وَالْفَأْرِ،','(najis pada) dubur burung dan tikus,'],
 ['وَالْيَسِيرِ مِنْ غُبَارِ السِّرْجِينِ،','sedikit serpihan kotoran hewan,'],
 ['وَسُؤْرِ الْهِرَّةِ الَّتِي أَكَلَتْ نَجَاسَةً ثُمَّ غَابَتْ زَمَناً وَاحْتُمِلَ وُلُوغُهَا فِي قُلَّتَيْنِ مِنَ الْمَاءِ.','dan sisa minum kucing yang memakan najis, lalu pergi beberapa waktu dan mungkin telah mencelupkan mulutnya ke air dua qullah.']];
TR['thaharah-120']=[
 ['فَصْلٌ: وَإِذَا كَانَ الْمَاءُ قُلَّتَيْنِ وَوَقَعَتْ فِيهِ نَجَاسَةٌ.. فَلَا يَنْجُسُ إِلَّا إِذَا تَغَيَّرَ طَعْمُهُ أَوْ لَوْنُهُ أَوْ رِيحُهُ تَغَيُّراً كَثِيراً أَوْ يَسِيراً.','Fasal: Jika air mencapai dua qullah lalu kemasukan najis, ia tidak menjadi najis kecuali bila rasa, warna, atau baunya berubah, banyak maupun sedikit.'],
 ['وَإِذَا زَالَ التَّغَيُّرُ بِنَفْسِهِ أَوْ بِمَاءٍ.. طَهُرَ.','Jika perubahan itu hilang dengan sendirinya atau karena ditambah air, air itu menjadi suci.'],
 ['وَلَا يَطْهُرُ إِذَا زَالَ التَّغَيُّرُ بِمِسْكٍ أَوْ زَعْفَرَانٍ أَوْ جِصٍّ أَوْ تُرَابٍ.','Air itu tidak menjadi suci bila perubahannya hilang karena misk, za‘faran, gipsum, atau tanah.']];
TR['thaharah-121']=[
 ['فَصْلٌ: وَالنَّجَاسَاتُ هِيَ: الْبَوْلُ، وَالْغَائِطُ، وَالرَّوْثُ، وَالْقَيْحُ، وَالدَّمُ، وَالْقَيْءُ.','Fasal: Najis-najis itu adalah: air kencing, kotoran manusia, kotoran hewan, nanah, darah, dan muntah.'],
 ['وَالْخَمْرُ، وَالنَّبِيذُ، وَالْمُسْكِرُ.','Khamr, nabidz, dan segala yang memabukkan (yang cair).'],
 ['وَالْكَلْبُ، وَالْخِنْزِيرُ، وَفَرْعُ أَحَدِهِمَا.','Anjing, babi, dan keturunan salah satu dari keduanya.'],
 ['وَالْمَيْتَةُ، وَشَعْرُهَا، وَرِيشُهَا، وَجِلْدُهَا، وَجَمِيعُ أَجْزَائِهَا.','Bangkai beserta rambutnya, bulunya, kulitnya, dan seluruh bagiannya.'],
 ['وَالْمَذْيُ، وَالْوَدْيُ، وَمَنِيُّ الْكَلْبِ وَالْخِنْزِيرِ.','Madzi, wadi, serta mani anjing dan babi.'],
 ['وَلَبَنُ مَا لَا يُؤْكَلُ غَيْرَ الْآدَمِيِّ.','Air susu hewan yang tidak halal dimakan, selain manusia.'],
 ['وَمَيْتَةُ الْآدَمِيِّ وَالسَّمَكِ وَالْجَرَادِ.. طَاهِرَاتٌ.','Bangkai manusia, ikan, dan belalang itu suci.'],
 ['وَالْجُزْءُ الْمُنْفَصِلُ مِنْ غَيْرِ الْآدَمِيِّ وَالسَّمَكِ وَالْجَرَادِ.. نَجِسٌ،','Bagian tubuh yang terpisah (saat masih hidup) dari selain manusia, ikan, dan belalang itu najis,'],
 ['إِلَّا شَعْرَ الْمَأْكُولِ، وَرِيشَهُ، وَوَبَرَهُ، وَصُوفَهُ، وَالْمِسْكَ وَنَافِجَتَهُ.','kecuali rambut, bulu, bulu unta, dan wol hewan yang halal dimakan, serta misk dan kantongnya.']];
TR['thaharah-128']=[
 ['فَصْلٌ: وَتَطْهُرُ الْخَمْرَةُ إِذَا تَخَلَّلَتْ بِنَفْسِهَا،','Fasal: Khamr menjadi suci bila berubah menjadi cuka dengan sendirinya,'],
 ['وَكَذَلِكَ النَّبِيذُ مِنَ التَّمْرِ وَالزَّبِيبِ،','demikian pula nabidz dari kurma dan kismis,'],
 ['وَجِلْدُ الْمَيْتَةِ إِذَا دُبِغَ.','dan kulit bangkai bila disamak.'],
 ['وَإِذَا تَنَجَّسَ شَيْءٌ بِبَوْلِ كَلْبٍ أَوْ خِنْزِيرٍ أَوْ فَرْعِ أَحَدِهِمَا أَوْ لُعَابِهِ أَوْ رَوْثِهِ أَوْ عَرَقِهِ أَوْ بَدَنِهِ وَهُوَ رَطْبٌ.. غُسِلَ سَبْعاً إِحْدَاهُنَّ بِتُرَابٍ طَاهِرٍ طَهُورٍ.','Jika sesuatu terkena najis karena air kencing anjing, babi, atau keturunan salah satunya, atau air liurnya, kotorannya, keringatnya, atau badannya dalam keadaan basah, maka dibasuh tujuh kali, salah satunya dengan tanah yang suci lagi menyucikan.'],
 ['وَإِذَا تَنَجَّسَ التُّرَابُ بِالْكَلْبِ.. فَيَكْفِيهِ سَبْعُ مَرَّاتٍ بِالْمَاءِ الْخَالِصِ.','Jika tanah yang terkena najis anjing, cukup dibasuh tujuh kali dengan air murni.'],
 ['وَمَا تَنَجَّسَ بِبَوْلِ صَبِيٍّ لَمْ يَطْعَمْ غَيْرَ اللَّبَنِ.. نُضِحَ، وَهُوَ رَشُّهُ بِالْمَاءِ مَعَ الْغَلَبَةِ وَالْمُكَاثَرَةِ.','Sesuatu yang terkena air kencing bayi laki-laki yang belum makan selain susu, cukup diperciki, yaitu dipercik air secara merata dan banyak.'],
 ['وَسَائِرُ النَّجَاسَاتِ تَطْهُرُ بِالْغَسْلِ إِذَا زَالَ طَعْمُهَا وَلَوْنُهَا وَرِيحُهَا.','Najis-najis lainnya suci dengan dibasuh, bila rasa, warna, dan baunya hilang.'],
 ['وَلَا يَضُرُّ بَقَاءُ لَوْنٍ أَوْ رِيحٍ عَسُرَ زَوَالُهُ.','Tidak mengapa bila masih tersisa warna saja atau bau saja yang sulit dihilangkan.'],
 ['وَلَا يَطْهُرُ الْمَائِعُ إِذَا تَنَجَّسَ.','Benda cair yang terkena najis tidak bisa disucikan.']];
TR['thaharah-135']=[
 ['فَصْلٌ: وَيَجِبُ التَّيَمُّمُ عَنِ الْحَدَثِ الْأَصْغَرِ وَالْأَكْبَرِ عِنْدَ الْعَجْزِ عَنِ اسْتِعْمَالِ الْمَاءِ بِسَبَبِ فَقْدِهِ فِي حَضَرٍ أَوْ سَفَرٍ؛','Fasal: Wajib tayammum dari hadats kecil dan besar ketika tidak mampu menggunakan air karena tidak mendapatkannya, baik saat mukim maupun safar;'],
 ['وَلِلْمَرِيضِ.','dan bagi orang yang sakit.'],
 ['وَإِذَا كَانَ فِي بَدَنِهِ جِرَاحَةٌ يَضُرُّ بِهَا الْمَاءُ.. غَسَلَ الصَّحِيحَ، وَتَيَمَّمَ عَنِ الْجَرِيحِ فِي الْوَجْهِ وَالْيَدَيْنِ،','Jika di badannya ada luka yang berbahaya bila terkena air, ia membasuh bagian yang sehat, dan bertayammum untuk bagian yang luka pada wajah dan kedua tangan,'],
 ['وَيَكُونُ التَّيَمُّمُ وَقْتَ غَسْلِ الْعَلِيلِ.','dan tayammum itu dilakukan ketika tiba giliran membasuh anggota yang sakit.']];
TR['thaharah-138']=[
 ['وَيَجِبُ مَسْحُ الْجَبِيرَةِ بِالْمَاءِ إِذَا لَمْ يُمْكِنْ إِخْرَاجُهَا.','Wajib mengusap jabirah (perban) dengan air jika tidak memungkinkan dilepas.']];
TR['thaharah-141']=[
 ['فَصْلٌ: فُرُوضُ التَّيَمُّمِ خَمْسَةٌ:','Fasal: Fardhu tayammum ada lima:'],
 ['الْأَوَّلُ: نَقْلُ التُّرَابِ.','Yang pertama: memindahkan debu.'],
 ['الثَّانِي: النِّيَّةُ، وَهِيَ نِيَّةُ اسْتِبَاحَةِ الصَّلَاةِ؛ فَإِنْ كَانَتِ الصَّلَاةُ فَرْضاً.. نَوَى اسْتِبَاحَةَ فَرْضِ الصَّلَاةِ،','Yang kedua: niat, yaitu niat agar dibolehkan shalat; jika shalatnya fardhu, ia berniat agar dibolehkan shalat fardhu,'],
 ['وَيَجِبُ قَرْنُهَا بِوَضْعِ الْيَدِ عَلَى التُّرَابِ، وَاسْتِدَامَتُهَا إِلَى مَسْحِ شَيْءٍ مِنَ الْوَجْهِ.','dan wajib membarengkannya dengan meletakkan tangan di atas debu, serta mempertahankannya sampai mengusap sebagian wajah.'],
 ['الثَّالِثُ: مَسْحُ الْوَجْهِ.','Yang ketiga: mengusap wajah.'],
 ['الرَّابِعُ: مَسْحُ الْيَدَيْنِ مَعَ الْمِرْفَقَيْنِ.','Yang keempat: mengusap kedua tangan sampai kedua siku.'],
 ['الْخَامِسُ: التَّرْتِيبُ هَكَذَا.','Yang kelima: tertib, berurutan seperti yang disebutkan.']];
TR['thaharah-145']=[
 ['فَصْلٌ: وَشُرُوطُ التَّيَمُّمِ: الْقَصْدُ إِلَى التُّرَابِ.','Fasal: Syarat-syarat tayammum: bermaksud mengambil debu (untuk tayammum).'],
 ['وَأَنْ يَكُونَ التُّرَابُ طَاهِراً طَهُوراً خَالِصاً عَنِ الْخَلِيطِ.','Debunya suci, menyucikan, dan murni tidak tercampur.'],
 ['وَأَنْ يَكُونَ بِضَرْبَتَيْنِ: ضَرْبَةٍ لِلْوَجْهِ، وَضَرْبَةٍ لِلْيَدَيْنِ.','Dengan dua tepukan: satu tepukan untuk wajah dan satu tepukan untuk kedua tangan.'],
 ['وَأَنْ يَكُونَ بَعْدَ دُخُولِ الْوَقْتِ.','Dilakukan setelah masuk waktu.'],
 ['وَأَنْ يُجَدِّدَ التَّيَمُّمَ لِكُلِّ فَرْضٍ.','Memperbarui tayammum untuk setiap fardhu.'],
 ['وَأَنْ يُفَتِّشَ عَنِ الْمَاءِ قَبْلَ التَّيَمُّمِ وَبَعْدَ دُخُولِ الْوَقْتِ فِي رَحْلِهِ وَرُفْقَتِهِ وَحَوَالَيْهِ، وَيُنَادِي: «مَنْ مَعَهُ مَاءٌ؟».','Mencari air sebelum tayammum dan setelah masuk waktu, di tempatnya, di rombongannya, dan di sekitarnya, serta berseru: “Siapa yang punya air?”'],
 ['وَمَنْ لَمْ يَجِدْ مَاءً وَلَا تُرَاباً؛ كَأَنْ كَانَ عَلَى قُلَّةِ جَبَلٍ.. صَلَّى الْفَرْضَ وَحْدَهُ، وَأَعَادَ.','Orang yang tidak mendapatkan air maupun debu, misalnya di puncak gunung, ia shalat fardhu saja, lalu mengulangnya.'],
 ['وَيَجُوزُ التَّيَمُّمُ لِلْبَرْدِ إِذَا فَقَدَ مَا يُسَخِّنُ بِهِ الْمَاءَ، أَوْ كَانَ لَا تَنْفَعُهُ تَدْفِئَةُ أَعْضَائِهِ بَعْدَ غَسْلِهَا، أَوْ لَا يَقْدِرُ عَلَيْهَا.','Boleh bertayammum karena dingin bila tidak mendapatkan alat untuk menghangatkan air, atau menghangatkan anggota badan setelah dibasuh tidak bermanfaat baginya, atau ia tidak mampu melakukannya.'],
 ['وَيَقْضِي الْمُتَيَمِّمُ لِلْبَرْدِ وَالْمُتَيَمِّمُ الْعَاصِي بِسَفَرِهِ.','Orang yang bertayammum karena dingin dan orang yang bertayammum dalam safar maksiat wajib mengqadha shalatnya.']];
TR['thaharah-155']=[
 ['وَأَقَلُّ الْحَيْضِ: يَوْمٌ وَلَيْلَةٌ، وَأَكْثَرُهُ: خَمْسَةَ عَشَرَ يَوْمًا، وَغَالِبُهُ: سِتٌّ أَوْ سَبْعٌ.','Minimal haid adalah sehari semalam, maksimalnya lima belas hari, dan umumnya enam atau tujuh hari.'],
 ['وَيَحْرُمُ بِالْحَيْضِ وَالْجَنَابَةِ: الصَّلَاةُ، وَالطَّوَافُ، وَمَسُّ الْمُصْحَفِ، وَحَمْلُهُ، وَاللُّبْثُ فِي الْمَسْجِدِ، وَقِرَاءَةُ الْقُرْآنِ بِقَصْدِ الْقِرَاءَةِ.','Haram karena haid dan junub: shalat, thawaf, menyentuh mushaf, membawanya, berdiam di masjid, dan membaca Al-Qur’an dengan maksud membaca (tilawah).'],
 ['وَيَحْرُمُ عَلَى الْحَائِضِ وَحْدَهَا: الصَّوْمُ، وَعُبُورُ الْمَسْجِدِ إِنْ خَافَتْ تَلْوِيثَهُ بِالدَّمِ، وَالِاسْتِمْتَاعُ فِيمَا بَيْنَ السُّرَّةِ وَالرُّكْبَةِ.','Haram khusus bagi wanita haid: puasa, melewati masjid bila khawatir mengotorinya dengan darah, dan bersenang-senang pada bagian antara pusar dan lutut.'],
 ['وَالْجِمَاعُ فِي الْحَيْضِ مِنَ الْكَبَائِرِ.','Berjimak ketika haid termasuk dosa besar.'],
 ['وَيَجِبُ عَلَيْهَا قَضَاءُ صَوْمِ رَمَضَانَ، دُونَ الصَّلَاةِ.','Ia wajib mengqadha puasa Ramadhan, tidak wajib mengqadha shalat.'],
 ['وَإِذَا انْقَطَعَ الدَّمُ.. حَلَّ لَهَا الصَّوْمُ قَبْلَ الْغُسْلِ.','Jika darahnya berhenti, halal baginya berpuasa sebelum mandi.'],
 ['وَيَحْرُمُ بِالنِّفَاسِ مَا يَحْرُمُ بِالْحَيْضِ.','Haram karena nifas apa yang haram karena haid.'],
 ['وَالنِّفَاسُ: هُوَ الدَّمُ الْخَارِجُ بَعْدَ الْوِلَادَةِ.','Nifas adalah darah yang keluar setelah melahirkan.']];
TR['thaharah-156']=TR['thaharah-155'].slice(1,6);
TR['shalat-165']=[
 ['[بَابُ الصَّلَاةِ] الصَّلَوَاتُ الْمَكْتُوبَاتُ خَمْسٌ.','[Bab Shalat] Shalat-shalat yang diwajibkan ada lima.'],
 ['وَتَقْدِيمُ الصَّلَاةِ عَلَى وَقْتِهَا وَتَأْخِيرُهَا عَنْ وَقْتِهَا بِغَيْرِ عُذْرٍ مِنَ الْكَبَائِرِ.','Mendahulukan shalat sebelum waktunya dan menundanya sampai keluar waktunya tanpa uzur termasuk dosa besar.']];
TR['shalat-168']=[
 ['وَأَوَّلُ وَقْتِ الظُّهْرِ: إِذَا زَالَتِ الشَّمْسُ، وَآخِرُهُ: إِذَا صَارَ ظِلُّ كُلِّ شَيْءٍ مِثْلَهُ غَيْرَ ظِلِّ الِاسْتِوَاءِ.','Awal waktu zhuhur adalah ketika matahari tergelincir, dan akhirnya ketika bayangan setiap benda sama dengan panjangnya, selain bayangan istiwa’.'],
 ['وَأَوَّلُ وَقْتِ الْعَصْرِ: إِذَا صَارَ ظِلُّ كُلِّ شَيْءٍ مِثْلَهُ وَزَادَ أَدْنَى زِيَادَةٍ، وَآخِرُهُ: غُرُوبُ الشَّمْسِ.','Awal waktu ashar adalah ketika bayangan setiap benda sama dengan panjangnya dan bertambah sedikit, dan akhirnya terbenamnya matahari.'],
 ['وَأَوَّلُ وَقْتِ الْمَغْرِبِ: غُرُوبُ قُرْصِ الشَّمْسِ، وَآخِرُهُ عَلَى الْمُخْتَارِ: غُرُوبُ الشَّفَقِ الْأَحْمَرِ.','Awal waktu maghrib adalah terbenamnya bulatan matahari, dan akhirnya menurut pendapat terpilih adalah hilangnya mega merah.'],
 ['وَأَوَّلُ وَقْتِ الْعِشَاءِ: غُرُوبُ الشَّفَقِ الْأَحْمَرِ، وَآخِرُهُ: طُلُوعُ الْفَجْرِ الصَّادِقِ، وَهُوَ الْمُنْتَشِرُ عَرْضاً.','Awal waktu isya adalah hilangnya mega merah, dan akhirnya terbitnya fajar shadiq, yaitu fajar yang menyebar melebar.'],
 ['وَأَوَّلُ وَقْتِ الصُّبْحِ: طُلُوعُ الْفَجْرِ الصَّادِقِ، وَآخِرُهُ: طُلُوعُ الشَّمْسِ.','Awal waktu subuh adalah terbitnya fajar shadiq, dan akhirnya terbitnya matahari.'],
 ['وَأَفْضَلُ الْأَعْمَالِ.. الْمُبَادَرَةُ بِالصَّلَاةِ فِي أَوَّلِ وَقْتِهَا.','Amal yang paling utama adalah bersegera shalat di awal waktunya.'],
 ['وَيُسَنُّ الْإِبْرَادُ بِالظُّهْرِ، فِي شِدَّةِ الْحَرِّ، فِي قُطْرٍ حَارٍّ، لِمَنْ يُصَلِّي جَمَاعَةً، فِي مَسْجِدٍ بَعِيدٍ.','Disunnahkan menunda zhuhur sampai agak teduh (ibrad) ketika sangat panas, di negeri yang panas, bagi yang shalat berjamaah di masjid yang jauh.'],
 ['وَمَنْ أَخَّرَ الصَّلَاةَ حَتَّى وَقَعَ بَعْضُهَا خَارِجَ الْوَقْتِ بِغَيْرِ عُذْرٍ.. عَصَى.','Barang siapa menunda shalat sampai sebagiannya jatuh di luar waktu tanpa uzur, ia bermaksiat.'],
 ['وَمَنْ لَمْ يَعْلَمْ وَقْتَهَا.. وَجَبَ عَلَيْهِ أَنْ يَجْتَهِدَ فِي مَعْرِفَةِ دُخُولِهِ بِدِرَاسَةٍ أَوْ حِرْفَةٍ.','Barang siapa tidak mengetahui waktunya, wajib berijtihad untuk mengetahui masuknya waktu, dengan bacaan (wirid) atau pekerjaan yang biasa ia lakukan.'],
 ['وَمَنْ فَاتَهُ فَرْضٌ بِغَيْرِ عُذْرٍ.. وَجَبَ عَلَيْهِ قَضَاؤُهُ عَلَى الْفَوْرِ.','Barang siapa terluput shalat fardhu tanpa uzur, wajib mengqadhanya dengan segera.']];
TR['shalat-176']=[
 ['وَتَحْرُمُ الصَّلَاةُ فِي خَمْسَةِ أَوْقَاتٍ:','Haram shalat pada lima waktu:'],
 ['عِنْدَ طُلُوعِ الشَّمْسِ حَتَّى تَرْتَفِعَ قَدْرَ رُمْحٍ.','ketika matahari terbit sampai naik setinggi tombak;'],
 ['وَعِنْدَ الِاسْتِوَاءِ فِي غَيْرِ يَوْمِ الْجُمُعَةِ حَتَّى تَزُولَ.','ketika istiwa’, selain hari Jum‘at, sampai matahari tergelincir;'],
 ['وَعِنْدَ الِاصْفِرَارِ حَتَّى تَغْرُبَ.','ketika matahari menguning sampai terbenam;'],
 ['وَبَعْدَ صَلَاةِ الصُّبْحِ حَتَّى تَطْلُعَ الشَّمْسُ.','setelah shalat subuh sampai matahari terbit;'],
 ['وَبَعْدَ صَلَاةِ الْعَصْرِ حَتَّى تَغْرُبَ.','dan setelah shalat ashar sampai matahari terbenam.'],
 ['وَلَا يَحْرُمُ فِيهَا مَا لَهُ سَبَبٌ فِي الْحَالِ؛ كَتَحِيَّةِ الْمَسْجِدِ، وَالْكُسُوفِ؛ دُونَ رَكْعَتَيِ الِاسْتِخَارَةِ.','Tidak haram pada waktu-waktu itu shalat yang punya sebab yang ada saat itu, seperti tahiyyatul masjid dan shalat gerhana; berbeda dengan dua rakaat istikharah.'],
 ['وَيَحْرُمُ ابْتِدَاءُ الصَّلَاةِ بَعْدَ صُعُودِ الْخَطِيبِ فِي الْجُمُعَةِ عَلَى الْمِنْبَرِ غَيْرَ التَّحِيَّةِ.','Haram memulai shalat setelah khathib Jum‘at naik ke mimbar, selain tahiyyatul masjid.']];
TR['shalat-181']=[
 ['فَصْلٌ: تَجِبُ الصَّلَاةُ عَلَى كُلِّ مُسْلِمٍ، بَالِغٍ، عَاقِلٍ، طَاهِرٍ.','Fasal: Shalat wajib atas setiap muslim yang baligh, berakal, dan suci (dari haid dan nifas).'],
 ['وَيَجِبُ عَلَى الْوَلِيِّ أَنْ يَأْمُرَ الصَّبِيَّ بِهَا لِسَبْعِ سِنِينَ، وَيَضْرِبَهُ عَلَى تَرْكِهَا لِعَشْرٍ، وَالصَّبِيَّةُ كَالصَّبِيِّ.','Wajib bagi wali memerintahkan anak shalat ketika berumur tujuh tahun, dan memukulnya (untuk mendidik) bila meninggalkannya pada umur sepuluh tahun; anak perempuan sama seperti anak laki-laki.']];
TR['shalat-184']=[
 ['وَإِذَا بَلَغَ الصَّبِيُّ، أَوْ طَهُرَتِ الْحَائِضُ أَوِ النُّفَسَاءُ، أَوْ أَفَاقَ الْمَجْنُونُ قَبْلَ خُرُوجِ الْوَقْتِ بِقَدْرِ تَكْبِيرَةٍ.. وَجَبَ قَضَاءُ تِلْكَ الصَّلَاةِ،','Jika anak menjadi baligh, atau wanita haid atau nifas menjadi suci, atau orang gila sadar, sebelum habis waktu seukuran satu takbir, wajib mengqadha shalat itu;'],
 ['وَيَجِبُ أَيْضاً قَضَاءُ الْفَرْضِ الَّذِي قَبْلَهَا إِذَا كَانَ ظُهْراً أَوْ مَغْرِباً.','dan wajib pula mengqadha shalat fardhu sebelumnya jika itu zhuhur atau maghrib.']];
TR['shalat-185']=[
 ['وَإِذَا دَخَلَ الْوَقْتُ وَمَضَى قَدْرُ مَا يُؤَدَّى فِيهِ الْفَرْضُ ثُمَّ حَاضَتِ الْمَرْأَةُ أَوْ نُفِسَتْ أَوْ جُنَّ قَبْلَ الصَّلَاةِ.. وَجَبَ قَضَاءُ تِلْكَ الصَّلَاةِ.','Jika waktu shalat telah masuk dan berlalu seukuran waktu untuk mengerjakan shalat fardhu, lalu wanita itu haid, nifas, atau ia menjadi gila sebelum shalat, wajib mengqadha shalat itu.']];
TR['shalat-186']=[
 ['وَيَجِبُ عَلَى الْآبَاءِ وَالْأُمَّهَاتِ وَسَيِّدِ الْعَبِيدِ تَعْلِيمُ أَوْلَادِهِمُ الصِّغَارِ وَعَبِيدِهِمْ مَا يَجِبُ عَلَيْهِمْ بَعْدَ بُلُوغِهِمْ مِنَ الطَّهَارَةِ وَالصَّلَاةِ وَالصِّيَامِ وَغَيْرِ ذَلِكَ.','Wajib bagi para bapak, para ibu, dan tuan pemilik budak mengajarkan kepada anak-anak mereka yang masih kecil dan budak-budak mereka apa yang wajib atas mereka setelah baligh: thaharah, shalat, puasa, dan lainnya.'],
 ['وَيُعَرِّفُهُمْ تَحْرِيمَ الزِّنَا وَاللِّوَاطِ وَالسَّرِقَةِ وَشُرْبِ الْخَمْرِ وَالْمُسْكِرِ، وَتَحْرِيمَ الْكَذِبِ قَلِيلِهِ وَكَثِيرِهِ، وَالْغِيبَةِ وَالنَّمِيمَةِ وَشِبْهِ ذَلِكَ.','Mereka memberitahukan haramnya zina, liwath, mencuri, minum khamr dan yang memabukkan, haramnya dusta sedikit maupun banyak, ghibah, namimah, dan yang semisal itu.'],
 ['وَيُعَلِّمُهُمْ أَنَّهُمْ بِالْبُلُوغِ يَدْخُلُونَ فِي التَّكْلِيفِ.','Mereka mengajarkan bahwa dengan baligh, anak-anak itu masuk dalam taklif (menjadi mukallaf).'],
 ['وَيُعَرِّفُ الصَّبِيَّ عَلَامَاتِ الْبُلُوغِ: أَنَّهَا بِخَمْسَ عَشْرَةَ سَنَةً، أَوْ بِالِاحْتِلَامِ، أَوْ بِالْحَيْضِ فِي الْمَرْأَةِ.','Ia memberitahukan kepada anak tanda-tanda baligh: genap lima belas tahun, mimpi basah, atau haid bagi perempuan.'],
 ['وَأُجْرَةُ مَنْ يُعَلِّمُهُ هَذَا فِي مَالِهِ، فَإِنْ لَمْ يَكُنْ لَهُ مَالٌ.. فَعَلَى مَنْ تَجِبُ عَلَيْهِ نَفَقَتُهُ.','Upah orang yang mengajarinya hal ini diambil dari harta si anak; jika ia tidak punya harta, maka ditanggung oleh orang yang wajib menafkahinya.']];
TR['shalat-192']=[
 ['وَشُرُوطُ الصَّلَاةِ سِتَّةٌ:','Syarat-syarat shalat ada enam:'],
 ['١- مَعْرِفَةُ وَقْتِهَا، كَمَا تَقَدَّمَ.','1. mengetahui waktunya, sebagaimana telah dijelaskan;'],
 ['٢- وَاسْتِقْبَالُ الْقِبْلَةِ، إِلَّا فِي النَّافِلَةِ فِي السَّفَرِ.','2. menghadap kiblat, kecuali shalat sunnah dalam safar;'],
 ['٣- وَسَتْرُ الْعَوْرَةِ.','3. menutup aurat;'],
 ['٤- وَطَهَارَةُ الْحَدَثَيْنِ.','4. suci dari dua hadats;'],
 ['٥- وَطَهَارَةُ النَّجَاسَةِ فِي الثَّوْبِ وَالْبَدَنِ وَالْمَكَانِ.','5. suci dari najis pada pakaian, badan, dan tempat;'],
 ['٦- وَمَعْرِفَةُ فُرُوضِ الصَّلَاةِ وَسُنَنِهَا.','6. mengetahui fardhu-fardhu shalat dan sunnah-sunnahnya.'],
 ['وَعَوْرَةُ الرَّجُلِ وَالْأَمَةِ: مَا بَيْنَ سُرَّتِهِمَا وَرُكْبَتِهِمَا.','Aurat laki-laki dan budak perempuan adalah antara pusar dan lutut.'],
 ['وَعَوْرَةُ الْحُرَّةِ فِي الصَّلَاةِ وَعِنْدَ الْأَجَانِبِ: جَمِيعُ بَدَنِهَا إِلَّا الْوَجْهَ وَالْكَفَّيْنِ،','Aurat perempuan merdeka di dalam shalat dan di hadapan laki-laki non-mahram adalah seluruh badannya kecuali wajah dan kedua telapak tangan;'],
 ['وَعِنْدَ مَحَارِمِهَا: مَا بَيْنَ السُّرَّةِ وَالرُّكْبَةِ.','dan di hadapan mahramnya: antara pusar dan lutut.'],
 ['وَيُعْفَى عَنْ دَمِ مَا لَا نَفْسَ لَهُ سَائِلَةٌ، وَعَنْ وَنِيمِ الذُّبَابِ،','Dimaafkan: darah hewan yang tidak memiliki darah mengalir, kotoran lalat,'],
 ['وَعَنْ دَمِ الْبَثَرَاتِ قَلِيلِهِ وَكَثِيرِهِ، وَعَنْ قَيْحِ الدَّمَامِيلِ وَصَدِيدِهَا،','darah jerawat/bisul sedikit maupun banyak, nanah bisul dan cairannya,'],
 ['وَعَنِ الْقَلِيلِ مِنْ دَمِ الْأَجْنَبِيِّ، إِلَّا الْكَلْبَ وَالْخِنْزِيرَ.','dan sedikit darah dari luar (orang lain), kecuali darah anjing dan babi.']];
TR['shalat-202']=[
 ['فَصْلٌ: فُرُوضُ الصَّلَاةِ سَبْعَةَ عَشَرَ:','Fasal: Fardhu-fardhu shalat ada tujuh belas:'],
 ['الْأَوَّلُ: النِّيَّةُ، فَإِنْ كَانَتِ الصَّلَاةُ فَرْضاً.. وَجَبَ قَصْدُ فِعْلِهَا، وَتَعْيِينُهَا، وَنِيَّةُ الْفَرْضِيَّةِ مِنَ الْبَالِغِ.','Yang pertama: niat. Jika shalatnya fardhu, wajib memaksudkan perbuatan shalat, menentukan jenisnya, dan berniat fardhu bagi yang sudah baligh.'],
 ['وَإِنْ كَانَتْ نَافِلَةً مُؤَقَّتَةً كَالْوِتْرِ، أَوْ ذَاتَ سَبَبٍ كَالْكُسُوفِ.. وَجَبَ قَصْدُ فِعْلِهَا وَتَعْيِينُهَا.','Jika shalat sunnah yang terikat waktu seperti witir, atau yang punya sebab seperti shalat gerhana, wajib memaksudkan perbuatannya dan menentukan jenisnya.'],
 ['وَإِنْ كَانَتْ نَافِلَةً مُطْلَقَةً.. وَجَبَ قَصْدُ فِعْلِهَا فَقَطْ.','Jika shalat sunnah mutlak, cukup wajib memaksudkan perbuatan shalatnya saja.'],
 ['الثَّانِي: تَكْبِيرَةُ الْإِحْرَامِ، وَهُوَ أَنْ يَقُولَ: «اللهُ أَكْبَرُ»، وَيُجْزِئُهُ: «اللهُ الْأَكْبَرُ»،','Yang kedua: takbiratul ihram, yaitu mengucapkan “Allāhu akbar”, dan sah juga “Allāhul akbar”;'],
 ['وَيَجِبُ أَنْ تَكُونَ النِّيَّةُ مُقَارِنَةً لِلتَّكْبِيرِ جَمِيعِهِ.','dan niat wajib menyertai seluruh takbir.'],
 ['الثَّالِثُ: الْقِيَامُ إِنْ كَانَتِ الصَّلَاةُ فَرْضاً وَقَدَرَ.','Yang ketiga: berdiri, jika shalatnya fardhu dan ia mampu.'],
 ['الرَّابِعُ: قِرَاءَةُ الْفَاتِحَةِ، وَيَجِبُ: تَرْتِيبُهَا، وَمُوَالَاتُهَا، وَتَشْدِيدَاتُهَا، وَإِخْرَاجُ الضَّادِ مِنَ الظَّاءِ،','Yang keempat: membaca Al-Fatihah; wajib membacanya berurutan, bersambung, menjaga tasydid-tasydidnya, dan membedakan huruf dhad dari zha;'],
 ['وَتَجِبُ فِي كُلِّ رَكْعَةٍ إِلَّا رَكْعَةَ الْمَسْبُوقِ.','dan wajib di setiap rakaat, kecuali rakaat makmum masbuq.'],
 ['الْخَامِسُ: الرُّكُوعُ.','Yang kelima: rukuk.'],
 ['السَّادِسُ: الطُّمَأْنِينَةُ فِيهِ، بِحَيْثُ يَسْتَقِرُّ كُلُّ عُضْوٍ مَكَانَهُ.','Yang keenam: tuma’ninah di dalamnya, yaitu setiap anggota badan tenang di tempatnya.'],
 ['السَّابِعُ: الِاعْتِدَالُ.','Yang ketujuh: i‘tidal.'],
 ['الثَّامِنُ: الطُّمَأْنِينَةُ فِيهِ.','Yang kedelapan: tuma’ninah di dalamnya.'],
 ['التَّاسِعُ: السُّجُودُ مَرَّتَيْنِ فِي كُلِّ رَكْعَةٍ،','Yang kesembilan: sujud dua kali di setiap rakaat;'],
 ['وَأَقَلُّهُ: وَضْعُ شَيْءٍ مِنْ جَبْهَتِهِ عَلَى الْأَرْضِ، وَبُطُونِ أَصَابِعِ يَدَيْهِ وَرِجْلَيْهِ، وَوَضْعُ رُكْبَتَيْهِ، وَتَحَامُلٌ بِرَأْسِهِ، وَارْتِفَاعُ أَسَافِلِهِ عَلَى أَعَالِيهِ.','minimalnya: meletakkan sebagian dahi di atas tempat sujud, bagian dalam jari-jari kedua tangan dan kedua kaki, meletakkan kedua lutut, membebankan kepala, dan bagian bawah tubuh lebih tinggi daripada bagian atasnya.'],
 ['الْعَاشِرُ: الطُّمَأْنِينَةُ فِيهِ.','Yang kesepuluh: tuma’ninah di dalamnya.'],
 ['الْحَادِي عَشَرَ: الْجُلُوسُ بَيْنَ السَّجْدَتَيْنِ.','Yang kesebelas: duduk di antara dua sujud.'],
 ['الثَّانِي عَشَرَ: الطُّمَأْنِينَةُ فِيهِ.','Yang kedua belas: tuma’ninah di dalamnya.'],
 ['الثَّالِثَ عَشَرَ: التَّشَهُّدُ الْأَخِيرُ.','Yang ketiga belas: tasyahud akhir.'],
 ['الرَّابِعَ عَشَرَ: الْقُعُودُ فِيهِ.','Yang keempat belas: duduk untuk tasyahud akhir.'],
 ['الْخَامِسَ عَشَرَ: الصَّلَاةُ عَلَى النَّبِيِّ ﷺ فِي التَّشَهُّدِ الْأَخِيرِ.','Yang kelima belas: bershalawat kepada Nabi ﷺ di tasyahud akhir.'],
 ['السَّادِسَ عَشَرَ: السَّلَامُ، وَأَقَلُّهُ: «السَّلَامُ عَلَيْكُمْ».','Yang keenam belas: salam, minimalnya “as-salāmu ‘alaikum”.'],
 ['السَّابِعَ عَشَرَ: التَّرْتِيبُ.','Yang ketujuh belas: tertib (berurutan).']];
TR['shalat-222']=[
 ['فَصْلٌ: وَسُنَنُهَا كَثِيرَةٌ، مِنْهَا: رَفْعُ الْيَدَيْنِ عِنْدَ تَكْبِيرَةِ الْإِحْرَامِ، وَعِنْدَ الرُّكُوعِ، وَعِنْدَ الرَّفْعِ مِنْهُ، وَعِنْدَ الْقِيَامِ مِنَ التَّشَهُّدِ الْأَوَّلِ.','Fasal: Sunnah-sunnah shalat banyak, di antaranya: mengangkat kedua tangan ketika takbiratul ihram, ketika hendak rukuk, ketika bangkit dari rukuk, dan ketika berdiri dari tasyahud awal.'],
 ['وَمِنْ سُنَنِهَا: دُعَاءُ الِاسْتِفْتَاحِ.','Di antara sunnahnya: doa istiftah.'],
 ['ثُمَّ التَّعَوُّذُ، وَيُسَنُّ فِي كُلِّ رَكْعَةٍ، وَالْأُولَى آكَدُ.','Kemudian ta‘awwudz; disunnahkan di setiap rakaat, dan pada rakaat pertama lebih ditekankan.'],
 ['وَقِرَاءَةُ سُورَةٍ -لِغَيْرِ الْمَأْمُومِ السَّامِعِ- بَعْدَ الْفَاتِحَةِ.','Membaca surat setelah Al-Fatihah, bagi selain makmum yang mendengar bacaan imam.'],
 ['وَالْجَهْرُ فِي الصُّبْحِ، وَالرَّكْعَتَيْنِ الْأُولَيَيْنِ مِنَ الْمَغْرِبِ وَالْعِشَاءِ لِلرَّجُلِ وَالْمَرْأَةِ إِنْ لَمْ يَحْضُرْ عِنْدَهَا رِجَالٌ أَجَانِبُ.','Mengeraskan bacaan pada shalat subuh dan dua rakaat pertama maghrib dan isya, bagi laki-laki, dan bagi perempuan bila tidak ada laki-laki non-mahram di dekatnya.'],
 ['وَوَضْعُ الْيُمْنَى عَلَى كُوعِ الْيُسْرَى تَحْتَ صَدْرِهِ.','Meletakkan tangan kanan di atas pergelangan tangan kiri, di bawah dada.'],
 ['وَالتَّكْبِيرَاتُ غَيْرَ تَكْبِيرَةِ الْإِحْرَامِ.','Takbir-takbir (perpindahan) selain takbiratul ihram.'],
 ['وَالْقُنُوتُ فِي اعْتِدَالِ الثَّانِيَةِ مِنَ الصُّبْحِ، وَفِي سَائِرِ الْمَكْتُوبَاتِ لِلنَّازِلَةِ.','Qunut pada i‘tidal rakaat kedua shalat subuh, dan pada shalat-shalat fardhu lainnya ketika terjadi musibah (nazilah).'],
 ['وَيَقُولُ فِي الرُّكُوعِ: «سُبْحَانَ رَبِّيَ الْعَظِيمِ وَبِحَمْدِهِ» ثَلَاثاً، وَفِي السُّجُودِ: «سُبْحَانَ رَبِّيَ الْأَعْلَى وَبِحَمْدِهِ» ثَلَاثاً.','Ketika rukuk mengucapkan “Subḥāna rabbiyal ‘aẓīmi wa biḥamdih” tiga kali, dan ketika sujud “Subḥāna rabbiyal a‘lā wa biḥamdih” tiga kali.'],
 ['وَيَضَعُ فِي السُّجُودِ رُكْبَتَيْهِ، ثُمَّ يَدَيْهِ، ثُمَّ جَبْهَتَهُ وَأَنْفَهُ.','Ketika sujud, ia meletakkan kedua lututnya, lalu kedua tangannya, lalu dahi bersama hidungnya.'],
 ['وَيَقُولُ بَيْنَ السَّجْدَتَيْنِ: «رَبِّ اغْفِرْ لِي، وَارْحَمْنِي، وَاجْبُرْنِي، وَارْفَعْنِي، وَارْزُقْنِي، وَاهْدِنِي، وَعَافِنِي، وَاعْفُ عَنِّي».','Di antara dua sujud ia mengucapkan: “Ya Rabb, ampunilah aku, rahmatilah aku, cukupkanlah aku, angkatlah derajatku, berilah aku rezeki, berilah aku petunjuk, sehatkanlah aku, dan maafkanlah aku.”'],
 ['وَتُسَنُّ جَلْسَةُ الِاسْتِرَاحَةِ فِي الْأُولَى وَالثَّالِثَةِ مِنْ غَيْرِ الْمَغْرِبِ.','Disunnahkan duduk istirahat pada rakaat pertama dan ketiga, selain shalat maghrib.'],
 ['وَيُسَنُّ التَّشَهُّدُ الْأَوَّلُ، وَالْقُعُودُ لَهُ، وَالصَّلَاةُ عَلَى النَّبِيِّ ﷺ فِيهِ، وَفِي الْقُنُوتِ.','Disunnahkan tasyahud awal, duduk untuknya, bershalawat kepada Nabi ﷺ di dalamnya, dan di dalam qunut.'],
 ['وَالِافْتِرَاشُ فِي جَمِيعِ الْجَلَسَاتِ، وَالتَّوَرُّكُ فِي التَّشَهُّدِ الْأَخِيرِ.','Duduk iftirasy di semua duduk, dan tawarruk di tasyahud akhir.'],
 ['وَيُسَنُّ فِيهَا نَظَرُهُ إِلَى مَوْضِعِ سُجُودِهِ.','Disunnahkan di dalam shalat memandang tempat sujud.'],
 ['وَالْخُشُوعُ. وَتَدَبُّرُ الْقِرَاءَةِ وَالذِّكْرِ.','Khusyu‘, serta merenungkan makna bacaan dan dzikir.'],
 ['وَتَطْوِيلُ قِرَاءَةِ الرَّكْعَةِ الْأُولَى عَلَى الثَّانِيَةِ.','Memanjangkan bacaan rakaat pertama melebihi rakaat kedua.'],
 ['وَدُخُولُهَا بِنَشَاطٍ وَفَرَاغِ قَلْبٍ.','Memasuki shalat dengan semangat dan hati yang lapang dari kesibukan.'],
 ['وَكَثْرَةُ الدُّعَاءِ فِي السُّجُودِ.','Dan memperbanyak doa ketika sujud.']];
TR['shalat-236']=[
 ['فَصْلٌ: وَتَبْطُلُ الصَّلَاةُ بِالْكَلَامِ الْكَثِيرِ، وَالْأَكْلِ الْكَثِيرِ، وَالْفِعْلِ الْكَثِيرِ؛ كَثَلَاثِ خَطَوَاتٍ، وَثَلَاثِ ضَرَبَاتٍ مُتَوَالِيَاتٍ، وَبِالضَّرْبَةِ الْمُفْرِطَةِ، وَالْوَثْبَةِ الْفَاحِشَةِ.','Fasal: Shalat batal karena berbicara banyak, makan banyak, dan gerakan banyak, seperti tiga langkah atau tiga pukulan berturut-turut; juga karena pukulan yang sangat keras dan lompatan yang besar.'],
 ['وَإِنْ تَكَلَّمَ بِكَلَامٍ قَلِيلٍ نَاسِياً، أَوْ أَكَلَ قَلِيلاً نَاسِياً، أَوْ زَادَ رُكُوعاً أَوْ سُجُوداً نَاسِياً.. لَمْ تَبْطُلْ بِذَلِكَ، وَسَجَدَ لِلسَّهْوِ.','Jika ia berbicara sedikit karena lupa, makan sedikit karena lupa, atau menambah rukuk atau sujud karena lupa, shalatnya tidak batal karena hal itu, dan ia sujud sahwi.']];
TR['shalat-243']=[
 ['فَصْلٌ: وَيُسْتَحَبُّ سُجُودُ السَّهْوِ، وَهُوَ سَجْدَتَانِ قُبَيْلَ السَّلَامِ،','Fasal: Disunnahkan sujud sahwi, yaitu dua kali sujud sesaat sebelum salam,'],
 ['عِنْدَ تَرْكِ التَّشَهُّدِ الْأَوَّلِ، وَالصَّلَاةِ عَلَى النَّبِيِّ ﷺ فِيهِ،','ketika meninggalkan tasyahud awal dan shalawat kepada Nabi ﷺ di dalamnya,'],
 ['وَتَرْكِ الْقُنُوتِ فِي الصُّبْحِ، وَالصَّلَاةِ عَلَى النَّبِيِّ ﷺ فِيهِ، وَالْقِيَامِ فِيهِ،','meninggalkan qunut subuh, shalawat kepada Nabi ﷺ di dalamnya, dan berdiri untuknya,'],
 ['وَالْكَلَامِ الْقَلِيلِ نَاسِياً، وَزِيَادَةِ رُكْنٍ فِعْلِيٍّ نَاسِياً، وَالْأَكْلِ الْقَلِيلِ نَاسِياً.','berbicara sedikit karena lupa, menambah rukun perbuatan karena lupa, dan makan sedikit karena lupa.'],
 ['وَتَجِبُ مُتَابَعَةُ الْإِمَامِ فِيهِ؛','Wajib mengikuti imam dalam sujud sahwi;'],
 ['فَلَوْ سَجَدَ لِسَهْوِ نَفْسِهِ أَوْ تَخَلَّفَ عَنْ سُجُودِ إِمَامِهِ عَامِداً عَالِماً بِالتَّحْرِيمِ.. بَطَلَتْ صَلَاتُهُ.','maka seandainya makmum sujud karena lupanya sendiri, atau tidak ikut sujud imamnya dengan sengaja dan tahu haramnya, batal shalatnya.']];
TR['shalat-249']=[
 ['فَصْلٌ: وَيُسْتَحَبُّ سُجُودُ التِّلَاوَةِ لِلْقَارِئِ وَالْمُسْتَمِعِ وَالسَّامِعِ، فِي أَرْبَعَ عَشْرَةَ آيَةً،','Fasal: Disunnahkan sujud tilawah bagi yang membaca, yang sengaja mendengarkan, dan yang sekadar mendengar, pada empat belas ayat;'],
 ['يَسْجُدُهَا الْإِمَامُ وَالْمُنْفَرِدُ.','imam dan orang yang shalat sendirian melakukan sujud ini.'],
 ['وَلَا يَسْجُدُ الْمَأْمُومُ لِلتِّلَاوَةِ إِلَّا إِذَا سَجَدَ إِمَامُهُ،','Makmum tidak sujud tilawah kecuali bila imamnya sujud;'],
 ['فَإِنْ سَجَدَ دُونَ إِمَامِهِ.. بَطَلَتْ صَلَاتُهُ.','jika ia sujud sementara imamnya tidak, batal shalatnya.']];
TR['shalat-254']=[
 ['فَصْلٌ: وَتَبْطُلُ الصَّلَاةُ خَلْفَ الْأَلْثَغِ وَالْأَرَتِّ،','Fasal: Batal shalat di belakang imam yang altsagh (mengganti huruf) dan yang arat (meng-idgham-kan bukan pada tempatnya),'],
 ['وَخَلْفَ الْمَأْمُومِ،','di belakang orang yang sedang menjadi makmum,'],
 ['وَخَلْفَ الْمُحْدِثِ وَالْجُنُبِ وَالْكَافِرِ،','di belakang orang yang berhadats, junub, dan orang kafir,'],
 ['وَخَلْفَ مَنْ عَلَى بَدَنِهِ أَوْ ثَوْبِهِ نَجَاسَةٌ،','di belakang orang yang ada najis di badan atau pakaiannya,'],
 ['وَخَلْفَ فَاقِدِ الْمَاءِ وَالتُّرَابِ،','dan di belakang orang yang tidak mendapatkan air maupun debu.'],
 ['وَلَا يُصَلِّي الرَّجُلُ خَلْفَ الْمَرْأَةِ وَالْخُنْثَى.','Laki-laki tidak boleh shalat di belakang perempuan dan khuntsa.']];
TR['shalat-259']=[
 ['فَصْلٌ: وَشُرُوطُ الْجَمَاعَةِ سِتَّةٌ:','Fasal: Syarat-syarat berjamaah ada enam:'],
 ['الْأَوَّلُ: أَلَّا يَتَقَدَّمَ عَلَى إِمَامِهِ؛ وَتُكْرَهُ مُسَاوَاتُهُ، وَيُنْدَبُ تَخَلُّفُ الْمَأْمُومِ عَنْ إِمَامِهِ يَسِيراً.','Yang pertama: makmum tidak lebih maju dari imamnya; sejajar dengannya makruh, dan disunnahkan makmum sedikit di belakang imam.'],
 ['الثَّانِي: أَنْ يَجْمَعَهُمَا مَسْجِدٌ، أَوْ ثَلَاثُ مِئَةِ ذِرَاعٍ فِي غَيْرِهِ.','Yang kedua: keduanya berada dalam satu masjid, atau dalam jarak tiga ratus hasta bila di luar masjid.'],
 ['الثَّالِثُ: أَنْ يَعْلَمَ انْتِقَالَاتِ الْإِمَامِ بِأَنْ يَرَاهُ أَوْ يَرَى بَعْضَ الْمَأْمُومِينَ، أَوْ يَسْمَعَهُ أَوْ يَسْمَعَ الْمُبَلِّغَ.','Yang ketiga: makmum mengetahui perpindahan gerakan imam, dengan melihatnya atau melihat sebagian makmum, atau mendengar suaranya atau suara muballigh.'],
 ['الرَّابِعُ: أَنْ يَنْوِيَ الِاقْتِدَاءَ بِهِ أَوِ الْجَمَاعَةَ.','Yang keempat: berniat bermakmum kepadanya atau berniat berjamaah.'],
 ['الْخَامِسُ: أَنْ تُوَافِقَ صَلَاتُهُ صَلَاةَ إِمَامِهِ؛ فَلَا تَصِحُّ صَلَاةُ الْكُسُوفِ خَلْفَ الصَّلَاةِ الْمَكْتُوبَةِ، وَكَذَا خَلْفَ الْجَنَازَةِ، وَلَا الْجَنَازَةُ خَلْفَ الصُّبْحِ.','Yang kelima: shalatnya sesuai dengan shalat imamnya; maka tidak sah shalat gerhana di belakang shalat fardhu, demikian pula (shalat fardhu) di belakang shalat jenazah, dan tidak sah shalat jenazah di belakang shalat subuh.'],
 ['السَّادِسُ: أَنْ يُتَابِعَهُ،','Yang keenam: mengikuti imam;'],
 ['فَلَوْ تَقَدَّمَ عَلَى إِمَامِهِ بِرُكْنَيْنِ فِعْلِيَّيْنِ، أَوْ تَأَخَّرَ عَنْهُ بِرُكْنَيْنِ فِعْلِيَّيْنِ بِغَيْرِ عُذْرٍ.. بَطَلَتْ صَلَاتُهُ،','maka seandainya ia mendahului imamnya dua rukun perbuatan, atau tertinggal darinya dua rukun perbuatan tanpa uzur, batal shalatnya;'],
 ['أَوْ تَخَلَّفَ بِعُذْرٍ كَبُطْءِ الْقِرَاءَةِ.. عُذِرَ إِلَى ثَلَاثَةِ أَرْكَانٍ طَوِيلَةٍ.','jika ia tertinggal karena uzur, seperti bacaannya lambat, ia dimaafkan sampai tiga rukun panjang.']];
TR['shalat-265']=[
 ['فَصْلٌ: وَيَجُوزُ لِلْمُسَافِرِ سَفَراً طَوِيلاً مُبَاحاً، وَهُوَ مَرْحَلَتَانِ.. قَصْرُ الظُّهْرِ وَالْعَصْرِ وَالْعِشَاءِ رَكْعَتَيْنِ رَكْعَتَيْنِ.','Fasal: Boleh bagi musafir dalam perjalanan jauh yang mubah, yaitu dua marhalah, mengqashar zhuhur, ashar, dan isya menjadi dua rakaat dua rakaat.'],
 ['وَمَنْ فَاتَتْهُ صَلَاةٌ فِي السَّفَرِ وَقَضَاهَا فِي الْحَضَرِ أَوْ عَكْسُهُ.. أَتَمَّهَا.','Barang siapa terluput shalat ketika safar lalu mengqadhanya ketika mukim, atau sebaliknya, ia menyempurnakannya (empat rakaat).'],
 ['وَيُشْتَرَطُ: قَصْدُ مَوْضِعٍ مُعَيَّنٍ، فَلَا يَقْصُرُ الْهَائِمُ؛','Disyaratkan: bermaksud menuju tempat tertentu, maka orang yang berjalan tanpa tujuan tidak boleh mengqashar;'],
 ['وَأَنْ لَا يُصَلِّيَ خَلْفَ مَنْ يُتِمُّ الصَّلَاةَ أَوْ شَكَّ أَنَّهُ مُتِمٌّ أَوْ قَاصِرٌ؛','tidak shalat di belakang orang yang menyempurnakan shalatnya, atau yang ia ragukan apakah menyempurnakan atau mengqashar;'],
 ['وَأَنْ يَنْوِيَ الْقَصْرَ عِنْدَ الْإِحْرَامِ.','dan berniat qashar ketika takbiratul ihram.']];
TR['shalat-272']=[
 ['فَصْلٌ: وَيَجُوزُ لِلْمُسَافِرِ سَفَراً طَوِيلاً مُبَاحاً.. الْجَمْعُ بَيْنَ الظُّهْرِ وَالْعَصْرِ تَقْدِيماً وَتَأْخِيراً، وَكَذَا بَيْنَ الْمَغْرِبِ وَالْعِشَاءِ.','Fasal: Boleh bagi musafir dalam perjalanan jauh yang mubah menjamak zhuhur dan ashar, secara taqdim maupun ta’khir, demikian pula maghrib dan isya.'],
 ['وَإِذَا جَمَعَ تَقْدِيماً.. فَيُشْتَرَطُ: الْبُدَاءَةُ بِالْأُولَى، وَنِيَّةُ الْجَمْعِ فِيهَا، وَأَنْ لَا يَطُولَ الْفَصْلُ بَيْنَهُمَا.','Jika menjamak taqdim, disyaratkan: memulai dengan shalat yang pertama, berniat jamak di dalamnya, dan tidak ada jeda lama di antara keduanya.'],
 ['وَفِي جَمْعِ التَّأْخِيرِ يُشْتَرَطُ: أَنْ يَنْوِيَ التَّأْخِيرَ قَبْلَ خُرُوجِ وَقْتِ الظُّهْرِ وَقَبْلَ خُرُوجِ وَقْتِ الْمَغْرِبِ.','Pada jamak ta’khir disyaratkan berniat menunda sebelum habis waktu zhuhur dan sebelum habis waktu maghrib.']];
TR['shalat-276']=[
 ['فَصْلٌ: تَجِبُ الْجُمُعَةُ عَلَى كُلِّ مُسْلِمٍ مُكَلَّفٍ ذَكَرٍ حُرٍّ مُقِيمٍ بِلَا مَرَضٍ.','Fasal: Jum‘at wajib atas setiap muslim yang mukallaf, laki-laki, merdeka, mukim, dan tidak sakit.'],
 ['وَيُعْذَرُ فِي تَرْكِ الْجُمُعَةِ وَالْجَمَاعَةِ: عِنْدَ الْمَطَرِ، وَالْمَرَضِ، وَالتَّمْرِيضِ، وَإِشْرَافِ الْقَرِيبِ وَنَحْوِهِ عَلَى الْمَوْتِ،','Seseorang diberi uzur untuk meninggalkan Jum‘at dan jamaah: ketika hujan, sakit, merawat orang sakit, menunggui kerabat atau semisalnya yang menjelang wafat,'],
 ['وَالْخَوْفِ عَلَى نَفْسِهِ أَوْ مَالِهِ أَوْ عِرْضِهِ، وَمُدَافَعَةِ الْحَدَثِ مَعَ سَعَةِ الْوَقْتِ، وَشِدَّةِ الْجُوعِ، وَشِدَّةِ الْعَطَشِ،','takut atas keselamatan diri, harta, atau kehormatannya, menahan hadats sementara waktu masih longgar, sangat lapar, dan sangat haus,'],
 ['وَشِدَّةِ الْحَرِّ وَالْبَرْدِ، وَشِدَّةِ الرِّيحِ بِاللَّيْلِ، وَشِدَّةِ الْوَحَلِ، وَسَفَرِ الرُّفْقَةِ.','sangat panas atau sangat dingin, angin kencang di malam hari, lumpur yang parah, dan rombongan safarnya akan berangkat.']];
TR['shalat-282']=[
 ['فَصْلٌ: وَشُرُوطُ الْجُمُعَةِ: أَنْ تَكُونَ كُلُّهَا فِي وَقْتِ الظُّهْرِ.','Fasal: Syarat-syarat Jum‘at: seluruhnya dilaksanakan di waktu zhuhur;'],
 ['وَأَنْ تُقَامَ فِي نَفْسِ الْبَلَدِ.','didirikan di dalam pemukiman;'],
 ['وَأَنْ لَا تُقَامَ قَبْلَهَا جُمُعَةٌ فِي تِلْكَ الْبَلَدِ.','tidak didahului Jum‘at lain di daerah itu;'],
 ['وَأَنْ تُصَلَّى جَمَاعَةً.','dilaksanakan berjamaah;'],
 ['وَأَنْ يَكُونُوا أَرْبَعِينَ ذَكَراً مُكَلَّفاً حُرّاً مُسْتَوْطِناً لَا يَظْعَنُ شِتَاءً وَلَا صَيْفاً إِلَّا لِحَاجَةٍ.','jamaahnya empat puluh laki-laki mukallaf, merdeka, penduduk tetap yang tidak pindah di musim dingin maupun panas kecuali karena keperluan;'],
 ['وَأَنْ يَتَقَدَّمَهَا خُطْبَتَانِ.','dan didahului dua khutbah.']];
TR['shalat-286']=[
 ['فَصْلٌ: وَفُرُوضُ الْخُطْبَتَيْنِ خَمْسَةٌ:','Fasal: Fardhu dua khutbah ada lima:'],
 ['الْأَوَّلُ: حَمْدُ اللهِ فِيهِمَا.','Yang pertama: memuji Allah di kedua khutbah.'],
 ['الثَّانِي: الصَّلَاةُ عَلَى النَّبِيِّ ﷺ فِيهِمَا.','Yang kedua: bershalawat kepada Nabi ﷺ di kedua khutbah.'],
 ['الثَّالِثُ: الْوَصِيَّةُ بِالتَّقْوَى فِيهِمَا.','Yang ketiga: berwasiat takwa di kedua khutbah.'],
 ['الرَّابِعُ: قِرَاءَةُ آيَةٍ فِي الْأُولَى أَوْ فِي الثَّانِيَةِ.','Yang keempat: membaca satu ayat di khutbah pertama atau kedua.'],
 ['الْخَامِسُ: الدُّعَاءُ لِلْمُؤْمِنِينَ، وَلَوْ «رَحِمَكُمُ اللهُ» فِي الثَّانِيَةِ.','Yang kelima: berdoa untuk kaum mukminin di khutbah kedua, walau hanya dengan “raḥimakumullāh”.']];
TR['shalat-289']=[
 ['وَشُرُوطُهُمَا: إِسْمَاعُهُمَا أَرْبَعِينَ،','Syarat-syarat dua khutbah: diperdengarkan kepada empat puluh orang,'],
 ['وَالْمُوَالَاةُ بَيْنَهُمَا، وَبَيْنَهُمَا وَبَيْنَ الصَّلَاةِ،','berkesinambungan antara keduanya, serta antara keduanya dan shalat,'],
 ['وَطَهَارَةُ الْحَدَثِ الْأَصْغَرِ وَالْأَكْبَرِ، وَطَهَارَةُ النَّجَاسَةِ فِي الثَّوْبِ وَالْبَدَنِ وَالْمَكَانِ،','suci dari hadats kecil dan besar, suci dari najis pada pakaian, badan, dan tempat,'],
 ['وَالْقِيَامُ إِنْ قَدَرَ، وَسَتْرُ الْعَوْرَةِ،','berdiri bila mampu, menutup aurat,'],
 ['وَالْجُلُوسُ بَيْنَ الْخُطْبَتَيْنِ بِقَدْرِ الطُّمَأْنِينَةِ،','duduk di antara dua khutbah seukuran tuma’ninah,'],
 ['وَأَنْ تَكُونَ بِالْعَرَبِيَّةِ، وَبَعْدَ الزَّوَالِ.','dengan bahasa Arab, dan setelah tergelincir matahari.']];
TR['shalat-294']=[
 ['فَصْلٌ: تَجْهِيزُ الْمَيِّتِ، وَهُوَ: غُسْلُهُ، وَتَكْفِينُهُ، وَالصَّلَاةُ عَلَيْهِ، وَدَفْنُهُ.. فَرْضُ كِفَايَةٍ.','Fasal: Mengurus jenazah, yaitu memandikan, mengafani, menshalatkan, dan menguburkannya, hukumnya fardhu kifayah.'],
 ['وَأَقَلُّ غُسْلِهِ: تَعْمِيمُ بَدَنِهِ شَعْراً وَبَشَراً بِالْمَاءِ الْخَالِصِ بَعْدَ إِزَالَةِ النَّجَاسَةِ.','Minimal memandikannya adalah meratakan air murni ke seluruh badannya, rambut maupun kulit, setelah najisnya dihilangkan.'],
 ['وَأَمَّا الْكَفَنُ.. فَأَقَلُّهُ: مَا يَسْتُرُ الْعَوْرَةَ.','Adapun kafan, minimalnya kain yang menutupi aurat.'],
 ['وَالْأَفْضَلُ لِلرَّجُلِ: ثَلَاثُ لَفَائِفَ، وَلِلْمَرْأَةِ خَمْسَةٌ: إِزَارٌ، وَخِمَارٌ، وَقَمِيصٌ، وَلِفَافَتَانِ.','Yang afdhal bagi laki-laki tiga lapis kain, dan bagi perempuan lima: kain bawah, kerudung, gamis, dan dua lapis kain pembungkus.']];
TR['shalat-300']=[
 ['فَصْلٌ: وَفُرُوضُ صَلَاةِ الْجَنَازَةِ سَبْعَةٌ:','Fasal: Fardhu shalat jenazah ada tujuh:'],
 ['الْأَوَّلُ: النِّيَّةُ؛ فَيَنْوِي فِعْلَ الصَّلَاةِ، وَتَعْيِينَهَا، كَصَلَاةِ الْجَنَازَةِ؛ وَيَنْوِي فَرْضِيَّتَهَا.','Yang pertama: niat; ia meniatkan perbuatan shalat, menentukannya sebagai shalat jenazah, dan meniatkan fardhunya.'],
 ['الثَّانِي: أَرْبَعُ تَكْبِيرَاتٍ.','Yang kedua: empat kali takbir.'],
 ['الثَّالِثُ: قِرَاءَةُ الْفَاتِحَةِ فِي الْأُولَى أَوْ غَيْرِهَا.','Yang ketiga: membaca Al-Fatihah setelah takbir pertama atau setelah takbir lainnya.'],
 ['الرَّابِعُ: الصَّلَاةُ عَلَى النَّبِيِّ ﷺ بَعْدَ الثَّانِيَةِ.','Yang keempat: bershalawat kepada Nabi ﷺ setelah takbir kedua.'],
 ['الْخَامِسُ: الدُّعَاءُ لِلْمَيِّتِ بَعْدَ الثَّالِثَةِ.','Yang kelima: mendoakan mayit setelah takbir ketiga.'],
 ['السَّادِسُ: الْقِيَامُ لِلْقَادِرِ.','Yang keenam: berdiri bagi yang mampu.'],
 ['السَّابِعُ: السَّلَامُ.','Yang ketujuh: salam.']];
TR['shalat-306']=[
 ['فَصْلٌ: وَأَمَّا الدَّفْنُ.. فَأَقَلُّهُ: حُفْرَةٌ تَكْتُمُ رَائِحَتَهُ، وَتَحْرُسُهُ مِنَ السِّبَاعِ؛','Fasal: Adapun menguburkan, minimalnya lubang yang menahan baunya dan menjaganya dari binatang buas;'],
 ['وَيَجِبُ تَوْجِيهُهُ لِلْقِبْلَةِ.','dan wajib menghadapkannya ke kiblat.'],
 ['وَأَكْمَلُهُ: حُفْرَةٌ قَدْرَ قَامَةٍ وَبَسْطَةٍ، وَهُوَ: أَرْبَعَةُ أَذْرُعٍ وَنِصْفٌ.','Yang paling sempurna: lubang seukuran tinggi orang berdiri dengan tangan terjulur ke atas, yaitu empat setengah hasta.'],
 ['وَيَحْرُمُ النَّدْبُ بِتَعْدِيدِ شَمَائِلِ الْمَيِّتِ؛ نَحْوُ: وَاسَيِّدَاهُ، وَاكَهْفَاهُ.','Haram meratap dengan menyebut-nyebut kebaikan mayit, seperti: “Wahai tuanku! Wahai tempat berlindungku!”'],
 ['وَيَحْرُمُ النَّوْحُ، وَهُوَ رَفْعُ الصَّوْتِ بِالنَّدْبِ.','Haram pula niyahah, yaitu meratap dengan suara keras.'],
 ['وَيَحْرُمُ الْجَزَعُ بِضَرْبِ الصَّدْرِ وَالْخَدِّ، وَنَشْرِ الشَّعْرِ، وَشَقِّ الْجَيْبِ، وَطَرْحِ الرَّمَادِ عَلَى الرَّأْسِ، وَنَحْوِ ذَلِكَ.','Haram tidak bersabar dengan memukul dada dan pipi, mengacak rambut, merobek kerah baju, menaburkan debu ke kepala, dan semisalnya.']];
TR['zakat-309']=[
 ['[بَابُ الزَّكَاةِ] تَجِبُ الزَّكَاةُ فِي الْإِبِلِ، وَالْبَقَرِ، وَالْغَنَمِ، وَالزُّرُوعِ وَالثِّمَارِ، وَالْمَعْدِنِ، وَالرِّكَازِ، وَالتِّجَارَةِ.','[Bab Zakat] Zakat wajib pada unta, sapi, kambing, hasil pertanian dan buah-buahan, barang tambang, harta terpendam (rikaz), dan barang dagangan.']];
TR['zakat-314']=[
 ['فَأَمَّا الْإِبِلُ: فَفِي خَمْسٍ مِنْهَا: شَاةٌ جَذَعَةٌ مِنَ الضَّأْنِ لَهَا سَنَةٌ، أَوْ ثَنِيَّةٌ مِنَ الْمَعْزِ لَهَا سَنَتَانِ،','Adapun unta: pada lima ekor zakatnya seekor kambing, yaitu domba jadza‘ah berumur satu tahun atau kambing kacang tsaniyyah berumur dua tahun;'],
 ['وَفِي عَشْرٍ: شَاتَانِ، وَفِي خَمْسَ عَشْرَةَ: ثَلَاثُ شِيَاهٍ، وَفِي عِشْرِينَ: أَرْبَعُ شِيَاهٍ،','pada sepuluh ekor: dua kambing; pada lima belas: tiga kambing; pada dua puluh: empat kambing;'],
 ['وَفِي خَمْسٍ وَعِشْرِينَ: بِنْتُ مَخَاضٍ لَهَا سَنَةٌ، وَفِي سِتٍّ وَثَلَاثِينَ: بِنْتُ لَبُونٍ لَهَا سَنَتَانِ،','pada dua puluh lima: seekor bintu makhadh berumur satu tahun; pada tiga puluh enam: bintu labun berumur dua tahun;'],
 ['وَفِي سِتٍّ وَأَرْبَعِينَ: حِقَّةٌ لَهَا ثَلَاثُ سِنِينَ، وَفِي إِحْدَى وَسِتِّينَ: جَذَعَةٌ لَهَا أَرْبَعُ سِنِينَ،','pada empat puluh enam: hiqqah berumur tiga tahun; pada enam puluh satu: jadza‘ah berumur empat tahun;'],
 ['وَفِي سِتٍّ وَسَبْعِينَ: بِنْتَا لَبُونٍ، وَفِي إِحْدَى وَتِسْعِينَ: حِقَّتَانِ، وَفِي مِئَةٍ وَإِحْدَى وَعِشْرِينَ: ثَلَاثُ بَنَاتِ لَبُونٍ،','pada tujuh puluh enam: dua bintu labun; pada sembilan puluh satu: dua hiqqah; pada seratus dua puluh satu: tiga bintu labun;'],
 ['ثُمَّ بَعْدَ هَذَا فِي كُلِّ أَرْبَعِينَ: بِنْتُ لَبُونٍ، وَفِي كُلِّ خَمْسِينَ: حِقَّةٌ.','setelah itu, setiap empat puluh: satu bintu labun, dan setiap lima puluh: satu hiqqah.']];
TR['zakat-317']=[
 ['وَأَمَّا الْبَقَرُ: فَفِي كُلِّ ثَلَاثِينَ: تَبِيعٌ لَهُ سَنَةٌ، وَفِي كُلِّ أَرْبَعِينَ: مُسِنَّةٌ لَهَا سَنَتَانِ،','Adapun sapi: setiap tiga puluh ekor zakatnya seekor tabi‘ berumur satu tahun, dan setiap empat puluh ekor seekor musinnah berumur dua tahun;'],
 ['ثُمَّ بَعْدَ هَذَا فِي كُلِّ ثَلَاثِينَ: تَبِيعٌ، وَفِي كُلِّ أَرْبَعِينَ: مُسِنَّةٌ.','setelah itu, setiap tiga puluh: satu tabi‘, dan setiap empat puluh: satu musinnah.']];
TR['zakat-318']=[
 ['وَأَمَّا الْغَنَمُ: فَفِي كُلِّ أَرْبَعِينَ شَاةً: شَاةٌ،','Adapun kambing: pada empat puluh ekor zakatnya seekor kambing;'],
 ['وَفِي مِئَةٍ وَإِحْدَى وَعِشْرِينَ: شَاتَانِ، وَفِي مِئَتَيْنِ وَوَاحِدَةٍ: ثَلَاثُ شِيَاهٍ، وَفِي أَرْبَعِ مِئَةٍ: أَرْبَعُ شِيَاهٍ،','pada seratus dua puluh satu: dua kambing; pada dua ratus satu: tiga kambing; pada empat ratus: empat kambing;'],
 ['ثُمَّ فِي كُلِّ مِئَةٍ: شَاةٌ.','kemudian setiap seratus ekor: seekor kambing.']];
TR['zakat-319']=[
 ['وَلَا تَجِبُ فِي الزُّرُوعِ وَالثِّمَارِ إِلَّا فِيمَا يُقْتَاتُ فِي حَالَةِ الِاخْتِيَارِ،','Zakat tidak wajib pada hasil pertanian dan buah-buahan kecuali yang dijadikan makanan pokok dalam keadaan normal;'],
 ['فَتَجِبُ بِبُدُوِّ صَلَاحِ الثَّمَرِ وَاشْتِدَادِ الْحَبِّ،','zakatnya wajib ketika buah sudah tampak matang dan biji sudah mengeras,'],
 ['بِشَرْطِ: أَنْ يَكُونَ ثَلَاثَ مِئَةِ صَاعٍ؛ وَالصَّاعُ: أَرْبَعَةُ أَمْدَادٍ.','dengan syarat mencapai tiga ratus sha‘; satu sha‘ adalah empat mud.'],
 ['وَيَجِبُ فِي ذَلِكَ نِصْفُ الْعُشْرِ إِنْ سُقِيَ بِمُؤْنَةٍ، وَإِنْ سُقِيَ بِغَيْرِ مُؤْنَةٍ كَالْمَطَرِ.. فَفِيهِ الْعُشْرُ جَافّاً مُنَقًّى.','Zakatnya setengah dari sepersepuluh (5%) bila diairi dengan biaya; bila diairi tanpa biaya seperti hujan, zakatnya sepersepuluh (10%), dikeluarkan dalam keadaan kering dan bersih.'],
 ['وَتُضَمُّ الزُّرُوعُ بَعْضُهَا إِلَى بَعْضٍ فِي إِكْمَالِ النِّصَابِ إِذَا كَانَتْ جِنْساً وَحُصِدَتْ فِي سَنَةٍ وَاحِدَةٍ.','Hasil pertanian digabungkan satu sama lain untuk menggenapkan nisab, bila jenisnya sama dan dipanen dalam satu tahun.']];
TR['zakat-325']=[
 ['فَصْلٌ: وَأَمَّا الذَّهَبُ.. فَنِصَابُهُ: عِشْرُونَ مِثْقَالاً. وَالْمِثْقَالُ: أَرْبَعَةٌ وَعِشْرُونَ قِيرَاطاً.','Fasal: Adapun emas, nisabnya dua puluh mitsqal; satu mitsqal adalah dua puluh empat qirath.'],
 ['وَنِصَابُ الْفِضَّةِ: مِئَتَا دِرْهَمٍ إِسْلَامِيٍّ فِضَّةً خَالِصَةً؛ وَالدِّرْهَمُ الْإِسْلَامِيُّ: سَبْعَةَ عَشَرَ قِيرَاطاً إِلَّا خُمُسَ قِيرَاطٍ.','Nisab perak dua ratus dirham Islami dari perak murni; satu dirham Islami adalah tujuh belas qirath kurang seperlima qirath.'],
 ['وَلَا تَجِبُ الزَّكَاةُ فِي ذَلِكَ حَتَّى يَحُولَ عَلَيْهِ الْحَوْلُ؛ وَزَكَاتُهُ: رُبُعُ الْعُشْرِ.','Zakatnya tidak wajib sampai berlalu satu tahun (haul); zakatnya seperempat dari sepersepuluh (2,5%).'],
 ['وَيُشْتَرَطُ: أَنْ لَا يَكُونَ حُلِيّاً مُبَاحاً.','Disyaratkan bukan perhiasan yang mubah.'],
 ['وَيَجِبُ فِي الْمَعْدِنِ مِنَ الذَّهَبِ وَالْفِضَّةِ: رُبُعُ عُشْرِهِ إِذَا كَانَ نِصَاباً فِي الْحَالِ.','Pada barang tambang berupa emas dan perak wajib seperempat dari sepersepuluhnya bila mencapai nisab, dikeluarkan saat itu juga.'],
 ['وَأَمَّا الرِّكَازُ الْجَاهِلِيُّ.. فَفِيهِ: الْخُمُسُ فِي الْحَالِ، بِشَرْطِ أَنْ يَكُونَ ذَهَباً أَوْ فِضَّةً، وَأَنْ يُوجَدَ فِي مَوَاتٍ، أَوْ فِي مِلْكٍ أَحْيَاهُ.','Adapun harta terpendam zaman jahiliyah, zakatnya seperlima saat itu juga, dengan syarat berupa emas atau perak, dan ditemukan di tanah mati atau tanah milik yang ia hidupkan.'],
 ['وَتَجِبُ زَكَاةُ التِّجَارَةِ إِذَا بَلَغَتْ نِصَاباً آخِرَ الْحَوْلِ، وَهِيَ: رُبُعُ عُشْرِ الْقِيمَةِ.','Zakat perdagangan wajib bila mencapai nisab di akhir haul, yaitu seperempat dari sepersepuluh nilainya.']];
TR['zakat-334']=[
 ['فَصْلٌ: وَتَجِبُ زَكَاةُ الْفِطْرِ بِغُرُوبِ شَمْسِ آخِرِ يَوْمٍ مِنْ رَمَضَانَ، إِذَا كَانَ حُرّاً؛','Fasal: Zakat fitrah wajib dengan terbenamnya matahari pada hari terakhir Ramadhan, bila ia orang merdeka;'],
 ['فَتَجِبُ عَلَيْهِ فِطْرَةُ نَفْسِهِ وَفِطْرَةُ مَنْ عَلَيْهِ مُؤْنَتُهُ مِنْ زَوْجَةٍ وَوَالِدٍ وَوَلَدٍ وَعَبْدٍ إِذَا كَانُوا مُسْلِمِينَ وَوَجَدَ مَا يُؤَدَّى عَنْهُمْ.','maka ia wajib membayar zakat fitrah dirinya dan orang yang wajib ia nafkahi, yaitu istri, orang tua, anak, dan budak, bila mereka muslim dan ia memiliki sesuatu untuk dibayarkan atas mereka.'],
 ['وَيَحْرُمُ تَأْخِيرُهَا عَنْ يَوْمِ الْعِيدِ، فَإِنْ أَخَّرَهَا.. أَثِمَ وَصَارَتْ قَضَاءً.','Haram menundanya melewati hari ‘id; jika ia menundanya, ia berdosa dan zakat itu menjadi qadha.'],
 ['وَلَا فِطْرَةَ عَلَى مُعْسِرٍ، وَهُوَ مَنْ لَا يَجِدُ شَيْئاً، أَوْ لَا يَجِدُ إِلَّا مَا يَكْفِيهِ لَيْلَةَ الْعِيدِ وَيَوْمَهُ،','Tidak ada zakat fitrah atas orang yang kesulitan, yaitu yang tidak memiliki apa-apa, atau hanya memiliki yang mencukupinya untuk malam dan hari ‘id;'],
 ['وَلَا يَجِبُ بَيْعُ مَسْكَنِهِ وَخَادِمٍ يَحْتَاجُ إِلَيْهِ.','dan ia tidak wajib menjual rumahnya atau pembantu yang ia butuhkan.'],
 ['وَهِيَ: صَاعٌ؛ وَالصَّاعُ أَرْبَعَةُ أَمْدَادٍ بِمُدِّ النَّبِيِّ ﷺ، وَالْمُدُّ: رِطْلٌ وَثُلُثٌ.','Besarnya satu sha‘; satu sha‘ adalah empat mud dengan mud Nabi ﷺ, dan satu mud adalah satu sepertiga rithl.'],
 ['وَلَا تَجِبُ إِلَّا مِنْ غَالِبِ قُوتِ الْبَلَدِ.','Zakat fitrah hanya wajib dari makanan pokok yang dominan di negeri itu.']];
TR['shiyam-341']=[
 ['[بَابُ الصِّيَامِ] يَثْبُتُ دُخُولُ رَمَضَانَ بِاسْتِكْمَالِ شَعْبَانَ ثَلَاثِينَ، أَوْ بِرُؤْيَةِ الْهِلَالِ، وَيَكْفِي شَهَادَةُ عَدْلٍ.','[Bab Puasa] Masuknya Ramadhan ditetapkan dengan menggenapkan Sya‘ban tiga puluh hari atau dengan melihat hilal, dan cukup dengan kesaksian satu orang yang adil.']];
TR['shiyam-347']=[
 ['فَصْلٌ: وَشُرُوطُ صِحَّةِ الصَّوْمِ: النِّيَّةُ، فَإِنْ كَانَ فَرْضاً.. اشْتُرِطَ التَّبْيِيتُ، وَالتَّعْيِينُ كَصَوْمِ رَمَضَانَ أَوْ نَذْرٍ.','Fasal: Syarat sah puasa: niat; jika puasanya fardhu, disyaratkan berniat di malam hari dan menentukan jenisnya, seperti puasa Ramadhan atau nadzar.'],
 ['وَشَرْطُ صِحَّةِ الصَّوْمِ أَيْضاً: الْإِمْسَاكُ عَنِ الْجِمَاعِ عَمْداً، وَعَنِ الِاسْتِمْنَاءِ، وَعَنِ الِاسْتِقَاءَةِ،','Syarat sah puasa juga: menahan diri dari jimak dengan sengaja, dari mengeluarkan mani, dari sengaja muntah,'],
 ['وَعَنْ وُصُولِ عَيْنٍ إِلَى مَا يُسَمَّى جَوْفاً؛ كَبَاطِنِ أُذُنٍ أَوْ إِحْلِيلٍ مِنْ مَنْفَذٍ مَفْتُوحٍ،','dan dari masuknya benda ke bagian yang disebut rongga, seperti telinga bagian dalam atau saluran kencing, melalui lubang yang terbuka;'],
 ['فَلَا يَضُرُّ وُصُولُ دُهْنٍ بِتَشَرُّبِ الْمَسَامِّ، وَلَا طَعْمِ الْكُحْلِ بِحَلْقِهِ.','maka tidak mengapa masuknya minyak yang meresap melalui pori-pori, dan tidak pula rasa celak di tenggorokannya.'],
 ['وَلَا يُفْطِرُ إِذَا فَعَلَ ذَلِكَ نَاسِياً أَوْ جَاهِلاً أَوْ مُكْرَهاً.','Ia tidak batal puasanya jika melakukan hal itu karena lupa, tidak tahu (yang diuzur), atau dipaksa.'],
 ['وَيُفْطِرُ بِخُرُوجِ الْمَنِيِّ بِلَمْسٍ بِلَا حَائِلٍ، أَوْ قُبْلَةٍ، أَوْ مُضَاجَعَةٍ، لَا بِفِكْرٍ وَنَظَرٍ.','Puasanya batal karena keluarnya mani akibat menyentuh tanpa penghalang, mencium, atau tidur berdampingan; tidak batal bila karena berpikir atau memandang.'],
 ['وَشَرْطُ صِحَّةِ الصَّوْمِ أَيْضاً: الْإِسْلَامُ، وَالْعَقْلُ، وَالنَّقَاءُ عَنِ الْحَيْضِ وَالنِّفَاسِ فِي جَمِيعِ النَّهَارِ.','Syarat sah puasa juga: Islam, berakal, dan bersih dari haid dan nifas sepanjang siang hari.'],
 ['وَيَحْرُمُ صَوْمُ الْعِيدَيْنِ وَأَيَّامِ التَّشْرِيقِ،','Haram berpuasa pada dua hari raya dan hari-hari tasyriq,'],
 ['وَيَحْرُمُ صَوْمُ النِّصْفِ الْأَخِيرِ مِنْ شَعْبَانَ إِلَّا لِنَذْرٍ أَوْ قَضَاءٍ أَوْ كَفَّارَةٍ أَوْ وِرْدٍ.','dan haram berpuasa pada paruh kedua bulan Sya‘ban, kecuali puasa nadzar, qadha, kafarat, atau puasa yang sudah menjadi kebiasaan.']];
TR['shiyam-358']=[
 ['فَصْلٌ: وَشَرْطُ وُجُوبِ صَوْمِ رَمَضَانَ: الْعَقْلُ، وَالْبُلُوغُ، وَالْقُدْرَةُ عَلَى الصَّوْمِ.','Fasal: Syarat wajib puasa Ramadhan: berakal, baligh, dan mampu berpuasa.'],
 ['وَيُؤْمَرُ بِهِ الصَّبِيُّ إِذَا أَطَاقَ لِسَبْعٍ، وَيُضْرَبُ عَلَى تَرْكِهِ لِعَشْرٍ.','Anak kecil diperintahkan berpuasa bila mampu pada umur tujuh tahun, dan dipukul (untuk mendidik) bila meninggalkannya pada umur sepuluh tahun.'],
 ['وَيَجُوزُ الْفِطْرُ لِلْمُسَافِرِ سَفَراً طَوِيلاً مُبَاحاً، وَلِلْمَرِيضِ إِذَا خَافَ الضَّرَرَ،','Boleh tidak berpuasa bagi musafir dalam perjalanan jauh yang mubah, bagi orang sakit bila khawatir bahaya,'],
 ['وَلِلْحَامِلِ وَالْمُرْضِعِ إِذَا خَافَتَا عَلَى أَنْفُسِهِمَا أَوْ عَلَى الْوَلَدِ، وَلِمُنْقِذِ حَيَوَانٍ مُشْرِفٍ عَلَى الْهَلَاكِ.','bagi wanita hamil dan menyusui bila khawatir atas diri mereka atau atas anaknya, dan bagi orang yang menyelamatkan hewan yang hampir binasa.'],
 ['وَيَقْضُونَ كُلُّهُمْ،','Mereka semua wajib mengqadha;'],
 ['وَيَجِبُ مَعَ الْقَضَاءِ لِكُلِّ يَوْمٍ مُدٌّ عَلَى مَنْ أَفْطَرَ لِإِنْقَاذِ حَيَوَانٍ مُحْتَرَمٍ مُشْرِفٍ عَلَى الْهَلَاكِ،','dan wajib bersama qadha satu mud untuk setiap hari bagi yang berbuka karena menyelamatkan hewan muhtaram yang hampir binasa,'],
 ['وَعَلَى الْحَامِلِ وَالْمُرْضِعِ إِذَا أَفْطَرَتَا خَوْفاً عَلَى الْوَلَدِ،','bagi wanita hamil dan menyusui bila berbuka karena khawatir atas anaknya,'],
 ['وَعَلَى مَنْ أَخَّرَ الْقَضَاءَ إِلَى رَمَضَانَ آخَرَ بِغَيْرِ عُذْرٍ.','dan bagi orang yang menunda qadha sampai datang Ramadhan berikutnya tanpa uzur.'],
 ['وَمَنْ أَفْطَرَ بِغَيْرِ عُذْرٍ.. وَجَبَ عَلَيْهِ الْقَضَاءُ عَلَى الْفَوْرِ.','Barang siapa berbuka tanpa uzur, wajib mengqadhanya dengan segera.']];
TR['shiyam-366']=[
 ['فَصْلٌ: وَشُرُوطُ صِحَّةِ الِاعْتِكَافِ: النِّيَّةُ، وَاللُّبْثُ فِي الْمَسْجِدِ، وَالْإِسْلَامُ، وَالْعَقْلُ، وَالنَّقَاءُ عَنِ الْحَيْضِ وَالنِّفَاسِ، وَالطَّهَارَةُ عَنِ الْجَنَابَةِ.','Fasal: Syarat sah i‘tikaf: niat, berdiam di masjid, Islam, berakal, bersih dari haid dan nifas, dan suci dari janabah.']];
TR['hajj-374']=[
 ['[بَابُ الْحَجِّ] وَيَجِبُ الْحَجُّ وَالْعُمْرَةُ عَلَى الْمُسْلِمِ، الْبَالِغِ، الْعَاقِلِ، الْحُرِّ،','[Bab Haji] Haji dan umrah wajib atas orang muslim, baligh, berakal, merdeka,'],
 ['الْقَادِرِ عَلَيْهِ بِنَفْسِهِ أَوْ بِغَيْرِهِ إِنْ عَجَزَ بِمَرَضٍ لَا يُرْجَى بُرْؤُهُ أَوْ كِبَرٍ.','yang mampu melaksanakannya sendiri, atau melalui orang lain bila ia tidak mampu karena sakit yang tidak diharapkan sembuh atau karena sudah tua.']];
TR['hajj-379']=[
 ['فَصْلٌ: فُرُوضُ الْحَجِّ خَمْسَةٌ:','Fasal: Fardhu haji ada lima:'],
 ['الْإِحْرَامُ، وَهُوَ النِّيَّةُ بِالْقَلْبِ.','ihram, yaitu niat dengan hati;'],
 ['وَالْوُقُوفُ بِعَرَفَةَ.','wuquf di Arafah;'],
 ['وَالطَّوَافُ بَعْدَ الْوُقُوفِ.','thawaf setelah wuquf;'],
 ['ثُمَّ السَّعْيُ.','kemudian sa‘i;'],
 ['وَالْحَلْقُ أَوِ التَّقْصِيرُ.','dan mencukur habis atau memendekkan rambut.']];
TR['hajj-383']=[
 ['وَوَاجِبَاتُهُ سِتَّةٌ:','Wajib-wajib haji ada enam:'],
 ['الْإِحْرَامُ مِنَ الْمِيقَاتِ.','ihram dari miqat;'],
 ['وَالْمَبِيتُ بِمُزْدَلِفَةَ لَيْلَةَ النَّحْرِ.','bermalam di Muzdalifah pada malam hari raya kurban;'],
 ['وَالْمَبِيتُ لَيَالِيَ التَّشْرِيقِ بِمِنًى.','bermalam di Mina pada malam-malam tasyriq;'],
 ['وَرَمْيُ جَمْرَةِ الْعَقَبَةِ يَوْمَ النَّحْرِ سَبْعَ حَصَيَاتٍ.','melempar jumrah ‘aqabah pada hari raya kurban dengan tujuh batu;'],
 ['وَرَمْيُ الْجِمَارِ الثَّلَاثِ كُلَّ يَوْمٍ مِنْ أَيَّامِ التَّشْرِيقِ بَعْدَ الزَّوَالِ، كُلَّ وَاحِدَةٍ سَبْعَ حَصَيَاتٍ،','melempar tiga jumrah setiap hari pada hari-hari tasyriq setelah tergelincir matahari, masing-masing tujuh batu;'],
 ['وَيَجُوزُ النَّفْرُ فِي الْيَوْمِ الثَّانِي قَبْلَ الْغُرُوبِ.','dan boleh meninggalkan Mina pada hari tasyriq kedua sebelum matahari terbenam;'],
 ['وَطَوَافُ الْوَدَاعِ.','serta thawaf wada‘.']];
TR['hajj-390']=[
 ['وَفُرُوضُ الْعُمْرَةِ أَرْبَعَةٌ: الْإِحْرَامُ، ثُمَّ الطَّوَافُ، ثُمَّ السَّعْيُ، ثُمَّ الْحَلْقُ أَوِ التَّقْصِيرُ.','Fardhu umrah ada empat: ihram, kemudian thawaf, kemudian sa‘i, kemudian mencukur habis atau memendekkan rambut.'],
 ['وَوَاجِبَاتُهَا: الْإِحْرَامُ مِنَ الْمِيقَاتِ.','Wajibnya: ihram dari miqat.']];
TR['hajj-392']=[
 ['فَصْلٌ: فُرُوضُ الطَّوَافِ: سَتْرُ الْعَوْرَةِ، وَطَهَارَةُ الْحَدَثَيْنِ، وَطَهَارَةُ النَّجَاسَةِ فِي الثَّوْبِ وَالْبَدَنِ وَالْمَكَانِ،','Fasal: Fardhu-fardhu thawaf: menutup aurat, suci dari dua hadats, suci dari najis pada pakaian, badan, dan tempat,'],
 ['وَأَنْ يَجْعَلَ الْكَعْبَةَ عَنْ يَسَارِهِ،','menjadikan Ka‘bah di sebelah kirinya,'],
 ['وَأَنْ يَطُوفَ سَبْعَ مَرَّاتٍ خَارِجَ الْكَعْبَةِ دَاخِلَ الْمَسْجِدِ الْحَرَامِ،','berthawaf tujuh kali di luar Ka‘bah dan di dalam Masjidil Haram,'],
 ['وَأَنْ يَبْتَدِئَ بِالْحَجَرِ الْأَسْوَدِ.','dan memulainya dari Hajar Aswad.']];
TR['hajj-397']=[
 ['فَصْلٌ: وَفُرُوضُ السَّعْيِ: أَنْ يَبْدَأَ بِالصَّفَا فِي الْمَرَّةِ الْأُولَى، وَبِالْمَرْوَةِ فِي الثَّانِيَةِ، وَهَكَذَا سَبْعاً،','Fasal: Fardhu-fardhu sa‘i: memulai dari Shafa pada perjalanan pertama, dari Marwah pada perjalanan kedua, dan begitu seterusnya sampai tujuh kali;'],
 ['وَأَنْ يَكُونَ بَعْدَ طَوَافِ الرُّكْنِ أَوِ الْقُدُومِ بِحَيْثُ لَا يَتَخَلَّلُ بَيْنَهُمَا الْوُقُوفُ بِعَرَفَةَ.','dan dilakukan setelah thawaf rukun atau thawaf qudum, dengan syarat di antara keduanya tidak diselingi wuquf di Arafah.']];
TR['hajj-400']=[
 ['فَصْلٌ: لِلْحَجِّ تَحَلُّلَانِ:','Fasal: Haji memiliki dua tahallul:'],
 ['فَالْأَوَّلُ: يَحْصُلُ بِاثْنَيْنِ مِنْ ثَلَاثَةٍ، وَهِيَ: الطَّوَافُ، وَالْحَلْقُ، وَرَمْيُ جَمْرَةِ الْعَقَبَةِ؛','yang pertama tercapai dengan dua dari tiga hal, yaitu thawaf, mencukur, dan melempar jumrah ‘aqabah;'],
 ['وَبِالثَّالِثِ يَحْصُلُ التَّحَلُّلُ الثَّانِي.','dan dengan yang ketiga tercapai tahallul kedua.'],
 ['وَيَحِلُّ بِالْأَوَّلِ جَمِيعُ الْمُحَرَّمَاتِ إِلَّا النِّسَاءَ وَعَقْدَ النِّكَاحِ.','Dengan tahallul pertama halal semua larangan ihram kecuali urusan perempuan dan akad nikah.'],
 ['وَالتَّحَلُّلُ مِنَ الْعُمْرَةِ بِفَرَاغِهَا.','Tahallul dari umrah terjadi dengan selesainya umrah.']];
TR['hajj-402']=[
 ['فَصْلٌ: وَيَحْرُمُ بِالْإِحْرَامِ سِتَّةُ أَشْيَاءَ:','Fasal: Karena ihram, haram enam perkara:'],
 ['الْأَوَّلُ: سَتْرُ رَأْسِ الرَّجُلِ، وَوَجْهِ الْمَرْأَةِ، وَلُبْسُ الْمَخِيطِ فِي بَدَنِهِ إِنْ كَانَ رَجُلاً، وَلُبْسُ الْقُفَّازَيْنِ لِلْمَرْأَةِ.','Yang pertama: menutup kepala bagi laki-laki dan wajah bagi perempuan, memakai pakaian berjahit pada badan bagi laki-laki, dan memakai sarung tangan bagi perempuan.'],
 ['الثَّانِي: التَّطَيُّبُ فِي بَدَنِهِ أَوْ ثَوْبِهِ أَوْ فِرَاشِهِ أَوْ طَعَامِهِ أَوْ شَرَابِهِ.','Yang kedua: memakai wewangian pada badan, pakaian, tempat tidur, makanan, atau minumannya.'],
 ['الثَّالِثُ: دَهْنُ شَعْرِ الرَّأْسِ وَاللِّحْيَةِ.','Yang ketiga: meminyaki rambut kepala dan jenggot.'],
 ['الرَّابِعُ: إِزَالَةُ الشَّعْرِ وَالظُّفْرِ.','Yang keempat: menghilangkan rambut dan kuku.'],
 ['وَكَفَّارَةُ هَذِهِ الْأَرْبَعَةِ: شَاةٌ، أَوْ إِطْعَامُ ثَلَاثَةِ آصُعٍ لِسِتَّةِ فُقَرَاءَ، لِكُلِّ وَاحِدٍ نِصْفُ صَاعٍ، أَوْ صَوْمُ ثَلَاثَةِ أَيَّامٍ.','Kafarat empat larangan ini: seekor kambing, atau memberi makan tiga sha‘ kepada enam orang fakir, masing-masing setengah sha‘, atau puasa tiga hari.'],
 ['الْخَامِسُ: الْجِمَاعُ، فَإِنْ جَامَعَ فِي الْعُمْرَةِ.. فَسَدَتْ وَلَزِمَهُ إِتْمَامُهَا،','Yang kelima: jimak; jika ia berjimak saat umrah, umrahnya rusak dan ia wajib menyelesaikannya;'],
 ['أَوْ فِي الْحَجِّ قَبْلَ التَّحَلُّلِ الْأَوَّلِ وَكَانَ عَامِداً مُخْتَاراً.. فَسَدَ،','atau saat haji sebelum tahallul pertama, dengan sengaja dan tidak dipaksa, hajinya rusak;'],
 ['وَإِذَا فَسَدَ وَجَبَ عَلَيْهِ إِتْمَامُهُ، وَيَقْضِيهِمَا، وَيُخْرِجُ الْكَفَّارَةَ،','jika rusak, ia wajib menyelesaikannya, mengqadha keduanya, dan mengeluarkan kafarat,'],

  <h2>Kembar tapi beda</h2>${(TWINS[n]||[]).map((t,ti)=>`${rk('S'+n+'-KB'+(ti+1))}<div class="twin"><div class="card"><b>${t.a.t}</b><p class="muted" style="margin-top:4px">${t.a.d}</p></div><div class="card"><b>${t.b.t}</b><p class="muted" style="margin-top:4px">${t.b.d}</p></div></div>`).join('')}`;}

function mmss(t){const h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');}

function nextBtn(){$('#qb').innerHTML=`<button class="primary" style="grid-column:span 2" onclick="QS.i++;QS.answered=false;QS.shuf=null;QS.sel=null;render()">Lanjut</button>`;}
function quizHTML(n){
  const qs=QUIZ[n]||[];
  if(QS.i>=qs.length){const pct=Math.round(QS.score/qs.length*100);
    if(!QS.done){QS.done=true;const prev=S.quiz[n]||0,litBefore=REGIONS.filter(r=>regionLit(r.id)).map(r=>r.id);S.quiz[n]=Math.max(prev,pct);save();
      const newLit=REGIONS.filter(r=>regionLit(r.id)&&!litBefore.includes(r.id));const all=SESSIONS.every(x=>passed(x.n));
      let m;
      if(all&&prev<80&&pct>=80)m=`<b>Bārakallāhu fīk${nm()}!</b> Seluruh 8 sesi sudah lulus. Kitab ini sudah kamu jelajahi tuntas — jaga dengan murajaah flashcard.`;
      else if(pct===100)m=pick([`<b>MasyaAllah${nm()}!</b> Sempurna, ${pct}% di Sesi ${n}.`,`<b>Sempurna${nm()}!</b> Semua soal Sesi ${n} benar. Alhamdulillah.`]);
      else if(pct>=80&&prev<80)m=`<b>Alhamdulillah${nm()}, Sesi ${n} lulus!</b> Skormu ${pct}%.`;
      else if(pct>=80)m=pick([`<b>Bagus${nm()}!</b> ${pct}% — ilmunya makin melekat.`,`<b>Tetap istiqamah${nm()}!</b> Sesi ${n} kembali lulus dengan ${pct}%.`]);
      else if(pct>prev)m=`<b>Ada kemajuan${nm()}!</b> Dari ${prev}% naik ke ${pct}%. Sedikit lagi menuju 80%.`;
      else m=pick([`<b>Tetap semangat${nm()}.</b> ${pct}% — buka kartu dan pohon fasalnya, lalu coba lagi.`,`<b>Jangan menyerah${nm()}.</b> Setiap pengulangan menambah paham. Ulangi setelah membaca pembahasannya.`]);
      if(newLit.length&&!all)m+=` Wilayah <b>${newLit.map(r=>r.name).join(', ')}</b> kini menyala penuh di peta.`;
      setTimeout(()=>toast(m),60);}
    return `<div class="card stack" style="text-align:center"><p class="muted">Hasil kuis</p><span style="font-size:44px;font-weight:700">${pct}%</span><p>${pct>=80?`Lulus${nm()}. Wilayah sesi ini menyala di peta.`:`Belum 80%${nm()}. Ulangi kuisnya setelah membuka kartu dan pohon.`}</p><p class="muted" style="font-size:13px">Skor terbaikmu: ${S.quiz[n]||pct}%</p><button class="primary" onclick="QS={i:0,score:0,answered:false};render()">Ulangi kuis</button>${n<8&&pct>=80?`<button onclick="go('sesi-${n+1}')">Lanjut ke Sesi ${n+1}</button>`:''}</div>`;}
  const q=qs[QS.i];
  if(q.t==='urut'){
    if(!QS.shuf){QS.shuf=q.items.map((x,i)=>i).sort(()=>Math.random()-.5);if(QS.shuf.every((v,i)=>v===i))QS.shuf.reverse();QS.pick=[];}
    const left=QS.shuf.filter(i=>!QS.pick.includes(i));
    return `<div class="card quizcard"><div><p class="muted">Soal ${QS.i+1} dari ${qs.length} · susun urutan${rk('S'+n+'-Q'+(QS.i+1))}</p><p style="font-size:18px;margin-top:10px">${q.q}</p>
    <div class="stack" style="margin-top:12px">${QS.pick.map((i,k)=>`<div class="leaf cat-rukun"><b>${k+1}</b>${q.items[i]}</div>`).join('')}</div>
    <div class="stack" style="margin-top:10px">${left.map(i=>`<button style="text-align:left" onclick="pickU(${i})">${q.items[i]}</button>`).join('')}</div></div>
    <div id="fb"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px" id="qb"><button onclick="QS.pick=[];render()">Ulang susun</button><button class="primary" onclick="checkU(${n})">Periksa</button></div><p id="uerr" style="font-size:13px;color:var(--pb-fg);margin-top:6px"></p></div>`;}
  if(q.t==='pg'){
    if(!QS.shuf){QS.shuf=q.opts.map((x,i)=>i).sort(()=>Math.random()-.5);}
    return `<div class="card quizcard"><div><p class="muted">Soal ${QS.i+1} dari ${qs.length} · pilih satu jawaban${rk('S'+n+'-Q'+(QS.i+1))}</p><p style="font-size:17px;margin-top:10px">${q.q}</p>
    <div class="stack" style="margin-top:12px" id="opts">${QS.shuf.map(i=>`<button class="opt" data-i="${i}" style="text-align:left" onclick="answerPG(${n},${i})">${q.opts[i]}</button>`).join('')}</div></div><div id="fb"></div><div id="qb" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"></div></div>`;}
  if(q.t==='sortir'){
    if(!QS.sel)QS.sel=q.items.map(()=>null);
    return `<div class="card quizcard"><div><p class="muted">Soal ${QS.i+1} dari ${qs.length} · pilah ke ${q.bins.length} keranjang${rk('S'+n+'-Q'+(QS.i+1))}</p><p style="font-size:17px;margin-top:10px">${q.q}</p>
    <div class="stack" style="margin-top:12px">${q.items.map((it,k)=>`<div class="sortrow" id="sr${k}"><span style="flex:1;font-size:14px">${it[0]}</span><span class="bins">${q.bins.map((b,j)=>`<button class="${QS.sel[k]===j?'on':''}" onclick="pickS(${k},${j})">${b}</button>`).join('')}</span></div>`).join('')}</div></div>
    <div id="fb"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px" id="qb"><button onclick="QS.sel=null;render()">Ulang pilah</button><button class="primary" onclick="checkS(${n})">Periksa</button></div><p id="uerr" style="font-size:13px;color:var(--pb-fg);margin-top:6px"></p></div>`;}
  return `<div class="card quizcard" id="qc"><div><p class="muted">Soal ${QS.i+1} dari ${qs.length} · geser kiri salah, kanan benar${rk('S'+n+'-Q'+(QS.i+1))}</p><p style="font-size:18px;margin-top:10px">${q.q}</p></div><div id="fb"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px" id="qb"><button onclick="answer(${n},false)">${ico('i-x')} Salah</button><button onclick="answer(${n},true)">${ico('i-check')} Benar</button></div></div>`;
}
window.pickU=function(i){if(QS.answered)return;QS.pick.push(i);render();};
window.checkU=function(n){const q=QUIZ[n][QS.i];if(QS.answered)return;if(QS.pick.length<q.items.length){$('#uerr').textContent='Pilih semua langkah dulu.';return;}
  QS.answered=true;const ok=QS.pick.every((v,k)=>v===k);if(ok)QS.score++;
  $('#fb').innerHTML=fbHTML(n,q,ok);nextBtn();};
window.answer=function(n,v){if(QS.answered)return;QS.answered=true;const q=QUIZ[n][QS.i];const ok=q.a===v;if(ok)QS.score++;
  $('#fb').innerHTML=fbHTML(n,q,ok);nextBtn();};
window.answerPG=function(n,i){if(QS.answered)return;QS.answered=true;const q=QUIZ[n][QS.i];const ok=q.a===i;if(ok)QS.score++;
  document.querySelectorAll('#opts .opt').forEach(b=>{const k=+b.dataset.i;b.disabled=true;if(k===q.a)b.classList.add('right');else if(k===i)b.classList.add('wrong');});
  $('#fb').innerHTML=fbHTML(n,q,ok);nextBtn();};
window.pickS=function(k,j){if(QS.answered)return;QS.sel[k]=j;render();};
window.checkS=function(n){if(QS.answered)return;const q=QUIZ[n][QS.i];if(QS.sel.some(x=>x===null)){$('#uerr').textContent='Pilah semua butir dulu.';return;}
  QS.answered=true;let ok=true;q.items.forEach((it,k)=>{const r=QS.sel[k]===it[1];if(!r)ok=false;const el=$('#sr'+k);el.classList.add(r?'right':'wrong');if(!r)el.insertAdjacentHTML('beforeend',`<span style="font-size:12px;width:100%">Jawaban: ${q.bins[it[1]]}</span>`);el.querySelectorAll('button').forEach(b=>b.disabled=true);});
  if(ok)QS.score++;$('#fb').innerHTML=fbHTML(n,q,ok);nextBtn();};

let FS={i:0,flip:false};
function flashHTML(n){
  const fs=FLASH[n]||[];if(!S.flash[n]||S.flash[n].length!==fs.length)S.flash[n]=fs.map((c,i)=>(S.flash[n]&&S.flash[n][i])||1);const box=S.flash[n];
  const order=fs.map((c,i)=>i).sort((a,b)=>box[a]-box[b]);const idx=order[FS.i%order.length];const c=fs[idx];
  const done=box.filter(b=>b>=3).length;
  return `<p class="muted" style="margin-bottom:10px">Kotak 1 sering muncul, kotak 3 berarti sudah dikuasai. Dikuasai: ${done} dari ${fs.length}.</p>
  <div class="card flash cat-${c.c}" onclick="FS.flip=!FS.flip;render()"><div>${FS.flip?`<span>${c.b}</span>${c.p?`<br><span onclick="event.stopPropagation()">${refHTML(n,c)}</span>`:''}`:`<b>${c.f}</b><p class="muted" style="margin-top:8px">Ketuk untuk membalik</p>`}</div></div>
  <p class="muted" style="margin:8px 0">Kotak ${box[idx]} · kartu ${idx+1} dari ${fs.length}${rk('S'+n+'-K'+(idx+1))}</p>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button onclick="rate(${n},${idx},false)">Belum hafal</button><button class="primary" onclick="rate(${n},${idx},true)">Sudah hafal</button></div>`;
}
window.rate=function(n,idx,ok){const b=S.flash[n];const before=flashDone(n);b[idx]=ok?Math.min(3,b[idx]+1):1;save();FS.i++;FS.flip=false;render();
  const after=flashDone(n),tot=(FLASH[n]||[]).length;
  if(after>before){if(after===tot)toast(`<b>MasyaAllah${nm()}!</b> Semua ${tot} kartu Sesi ${n} sudah dikuasai.`);
    else if(after%10===0)toast(pick([`<b>${after} kartu dikuasai${nm()}!</b> Tinggal ${tot-after} lagi di Sesi ${n}.`,`<b>Mantap${nm()}!</b> ${after} dari ${tot} kartu Sesi ${n} sudah di kotak 3.`]));}};

function attachSwipe(){const el=$('#qc');if(!el)return;let x0=null;
  el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  el.addEventListener('touchmove',e=>{if(x0==null)return;el.style.transform=`translateX(${(e.touches[0].clientX-x0)/3}px)`},{passive:true});
  el.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;el.style.transform='';x0=null;if(Math.abs(dx)>70){const n=+location.hash.split('-')[1];answer(n,dx>0);}});}

window.fbCopy=function(b){try{navigator.clipboard.writeText(FB_MAIL).then(()=>{b.textContent='Tersalin';});}catch(e){}};
function fbCard(){return `<div class="card" style="margin-top:22px;text-align:center"><b>Ada yang keliru atau kurang jelas?</b><p class="muted" style="font-size:13px;margin:4px 0 10px">Kirim masukan ke penyusun. Halaman yang sedang dibuka ikut tercatat.</p><div class="row" style="gap:8px;justify-content:center;flex-wrap:wrap"><a class="dbtn" style="text-decoration:none;display:inline-block" href="${fbHref()}">Kirim masukan</a><button class="dbtn2" onclick="fbCopy(this)">Salin email</button></div><p class="muted" style="font-size:12px;margin-top:8px;user-select:all">${FB_MAIL}</p></div>`;}
function infoCards(){return `<div class="warn"><b>Belum direview ustadz</b><p style="margin-top:6px;font-size:13.5px;line-height:1.5">Isi aplikasi ini belum diperiksa ustadz. Ikuti penjelasan ustadz di kelas bila ada yang berbeda.</p><div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap"><button class="dbtn2" onclick="go('tentang')">Tentang aplikasi</button><button class="dbtn2" onclick="go('tanya')">Tanyakan ke ustadz</button><a class="dbtn" style="text-decoration:none;display:inline-block" href="${fbHref()}">Kirim masukan</a></div></div>`;}
function discCheck(){if(S.disc||document.getElementById('disc'))return;const d=document.createElement('div');d.id='disc';d.innerHTML=`<div class="dbox" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt" style="margin:0 0 8px">Sebelum mulai</h2><p style="line-height:1.55">${DISC_T}</p><div class="row" style="gap:8px;margin-top:14px;flex-wrap:wrap"><button class="dbtn" onclick="discOk()">Mengerti</button><button class="dbtn2" onclick="discOk('tentang')">Selengkapnya</button></div></div>`;document.body.appendChild(d);}
window.discOk=function(to){S.disc=1;save();const d=document.getElementById('disc');if(d)d.remove();if(to)go(to);};
function render(){const v=current();let h='';
  if(v==='peta')h=viewPeta();else if(v==='kunci')h=viewKunci();else if(v==='setelan')h=viewSetelan();else if(v==='tentang')h=viewTentang();else if(v==='tanya')h=viewTanya();
  else if(v.startsWith('sesi-'))h=viewSesi(+v.split('-')[1]);
  else if(v.startsWith('bab-')&&TREE[v.slice(4)])h=viewBab(v.slice(4));
  else if(v.startsWith('fasal-')&&DETAIL[v.slice(6)])h=viewFasal(v.slice(6));
  else if(v.startsWith('banding-')&&DETAIL[v.slice(8)]&&DETAIL[v.slice(8)].banding)h=viewBanding(v.slice(8));
  else if(v.startsWith('info-')){const p=v.slice(5).split('-');h=viewInfo(p[0],p.slice(1).join('-'));}else h=viewBeranda();
  $('#app').innerHTML=(REVIEW?RVBAR:'')+h+(S.name?fbCard():'');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===v||(v.startsWith('sesi')&&b.dataset.go==='beranda')||((v.startsWith('bab-')||v.startsWith('fasal-')||v.startsWith('banding-')||v.startsWith('info-'))&&b.dataset.go==='peta')));
  attachSwipe();discCheck();}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render();});
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
