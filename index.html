'thaharah-82':{mp:'82–91',ar:'فَصْلٌ: يُقَدِّمُ دَاخِلُ الْخَلَاءِ يَسَارَهُ، وَإِذَا خَرَجَ يَمِينَهُ. وَلَا يَحْمِلُ ذِكْرَ اللهِ تَعَالَى وَاسْمَ رَسُولِهِ وَالْقُرْآنَ. وَيُغَطِّي رَأْسَهُ. وَيَبْعُدُ وَيَسْتَتِرُ. وَلَا يَبُولُ فِي مَاءٍ رَاكِدٍ وَقَلِيلِ جَارٍ، وَجُحْرٍ، وَمَهَبِّ رِيحٍ، وَظِلٍّ مَقْصُودٍ، وَطَرِيقٍ، وَتَحْتَ شَجَرَةٍ مُثْمِرَةٍ. وَلَا يَتَكَلَّمُ. وَيَسْتَبْرِئُ مِنَ الْبَوْلِ. وَيَقُولُ إِذَا دَخَلَ: «بِاسْمِ اللهِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ». وَإِذَا خَرَجَ: «غُفْرَانَكَ، الْحَمْدُ لِلَّهِ الَّذِي أَذْهَبَ عَنِّي الْأَذَى وَعَافَانِي».'},
'thaharah-92':{none:true,note:'Di cetakan al-Bayan, halaman fasal ini tidak memuat teks matan: judul dan isinya berasal dari pensyarah. Fasal ini juga tidak terdengar dibahas di video kajian.'},
'thaharah-95':{mp:'95–98',ar:'فَصْلٌ: وَيَجِبُ الْغُسْلُ مِنْ خَمْسَةِ أَشْيَاءَ: مِنْ إِيلَاجِ الْحَشَفَةِ فِي الْفَرْجِ. وَمِنْ خُرُوجِ الْمَنِيِّ. وَمِنَ الْحَيْضِ، وَالنِّفَاسِ، وَالْوِلَادَةِ.'},
'thaharah-100':{mp:'100–101',ar:'فَصْلٌ: فُرُوضُ الْغُسْلِ شَيْئَانِ: الْأَوَّلُ: النِّيَّةُ، وَهُوَ أَنْ يَنْوِيَ رَفْعَ الْجَنَابَةِ، أَوْ رَفْعَ الْحَدَثِ الْأَكْبَرِ، أَوْ فَرْضَ الْغُسْلِ، أَوْ نَحْوَ ذَلِكَ عِنْدَ غَسْلِ أَوَّلِ جُزْءٍ مِنْ بَدَنِهِ. الثَّانِي: غَسْلُ جَمِيعِ شَعْرِهِ الْكَثِيفِ وَالْخَفِيفِ وَجَمِيعِ بَشَرَتِهِ حَتَّى مَا تَحْتَ قُلْفَةِ الْأَقْلَفِ.'},
'thaharah-102':{mp:'102–104',ar:'وَسُنَنُهُ: السِّوَاكُ، وَالتَّسْمِيَةُ، وَالْوُضُوءُ قَبْلَ الْغُسْلِ، وَتَعَهُّدُ الْمَعَاطِفِ، وَتَخْلِيلُ الشَّعْرِ، وَالدَّلْكُ، وَالتَّثْلِيثُ.'},
'thaharah-105':{mp:'106–112',ar:'فَصْلٌ: وَشُرُوطُ الطَّهَارَةِ عَنِ الْحَدَثِ الْأَصْغَرِ وَالْأَكْبَرِ: الْإِسْلَامُ، وَالتَّمْيِيزُ، وَالْمَاءُ الطَّاهِرُ الْمُطَهِّرُ؛ فَلَا يَصِحُّ رَفْعُ الْحَدَثِ وَلَا إِزَالَةُ النَّجَسِ إِلَّا بِالْمَاءِ الْمُطْلَقِ، وَهُوَ: مَا نَزَلَ مِنَ السَّمَاءِ، أَوْ نَبَعَ مِنَ الْأَرْضِ. فَإِذَا تَغَيَّرَ طَعْمُ الْمَاءِ أَوْ لَوْنُهُ أَوْ رِيحُهُ تَغَيُّراً فَاحِشاً بِمُخَالَطَةِ شَيْءٍ طَاهِرٍ يَسْتَغْنِي الْمَاءُ عَنْهُ كَالزَّعْفَرَانِ وَالْأُشْنَانِ وَالْجِصِّ وَالنُّورَةِ وَالْكُحْلِ.. لَمْ تُجْزِ الطَّهَارَةُ بِهِ. وَلَا يَضُرُّ التَّغَيُّرُ بِالْمُكْثِ وَالتُّرَابِ وَالطُّحْلُبِ وَمَا فِي مَقَرِّهِ وَمَمَرِّهِ، وَلَا التَّغَيُّرُ بِمُجَاوِرٍ كَالْعُودِ وَالدُّهْنِ الْمُطَيِّبِ. وَلَا تَصِحُّ الطَّهَارَةُ بِمَا تُطُهِّرَ بِهِ مِنْ حَدَثٍ أَوْ نَجَسٍ.'},
'thaharah-113':{mp:'112',ar:'وَلَا تَصِحُّ الطَّهَارَةُ بِمَا تُطُهِّرَ بِهِ مِنْ حَدَثٍ أَوْ نَجَسٍ.',note:'Halaman 113 sendiri tidak memuat matan; bagian ini uraian pensyarah atas kalimat matan di atas (air musta\'mal).'},
'thaharah-114':{mp:'114',ar:'تَنْبِيهٌ: لَوْ أَدْخَلَ الْمُتَوَضِّئُ يَدَهُ بَعْدَ غَسْلِ وَجْهِهِ جَمِيعِهِ مَرَّةً، أَوِ الْجُنُبُ بَعْدَ النِّيَّةِ فِي مَاءٍ دُونَ الْقُلَّتَيْنِ، فَاغْتَرَفَ وَنَوَى الِاغْتِرَافَ.. لَمْ يَضُرَّ، وَإِنْ لَمْ يَنْوِ الِاغْتِرَافَ.. صَارَ الْبَاقِي مُسْتَعْمَلاً.'},
'thaharah-116':{mp:'116–119',ar:'فَصْلٌ: وَيَنْجُسُ الْمَاءُ الْقَلِيلُ وَغَيْرُهُ مِنَ الْمَائِعَاتِ بِوُقُوعِ النَّجَاسَةِ فِيهِ، سَوَاءٌ غَيَّرَتْهُ أَمْ لَمْ تُغَيِّرْهُ. وَيُعْفَى عَنِ الْيَسِيرِ مِنَ الشَّعْرِ النَّجِسِ، وَعَنِ الْمَيْتَةِ الَّتِي لَا نَفْسَ لَهَا سَائِلَةٌ، وَالنَّجَاسَةِ الَّتِي لَا يُدْرِكُهَا الطَّرْفُ، وَمَنْفَذِ الطَّيْرِ وَالْفَأْرِ، وَالْيَسِيرِ مِنْ غُبَارِ السِّرْجِينِ، وَسُؤْرِ الْهِرَّةِ الَّتِي أَكَلَتْ نَجَاسَةً ثُمَّ غَابَتْ زَمَناً وَاحْتُمِلَ وُلُوغُهَا فِي قُلَّتَيْنِ مِنَ الْمَاءِ.'},
'thaharah-120':{mp:'120',ar:'فَصْلٌ: وَإِذَا كَانَ الْمَاءُ قُلَّتَيْنِ وَوَقَعَتْ فِيهِ نَجَاسَةٌ.. فَلَا يَنْجُسُ إِلَّا إِذَا تَغَيَّرَ طَعْمُهُ أَوْ لَوْنُهُ أَوْ رِيحُهُ تَغَيُّراً كَثِيراً أَوْ يَسِيراً. وَإِذَا زَالَ التَّغَيُّرُ بِنَفْسِهِ أَوْ بِمَاءٍ.. طَهُرَ. وَلَا يَطْهُرُ إِذَا زَالَ التَّغَيُّرُ بِمِسْكٍ أَوْ زَعْفَرَانٍ أَوْ جِصٍّ أَوْ تُرَابٍ.'},
"thaharah-121":{"mp": "121–126", "ar": "فَصْلٌ: وَالنَّجَاسَاتُ هِيَ: الْبَوْلُ، وَالْغَائِطُ، وَالرَّوْثُ، وَالْقَيْحُ، وَالدَّمُ، وَالْقَيْءُ. وَالْخَمْرُ، وَالنَّبِيذُ، وَالْمُسْكِرُ. وَالْكَلْبُ، وَالْخِنْزِيرُ، وَفَرْعُ أَحَدِهِمَا. وَالْمَيْتَةُ، وَشَعْرُهَا، وَرِيشُهَا، وَجِلْدُهَا، وَجَمِيعُ أَجْزَائِهَا. وَالْمَذْيُ، وَالْوَدْيُ، وَمَنِيُّ الْكَلْبِ وَالْخِنْزِيرِ. وَلَبَنُ مَا لَا يُؤْكَلُ غَيْرَ الْآدَمِيِّ. وَمَيْتَةُ الْآدَمِيِّ وَالسَّمَكِ وَالْجَرَادِ.. طَاهِرَاتٌ. وَالْجُزْءُ الْمُنْفَصِلُ مِنْ غَيْرِ الْآدَمِيِّ وَالسَّمَكِ وَالْجَرَادِ.. نَجِسٌ، إِلَّا شَعْرَ الْمَأْكُولِ، وَرِيشَهُ، وَوَبَرَهُ، وَصُوفَهُ، وَالْمِسْكَ وَنَافِجَتَهُ."},
"thaharah-128":{"mp": "128–134", "ar": "فَصْلٌ: وَتَطْهُرُ الْخَمْرَةُ إِذَا تَخَلَّلَتْ بِنَفْسِهَا، وَكَذَلِكَ النَّبِيذُ مِنَ التَّمْرِ وَالزَّبِيبِ، وَجِلْدُ الْمَيْتَةِ إِذَا دُبِغَ. وَإِذَا تَنَجَّسَ شَيْءٌ بِبَوْلِ كَلْبٍ أَوْ خِنْزِيرٍ أَوْ فَرْعِ أَحَدِهِمَا أَوْ لُعَابِهِ أَوْ رَوْثِهِ أَوْ عَرَقِهِ أَوْ بَدَنِهِ وَهُوَ رَطْبٌ.. غُسِلَ سَبْعاً إِحْدَاهُنَّ بِتُرَابٍ طَاهِرٍ طَهُورٍ. وَإِذَا تَنَجَّسَ التُّرَابُ بِالْكَلْبِ.. فَيَكْفِيهِ سَبْعُ مَرَّاتٍ بِالْمَاءِ الْخَالِصِ. وَمَا تَنَجَّسَ بِبَوْلِ صَبِيٍّ لَمْ يَطْعَمْ غَيْرَ اللَّبَنِ.. نُضِحَ، وَهُوَ رَشُّهُ بِالْمَاءِ مَعَ الْغَلَبَةِ وَالْمُكَاثَرَةِ. وَسَائِرُ النَّجَاسَاتِ تَطْهُرُ بِالْغَسْلِ إِذَا زَالَ طَعْمُهَا وَلَوْنُهَا وَرِيحُهَا. وَلَا يَضُرُّ بَقَاءُ لَوْنٍ أَوْ رِيحٍ عَسُرَ زَوَالُهُ. وَلَا يَطْهُرُ الْمَائِعُ إِذَا تَنَجَّسَ."},
"thaharah-135":{"mp": "135–137", "ar": "فَصْلٌ: وَيَجِبُ التَّيَمُّمُ عَنِ الْحَدَثِ الْأَصْغَرِ وَالْأَكْبَرِ عِنْدَ الْعَجْزِ عَنِ اسْتِعْمَالِ الْمَاءِ بِسَبَبِ فَقْدِهِ فِي حَضَرٍ أَوْ سَفَرٍ؛ وَلِلْمَرِيضِ. وَإِذَا كَانَ فِي بَدَنِهِ جِرَاحَةٌ يَضُرُّ بِهَا الْمَاءُ.. غَسَلَ الصَّحِيحَ، وَتَيَمَّمَ عَنِ الْجَرِيحِ فِي الْوَجْهِ وَالْيَدَيْنِ، وَيَكُونُ التَّيَمُّمُ وَقْتَ غَسْلِ الْعَلِيلِ."},
"thaharah-138":{"mp": "138", "ar": "وَيَجِبُ مَسْحُ الْجَبِيرَةِ بِالْمَاءِ إِذَا لَمْ يُمْكِنْ إِخْرَاجُهَا."},
"thaharah-141":{"mp": "141–144", "ar": "فَصْلٌ: فُرُوضُ التَّيَمُّمِ خَمْسَةٌ: الْأَوَّلُ: نَقْلُ التُّرَابِ. الثَّانِي: النِّيَّةُ، وَهِيَ نِيَّةُ اسْتِبَاحَةِ الصَّلَاةِ؛ فَإِنْ كَانَتِ الصَّلَاةُ فَرْضاً.. نَوَى اسْتِبَاحَةَ فَرْضِ الصَّلَاةِ، وَيَجِبُ قَرْنُهَا بِوَضْعِ الْيَدِ عَلَى التُّرَابِ، وَاسْتِدَامَتُهَا إِلَى مَسْحِ شَيْءٍ مِنَ الْوَجْهِ. الثَّالِثُ: مَسْحُ الْوَجْهِ. الرَّابِعُ: مَسْحُ الْيَدَيْنِ مَعَ الْمِرْفَقَيْنِ. الْخَامِسُ: التَّرْتِيبُ هَكَذَا."},
"thaharah-145":{"mp": "145–153", "ar": "فَصْلٌ: وَشُرُوطُ التَّيَمُّمِ: الْقَصْدُ إِلَى التُّرَابِ. وَأَنْ يَكُونَ التُّرَابُ طَاهِراً طَهُوراً خَالِصاً عَنِ الْخَلِيطِ. وَأَنْ يَكُونَ بِضَرْبَتَيْنِ: ضَرْبَةٍ لِلْوَجْهِ، وَضَرْبَةٍ لِلْيَدَيْنِ. وَأَنْ يَكُونَ بَعْدَ دُخُولِ الْوَقْتِ. وَأَنْ يُجَدِّدَ التَّيَمُّمَ لِكُلِّ فَرْضٍ. وَأَنْ يُفَتِّشَ عَنِ الْمَاءِ قَبْلَ التَّيَمُّمِ وَبَعْدَ دُخُولِ الْوَقْتِ فِي رَحْلِهِ وَرُفْقَتِهِ وَحَوَالَيْهِ، وَيُنَادِي: «مَنْ مَعَهُ مَاءٌ؟». وَمَنْ لَمْ يَجِدْ مَاءً وَلَا تُرَاباً؛ كَأَنْ كَانَ عَلَى قُلَّةِ جَبَلٍ.. صَلَّى الْفَرْضَ وَحْدَهُ، وَأَعَادَ. وَيَجُوزُ التَّيَمُّمُ لِلْبَرْدِ إِذَا فَقَدَ مَا يُسَخِّنُ بِهِ الْمَاءَ، أَوْ كَانَ لَا تَنْفَعُهُ تَدْفِئَةُ أَعْضَائِهِ بَعْدَ غَسْلِهَا، أَوْ لَا يَقْدِرُ عَلَيْهَا. وَيَقْضِي الْمُتَيَمِّمُ لِلْبَرْدِ وَالْمُتَيَمِّمُ الْعَاصِي بِسَفَرِهِ."},
"thaharah-155":{"mp": "155–160", "ar": "وَأَقَلُّ الْحَيْضِ: يَوْمٌ وَلَيْلَةٌ، وَأَكْثَرُهُ: خَمْسَةَ عَشَرَ يَوْمًا، وَغَالِبُهُ: سِتٌّ أَوْ سَبْعٌ. وَيَحْرُمُ بِالْحَيْضِ وَالْجَنَابَةِ: الصَّلَاةُ، وَالطَّوَافُ، وَمَسُّ الْمُصْحَفِ، وَحَمْلُهُ، وَاللُّبْثُ فِي الْمَسْجِدِ، وَقِرَاءَةُ الْقُرْآنِ بِقَصْدِ الْقِرَاءَةِ. وَيَحْرُمُ عَلَى الْحَائِضِ وَحْدَهَا: الصَّوْمُ، وَعُبُورُ الْمَسْجِدِ إِنْ خَافَتْ تَلْوِيثَهُ بِالدَّمِ، وَالِاسْتِمْتَاعُ فِيمَا بَيْنَ السُّرَّةِ وَالرُّكْبَةِ. وَالْجِمَاعُ فِي الْحَيْضِ مِنَ الْكَبَائِرِ. وَيَجِبُ عَلَيْهَا قَضَاءُ صَوْمِ رَمَضَانَ، دُونَ الصَّلَاةِ. وَإِذَا انْقَطَعَ الدَّمُ.. حَلَّ لَهَا الصَّوْمُ قَبْلَ الْغُسْلِ. وَيَحْرُمُ بِالنِّفَاسِ مَا يَحْرُمُ بِالْحَيْضِ. وَالنِّفَاسُ: هُوَ الدَّمُ الْخَارِجُ بَعْدَ الْوِلَادَةِ."},
"shalat-165":{"mp": "165–166", "ar": "[بَابُ الصَّلَاةِ] الصَّلَوَاتُ الْمَكْتُوبَاتُ خَمْسٌ. وَتَقْدِيمُ الصَّلَاةِ عَلَى وَقْتِهَا وَتَأْخِيرُهَا عَنْ وَقْتِهَا بِغَيْرِ عُذْرٍ مِنَ الْكَبَائِرِ."},
"shalat-168":{"mp": "169–175", "ar": "وَأَوَّلُ وَقْتِ الظُّهْرِ: إِذَا زَالَتِ الشَّمْسُ، وَآخِرُهُ: إِذَا صَارَ ظِلُّ كُلِّ شَيْءٍ مِثْلَهُ غَيْرَ ظِلِّ الِاسْتِوَاءِ. وَأَوَّلُ وَقْتِ الْعَصْرِ: إِذَا صَارَ ظِلُّ كُلِّ شَيْءٍ مِثْلَهُ وَزَادَ أَدْنَى زِيَادَةٍ، وَآخِرُهُ: غُرُوبُ الشَّمْسِ. وَأَوَّلُ وَقْتِ الْمَغْرِبِ: غُرُوبُ قُرْصِ الشَّمْسِ، وَآخِرُهُ عَلَى الْمُخْتَارِ: غُرُوبُ الشَّفَقِ الْأَحْمَرِ. وَأَوَّلُ وَقْتِ الْعِشَاءِ: غُرُوبُ الشَّفَقِ الْأَحْمَرِ، وَآخِرُهُ: طُلُوعُ الْفَجْرِ الصَّادِقِ، وَهُوَ الْمُنْتَشِرُ عَرْضاً. وَأَوَّلُ وَقْتِ الصُّبْحِ: طُلُوعُ الْفَجْرِ الصَّادِقِ، وَآخِرُهُ: طُلُوعُ الشَّمْسِ. وَأَفْضَلُ الْأَعْمَالِ.. الْمُبَادَرَةُ بِالصَّلَاةِ فِي أَوَّلِ وَقْتِهَا. وَيُسَنُّ الْإِبْرَادُ بِالظُّهْرِ، فِي شِدَّةِ الْحَرِّ، فِي قُطْرٍ حَارٍّ، لِمَنْ يُصَلِّي جَمَاعَةً، فِي مَسْجِدٍ بَعِيدٍ. وَمَنْ أَخَّرَ الصَّلَاةَ حَتَّى وَقَعَ بَعْضُهَا خَارِجَ الْوَقْتِ بِغَيْرِ عُذْرٍ.. عَصَى. وَمَنْ لَمْ يَعْلَمْ وَقْتَهَا.. وَجَبَ عَلَيْهِ أَنْ يَجْتَهِدَ فِي مَعْرِفَةِ دُخُولِهِ بِدِرَاسَةٍ أَوْ حِرْفَةٍ. وَمَنْ فَاتَهُ فَرْضٌ بِغَيْرِ عُذْرٍ.. وَجَبَ عَلَيْهِ قَضَاؤُهُ عَلَى الْفَوْرِ."},
"shalat-176":{"mp": "176–179", "ar": "وَتَحْرُمُ الصَّلَاةُ فِي خَمْسَةِ أَوْقَاتٍ: عِنْدَ طُلُوعِ الشَّمْسِ حَتَّى تَرْتَفِعَ قَدْرَ رُمْحٍ. وَعِنْدَ الِاسْتِوَاءِ فِي غَيْرِ يَوْمِ الْجُمُعَةِ حَتَّى تَزُولَ. وَعِنْدَ الِاصْفِرَارِ حَتَّى تَغْرُبَ. وَبَعْدَ صَلَاةِ الصُّبْحِ حَتَّى تَطْلُعَ الشَّمْسُ. وَبَعْدَ صَلَاةِ الْعَصْرِ حَتَّى تَغْرُبَ. وَلَا يَحْرُمُ فِيهَا مَا لَهُ سَبَبٌ فِي الْحَالِ؛ كَتَحِيَّةِ الْمَسْجِدِ، وَالْكُسُوفِ؛ دُونَ رَكْعَتَيِ الِاسْتِخَارَةِ. وَيَحْرُمُ ابْتِدَاءُ الصَّلَاةِ بَعْدَ صُعُودِ الْخَطِيبِ فِي الْجُمُعَةِ عَلَى الْمِنْبَرِ غَيْرَ التَّحِيَّةِ."},
"shalat-181":{"mp": "181–183", "ar": "فَصْلٌ: تَجِبُ الصَّلَاةُ عَلَى كُلِّ مُسْلِمٍ، بَالِغٍ، عَاقِلٍ، طَاهِرٍ. وَيَجِبُ عَلَى الْوَلِيِّ أَنْ يَأْمُرَ الصَّبِيَّ بِهَا لِسَبْعِ سِنِينَ، وَيَضْرِبَهُ عَلَى تَرْكِهَا لِعَشْرٍ، وَالصَّبِيَّةُ كَالصَّبِيِّ.", "note": "Kalimat kedua (perintah wali) ada di hlm. 183."},
"shalat-184":{"mp": "184–185", "ar": "وَإِذَا بَلَغَ الصَّبِيُّ، أَوْ طَهُرَتِ الْحَائِضُ أَوِ النُّفَسَاءُ، أَوْ أَفَاقَ الْمَجْنُونُ قَبْلَ خُرُوجِ الْوَقْتِ بِقَدْرِ تَكْبِيرَةٍ.. وَجَبَ قَضَاءُ تِلْكَ الصَّلَاةِ، وَيَجِبُ أَيْضاً قَضَاءُ الْفَرْضِ الَّذِي قَبْلَهَا إِذَا كَانَ ظُهْراً أَوْ مَغْرِباً."},
"shalat-185":{"mp": "185", "ar": "وَإِذَا دَخَلَ الْوَقْتُ وَمَضَى قَدْرُ مَا يُؤَدَّى فِيهِ الْفَرْضُ ثُمَّ حَاضَتِ الْمَرْأَةُ أَوْ نُفِسَتْ أَوْ جُنَّ قَبْلَ الصَّلَاةِ.. وَجَبَ قَضَاءُ تِلْكَ الصَّلَاةِ."},
"shalat-186":{"mp": "186–191", "ar": "وَيَجِبُ عَلَى الْآبَاءِ وَالْأُمَّهَاتِ وَسَيِّدِ الْعَبِيدِ تَعْلِيمُ أَوْلَادِهِمُ الصِّغَارِ وَعَبِيدِهِمْ مَا يَجِبُ عَلَيْهِمْ بَعْدَ بُلُوغِهِمْ مِنَ الطَّهَارَةِ وَالصَّلَاةِ وَالصِّيَامِ وَغَيْرِ ذَلِكَ. وَيُعَرِّفُهُمْ تَحْرِيمَ الزِّنَا وَاللِّوَاطِ وَالسَّرِقَةِ وَشُرْبِ الْخَمْرِ وَالْمُسْكِرِ، وَتَحْرِيمَ الْكَذِبِ قَلِيلِهِ وَكَثِيرِهِ، وَالْغِيبَةِ وَالنَّمِيمَةِ وَشِبْهِ ذَلِكَ. وَيُعَلِّمُهُمْ أَنَّهُمْ بِالْبُلُوغِ يَدْخُلُونَ فِي التَّكْلِيفِ. وَيُعَرِّفُ الصَّبِيَّ عَلَامَاتِ الْبُلُوغِ: أَنَّهَا بِخَمْسَ عَشْرَةَ سَنَةً، أَوْ بِالِاحْتِلَامِ، أَوْ بِالْحَيْضِ فِي الْمَرْأَةِ. وَأُجْرَةُ مَنْ يُعَلِّمُهُ هَذَا فِي مَالِهِ، فَإِنْ لَمْ يَكُنْ لَهُ مَالٌ.. فَعَلَى مَنْ تَجِبُ عَلَيْهِ نَفَقَتُهُ."},
"shalat-202":{"mp": "202–220", "ar": "فَصْلٌ: فُرُوضُ الصَّلَاةِ سَبْعَةَ عَشَرَ: الْأَوَّلُ: النِّيَّةُ، فَإِنْ كَانَتِ الصَّلَاةُ فَرْضاً.. وَجَبَ قَصْدُ فِعْلِهَا، وَتَعْيِينُهَا، وَنِيَّةُ الْفَرْضِيَّةِ مِنَ الْبَالِغِ. وَإِنْ كَانَتْ نَافِلَةً مُؤَقَّتَةً كَالْوِتْرِ، أَوْ ذَاتَ سَبَبٍ كَالْكُسُوفِ.. وَجَبَ قَصْدُ فِعْلِهَا وَتَعْيِينُهَا. وَإِنْ كَانَتْ نَافِلَةً مُطْلَقَةً.. وَجَبَ قَصْدُ فِعْلِهَا فَقَطْ. الثَّانِي: تَكْبِيرَةُ الْإِحْرَامِ، وَهُوَ أَنْ يَقُولَ: «اللهُ أَكْبَرُ»، وَيُجْزِئُهُ: «اللهُ الْأَكْبَرُ»، وَيَجِبُ أَنْ تَكُونَ النِّيَّةُ مُقَارِنَةً لِلتَّكْبِيرِ جَمِيعِهِ. الثَّالِثُ: الْقِيَامُ إِنْ كَانَتِ الصَّلَاةُ فَرْضاً وَقَدَرَ. الرَّابِعُ: قِرَاءَةُ الْفَاتِحَةِ، وَيَجِبُ: تَرْتِيبُهَا، وَمُوَالَاتُهَا، وَتَشْدِيدَاتُهَا، وَإِخْرَاجُ الضَّادِ مِنَ الظَّاءِ، وَتَجِبُ فِي كُلِّ رَكْعَةٍ إِلَّا رَكْعَةَ الْمَسْبُوقِ. الْخَامِسُ: الرُّكُوعُ. السَّادِسُ: الطُّمَأْنِينَةُ فِيهِ، بِحَيْثُ يَسْتَقِرُّ كُلُّ عُضْوٍ مَكَانَهُ. السَّابِعُ: الِاعْتِدَالُ. الثَّامِنُ: الطُّمَأْنِينَةُ فِيهِ. التَّاسِعُ: السُّجُودُ مَرَّتَيْنِ فِي كُلِّ رَكْعَةٍ، وَأَقَلُّهُ: وَضْعُ شَيْءٍ مِنْ جَبْهَتِهِ عَلَى الْأَرْضِ، وَبُطُونِ أَصَابِعِ يَدَيْهِ وَرِجْلَيْهِ، وَوَضْعُ رُكْبَتَيْهِ، وَتَحَامُلٌ بِرَأْسِهِ، وَارْتِفَاعُ أَسَافِلِهِ عَلَى أَعَالِيهِ. الْعَاشِرُ: الطُّمَأْنِينَةُ فِيهِ. الْحَادِي عَشَرَ: الْجُلُوسُ بَيْنَ السَّجْدَتَيْنِ. الثَّانِي عَشَرَ: الطُّمَأْنِينَةُ فِيهِ. الثَّالِثَ عَشَرَ: التَّشَهُّدُ الْأَخِيرُ. الرَّابِعَ عَشَرَ: الْقُعُودُ فِيهِ. الْخَامِسَ عَشَرَ: الصَّلَاةُ عَلَى النَّبِيِّ ﷺ فِي التَّشَهُّدِ الْأَخِيرِ. السَّادِسَ عَشَرَ: السَّلَامُ، وَأَقَلُّهُ: «السَّلَامُ عَلَيْكُمْ». السَّابِعَ عَشَرَ: التَّرْتِيبُ."},
"shalat-222":{"mp": "222–235", "ar": "فَصْلٌ: وَسُنَنُهَا كَثِيرَةٌ، مِنْهَا: رَفْعُ الْيَدَيْنِ عِنْدَ تَكْبِيرَةِ الْإِحْرَامِ، وَعِنْدَ الرُّكُوعِ، وَعِنْدَ الرَّفْعِ مِنْهُ، وَعِنْدَ الْقِيَامِ مِنَ التَّشَهُّدِ الْأَوَّلِ. وَمِنْ سُنَنِهَا: دُعَاءُ الِاسْتِفْتَاحِ. ثُمَّ التَّعَوُّذُ، وَيُسَنُّ فِي كُلِّ رَكْعَةٍ، وَالْأُولَى آكَدُ. وَقِرَاءَةُ سُورَةٍ -لِغَيْرِ الْمَأْمُومِ السَّامِعِ- بَعْدَ الْفَاتِحَةِ. وَالْجَهْرُ فِي الصُّبْحِ، وَالرَّكْعَتَيْنِ الْأُولَيَيْنِ مِنَ الْمَغْرِبِ وَالْعِشَاءِ لِلرَّجُلِ وَالْمَرْأَةِ إِنْ لَمْ يَحْضُرْ عِنْدَهَا رِجَالٌ أَجَانِبُ. وَوَضْعُ الْيُمْنَى عَلَى كُوعِ الْيُسْرَى تَحْتَ صَدْرِهِ. وَالتَّكْبِيرَاتُ غَيْرَ تَكْبِيرَةِ الْإِحْرَامِ. وَالْقُنُوتُ فِي اعْتِدَالِ الثَّانِيَةِ مِنَ الصُّبْحِ، وَفِي سَائِرِ الْمَكْتُوبَاتِ لِلنَّازِلَةِ. وَيَقُولُ فِي الرُّكُوعِ: «سُبْحَانَ رَبِّيَ الْعَظِيمِ وَبِحَمْدِهِ» ثَلَاثاً، وَفِي السُّجُودِ: «سُبْحَانَ رَبِّيَ الْأَعْلَى وَبِحَمْدِهِ» ثَلَاثاً. وَيَضَعُ فِي السُّجُودِ رُكْبَتَيْهِ، ثُمَّ يَدَيْهِ، ثُمَّ جَبْهَتَهُ وَأَنْفَهُ. وَيَقُولُ بَيْنَ السَّجْدَتَيْنِ: «رَبِّ اغْفِرْ لِي، وَارْحَمْنِي، وَاجْبُرْنِي، وَارْفَعْنِي، وَارْزُقْنِي، وَاهْدِنِي، وَعَافِنِي، وَاعْفُ عَنِّي». وَتُسَنُّ جَلْسَةُ الِاسْتِرَاحَةِ فِي الْأُولَى وَالثَّالِثَةِ مِنْ غَيْرِ الْمَغْرِبِ. وَيُسَنُّ التَّشَهُّدُ الْأَوَّلُ، وَالْقُعُودُ لَهُ، وَالصَّلَاةُ عَلَى النَّبِيِّ ﷺ فِيهِ، وَفِي الْقُنُوتِ. وَالِافْتِرَاشُ فِي جَمِيعِ الْجَلَسَاتِ، وَالتَّوَرُّكُ فِي التَّشَهُّدِ الْأَخِيرِ. وَيُسَنُّ فِيهَا نَظَرُهُ إِلَى مَوْضِعِ سُجُودِهِ. وَالْخُشُوعُ. وَتَدَبُّرُ الْقِرَاءَةِ وَالذِّكْرِ. وَتَطْوِيلُ قِرَاءَةِ الرَّكْعَةِ الْأُولَى عَلَى الثَّانِيَةِ. وَدُخُولُهَا بِنَشَاطٍ وَفَرَاغِ قَلْبٍ. وَكَثْرَةُ الدُّعَاءِ فِي السُّجُودِ."},
"shalat-236":{"mp": "236–241", "ar": "فَصْلٌ: وَتَبْطُلُ الصَّلَاةُ بِالْكَلَامِ الْكَثِيرِ، وَالْأَكْلِ الْكَثِيرِ، وَالْفِعْلِ الْكَثِيرِ؛ كَثَلَاثِ خَطَوَاتٍ، وَثَلَاثِ ضَرَبَاتٍ مُتَوَالِيَاتٍ، وَبِالضَّرْبَةِ الْمُفْرِطَةِ، وَالْوَثْبَةِ الْفَاحِشَةِ. وَإِنْ تَكَلَّمَ بِكَلَامٍ قَلِيلٍ نَاسِياً، أَوْ أَكَلَ قَلِيلاً نَاسِياً، أَوْ زَادَ رُكُوعاً أَوْ سُجُوداً نَاسِياً.. لَمْ تَبْطُلْ بِذَلِكَ، وَسَجَدَ لِلسَّهْوِ."},
"shalat-243":{"mp": "243–248", "ar": "فَصْلٌ: وَيُسْتَحَبُّ سُجُودُ السَّهْوِ، وَهُوَ سَجْدَتَانِ قُبَيْلَ السَّلَامِ، عِنْدَ تَرْكِ التَّشَهُّدِ الْأَوَّلِ، وَالصَّلَاةِ عَلَى النَّبِيِّ ﷺ فِيهِ، وَتَرْكِ الْقُنُوتِ فِي الصُّبْحِ، وَالصَّلَاةِ عَلَى النَّبِيِّ ﷺ فِيهِ، وَالْقِيَامِ فِيهِ، وَالْكَلَامِ الْقَلِيلِ نَاسِياً، وَزِيَادَةِ رُكْنٍ فِعْلِيٍّ نَاسِياً، وَالْأَكْلِ الْقَلِيلِ نَاسِياً. وَتَجِبُ مُتَابَعَةُ الْإِمَامِ فِيهِ؛ فَلَوْ سَجَدَ لِسَهْوِ نَفْسِهِ أَوْ تَخَلَّفَ عَنْ سُجُودِ إِمَامِهِ عَامِداً عَالِماً بِالتَّحْرِيمِ.. بَطَلَتْ صَلَاتُهُ."},
"shalat-249":{"mp": "249–252", "ar": "فَصْلٌ: وَيُسْتَحَبُّ سُجُودُ التِّلَاوَةِ لِلْقَارِئِ وَالْمُسْتَمِعِ وَالسَّامِعِ، فِي أَرْبَعَ عَشْرَةَ آيَةً، يَسْجُدُهَا الْإِمَامُ وَالْمُنْفَرِدُ. وَلَا يَسْجُدُ الْمَأْمُومُ لِلتِّلَاوَةِ إِلَّا إِذَا سَجَدَ إِمَامُهُ، فَإِنْ سَجَدَ دُونَ إِمَامِهِ.. بَطَلَتْ صَلَاتُهُ."},
"shalat-254":{"mp": "254–257", "ar": "فَصْلٌ: وَتَبْطُلُ الصَّلَاةُ خَلْفَ الْأَلْثَغِ وَالْأَرَتِّ، وَخَلْفَ الْمَأْمُومِ، وَخَلْفَ الْمُحْدِثِ وَالْجُنُبِ وَالْكَافِرِ، وَخَلْفَ مَنْ عَلَى بَدَنِهِ أَوْ ثَوْبِهِ نَجَاسَةٌ، وَخَلْفَ فَاقِدِ الْمَاءِ وَالتُّرَابِ، وَلَا يُصَلِّي الرَّجُلُ خَلْفَ الْمَرْأَةِ وَالْخُنْثَى."},
"shalat-259":{"mp": "260–264", "ar": "فَصْلٌ: وَشُرُوطُ الْجَمَاعَةِ سِتَّةٌ: الْأَوَّلُ: أَلَّا يَتَقَدَّمَ عَلَى إِمَامِهِ؛ وَتُكْرَهُ مُسَاوَاتُهُ، وَيُنْدَبُ تَخَلُّفُ الْمَأْمُومِ عَنْ إِمَامِهِ يَسِيراً. الثَّانِي: أَنْ يَجْمَعَهُمَا مَسْجِدٌ، أَوْ ثَلَاثُ مِئَةِ ذِرَاعٍ فِي غَيْرِهِ. الثَّالِثُ: أَنْ يَعْلَمَ انْتِقَالَاتِ الْإِمَامِ بِأَنْ يَرَاهُ أَوْ يَرَى بَعْضَ الْمَأْمُومِينَ، أَوْ يَسْمَعَهُ أَوْ يَسْمَعَ الْمُبَلِّغَ. الرَّابِعُ: أَنْ يَنْوِيَ الِاقْتِدَاءَ بِهِ أَوِ الْجَمَاعَةَ. الْخَامِسُ: أَنْ تُوَافِقَ صَلَاتُهُ صَلَاةَ إِمَامِهِ؛ فَلَا تَصِحُّ صَلَاةُ الْكُسُوفِ خَلْفَ الصَّلَاةِ الْمَكْتُوبَةِ، وَكَذَا خَلْفَ الْجَنَازَةِ، وَلَا الْجَنَازَةُ خَلْفَ الصُّبْحِ. السَّادِسُ: أَنْ يُتَابِعَهُ، فَلَوْ تَقَدَّمَ عَلَى إِمَامِهِ بِرُكْنَيْنِ فِعْلِيَّيْنِ، أَوْ تَأَخَّرَ عَنْهُ بِرُكْنَيْنِ فِعْلِيَّيْنِ بِغَيْرِ عُذْرٍ.. بَطَلَتْ صَلَاتُهُ، أَوْ تَخَلَّفَ بِعُذْرٍ كَبُطْءِ الْقِرَاءَةِ.. عُذِرَ إِلَى ثَلَاثَةِ أَرْكَانٍ طَوِيلَةٍ."},
"shalat-265":{"mp": "266–271", "ar": "فَصْلٌ: وَيَجُوزُ لِلْمُسَافِرِ سَفَراً طَوِيلاً مُبَاحاً، وَهُوَ مَرْحَلَتَانِ.. قَصْرُ الظُّهْرِ وَالْعَصْرِ وَالْعِشَاءِ رَكْعَتَيْنِ رَكْعَتَيْنِ. وَمَنْ فَاتَتْهُ صَلَاةٌ فِي السَّفَرِ وَقَضَاهَا فِي الْحَضَرِ أَوْ عَكْسُهُ.. أَتَمَّهَا. وَيُشْتَرَطُ: قَصْدُ مَوْضِعٍ مُعَيَّنٍ، فَلَا يَقْصُرُ الْهَائِمُ؛ وَأَنْ لَا يُصَلِّيَ خَلْفَ مَنْ يُتِمُّ الصَّلَاةَ أَوْ شَكَّ أَنَّهُ مُتِمٌّ أَوْ قَاصِرٌ؛ وَأَنْ يَنْوِيَ الْقَصْرَ عِنْدَ الْإِحْرَامِ."},
"shalat-272":{"mp": "272–275", "ar": "فَصْلٌ: وَيَجُوزُ لِلْمُسَافِرِ سَفَراً طَوِيلاً مُبَاحاً.. الْجَمْعُ بَيْنَ الظُّهْرِ وَالْعَصْرِ تَقْدِيماً وَتَأْخِيراً، وَكَذَا بَيْنَ الْمَغْرِبِ وَالْعِشَاءِ. وَإِذَا جَمَعَ تَقْدِيماً.. فَيُشْتَرَطُ: الْبُدَاءَةُ بِالْأُولَى، وَنِيَّةُ الْجَمْعِ فِيهَا، وَأَنْ لَا يَطُولَ الْفَصْلُ بَيْنَهُمَا. وَفِي جَمْعِ التَّأْخِيرِ يُشْتَرَطُ: أَنْ يَنْوِيَ التَّأْخِيرَ قَبْلَ خُرُوجِ وَقْتِ الظُّهْرِ وَقَبْلَ خُرُوجِ وَقْتِ الْمَغْرِبِ."},
"shalat-276":{"mp": "277–281", "ar": "فَصْلٌ: تَجِبُ الْجُمُعَةُ عَلَى كُلِّ مُسْلِمٍ مُكَلَّفٍ ذَكَرٍ حُرٍّ مُقِيمٍ بِلَا مَرَضٍ. وَيُعْذَرُ فِي تَرْكِ الْجُمُعَةِ وَالْجَمَاعَةِ: عِنْدَ الْمَطَرِ، وَالْمَرَضِ، وَالتَّمْرِيضِ، وَإِشْرَافِ الْقَرِيبِ وَنَحْوِهِ عَلَى الْمَوْتِ، وَالْخَوْفِ عَلَى نَفْسِهِ أَوْ مَالِهِ أَوْ عِرْضِهِ، وَمُدَافَعَةِ الْحَدَثِ مَعَ سَعَةِ الْوَقْتِ، وَشِدَّةِ الْجُوعِ، وَشِدَّةِ الْعَطَشِ، وَشِدَّةِ الْحَرِّ وَالْبَرْدِ، وَشِدَّةِ الرِّيحِ بِاللَّيْلِ، وَشِدَّةِ الْوَحَلِ، وَسَفَرِ الرُّفْقَةِ."},
"shalat-282":{"mp": "282–285", "ar": "فَصْلٌ: وَشُرُوطُ الْجُمُعَةِ: أَنْ تَكُونَ كُلُّهَا فِي وَقْتِ الظُّهْرِ. وَأَنْ تُقَامَ فِي نَفْسِ الْبَلَدِ. وَأَنْ لَا تُقَامَ قَبْلَهَا جُمُعَةٌ فِي تِلْكَ الْبَلَدِ. وَأَنْ تُصَلَّى جَمَاعَةً. وَأَنْ يَكُونُوا أَرْبَعِينَ ذَكَراً مُكَلَّفاً حُرّاً مُسْتَوْطِناً لَا يَظْعَنُ شِتَاءً وَلَا صَيْفاً إِلَّا لِحَاجَةٍ. وَأَنْ يَتَقَدَّمَهَا خُطْبَتَانِ."},
"shalat-286":{"mp": "286–289", "ar": "فَصْلٌ: وَفُرُوضُ الْخُطْبَتَيْنِ خَمْسَةٌ: الْأَوَّلُ: حَمْدُ اللهِ فِيهِمَا. الثَّانِي: الصَّلَاةُ عَلَى النَّبِيِّ ﷺ فِيهِمَا. الثَّالِثُ: الْوَصِيَّةُ بِالتَّقْوَى فِيهِمَا. الرَّابِعُ: قِرَاءَةُ آيَةٍ فِي الْأُولَى أَوْ فِي الثَّانِيَةِ. الْخَامِسُ: الدُّعَاءُ لِلْمُؤْمِنِينَ، وَلَوْ «رَحِمَكُمُ اللهُ» فِي الثَّانِيَةِ."},
"shalat-289":{"mp": "289–293", "ar": "وَشُرُوطُهُمَا: إِسْمَاعُهُمَا أَرْبَعِينَ، وَالْمُوَالَاةُ بَيْنَهُمَا، وَبَيْنَهُمَا وَبَيْنَ الصَّلَاةِ، وَطَهَارَةُ الْحَدَثِ الْأَصْغَرِ وَالْأَكْبَرِ، وَطَهَارَةُ النَّجَاسَةِ فِي الثَّوْبِ وَالْبَدَنِ وَالْمَكَانِ، وَالْقِيَامُ إِنْ قَدَرَ، وَسَتْرُ الْعَوْرَةِ، وَالْجُلُوسُ بَيْنَ الْخُطْبَتَيْنِ بِقَدْرِ الطُّمَأْنِينَةِ، وَأَنْ تَكُونَ بِالْعَرَبِيَّةِ، وَبَعْدَ الزَّوَالِ."},
"shalat-294":{"mp": "294–299", "ar": "فَصْلٌ: تَجْهِيزُ الْمَيِّتِ، وَهُوَ: غُسْلُهُ، وَتَكْفِينُهُ، وَالصَّلَاةُ عَلَيْهِ، وَدَفْنُهُ.. فَرْضُ كِفَايَةٍ. وَأَقَلُّ غُسْلِهِ: تَعْمِيمُ بَدَنِهِ شَعْراً وَبَشَراً بِالْمَاءِ الْخَالِصِ بَعْدَ إِزَالَةِ النَّجَاسَةِ. وَأَمَّا الْكَفَنُ.. فَأَقَلُّهُ: مَا يَسْتُرُ الْعَوْرَةَ. وَالْأَفْضَلُ لِلرَّجُلِ: ثَلَاثُ لَفَائِفَ، وَلِلْمَرْأَةِ خَمْسَةٌ: إِزَارٌ، وَخِمَارٌ، وَقَمِيصٌ، وَلِفَافَتَانِ."},
"shalat-300":{"mp": "300–305", "ar": "فَصْلٌ: وَفُرُوضُ صَلَاةِ الْجَنَازَةِ سَبْعَةٌ: الْأَوَّلُ: النِّيَّةُ؛ فَيَنْوِي فِعْلَ الصَّلَاةِ، وَتَعْيِينَهَا، كَصَلَاةِ الْجَنَازَةِ؛ وَيَنْوِي فَرْضِيَّتَهَا. الثَّانِي: أَرْبَعُ تَكْبِيرَاتٍ. الثَّالِثُ: قِرَاءَةُ الْفَاتِحَةِ فِي الْأُولَى أَوْ غَيْرِهَا. الرَّابِعُ: الصَّلَاةُ عَلَى النَّبِيِّ ﷺ بَعْدَ الثَّانِيَةِ. الْخَامِسُ: الدُّعَاءُ لِلْمَيِّتِ بَعْدَ الثَّالِثَةِ. السَّادِسُ: الْقِيَامُ لِلْقَادِرِ. السَّابِعُ: السَّلَامُ."},
"shalat-306":{"mp": "306–308", "ar": "فَصْلٌ: وَأَمَّا الدَّفْنُ.. فَأَقَلُّهُ: حُفْرَةٌ تَكْتُمُ رَائِحَتَهُ، وَتَحْرُسُهُ مِنَ السِّبَاعِ؛ وَيَجِبُ تَوْجِيهُهُ لِلْقِبْلَةِ. وَأَكْمَلُهُ: حُفْرَةٌ قَدْرَ قَامَةٍ وَبَسْطَةٍ، وَهُوَ: أَرْبَعَةُ أَذْرُعٍ وَنِصْفٌ. وَيَحْرُمُ النَّدْبُ بِتَعْدِيدِ شَمَائِلِ الْمَيِّتِ؛ نَحْوُ: وَاسَيِّدَاهُ، وَاكَهْفَاهُ. وَيَحْرُمُ النَّوْحُ، وَهُوَ رَفْعُ الصَّوْتِ بِالنَّدْبِ. وَيَحْرُمُ الْجَزَعُ بِضَرْبِ الصَّدْرِ وَالْخَدِّ، وَنَشْرِ الشَّعْرِ، وَشَقِّ الْجَيْبِ، وَطَرْحِ الرَّمَادِ عَلَى الرَّأْسِ، وَنَحْوِ ذَلِكَ."},
"zakat-309":{"mp": "311–313", "ar": "[بَابُ الزَّكَاةِ] تَجِبُ الزَّكَاةُ فِي الْإِبِلِ، وَالْبَقَرِ، وَالْغَنَمِ، وَالزُّرُوعِ وَالثِّمَارِ، وَالْمَعْدِنِ، وَالرِّكَازِ، وَالتِّجَارَةِ."},
"zakat-314":{"mp": "314–317", "ar": "فَأَمَّا الْإِبِلُ: فَفِي خَمْسٍ مِنْهَا: شَاةٌ جَذَعَةٌ مِنَ الضَّأْنِ لَهَا سَنَةٌ، أَوْ ثَنِيَّةٌ مِنَ الْمَعْزِ لَهَا سَنَتَانِ، وَفِي عَشْرٍ: شَاتَانِ، وَفِي خَمْسَ عَشْرَةَ: ثَلَاثُ شِيَاهٍ، وَفِي عِشْرِينَ: أَرْبَعُ شِيَاهٍ، وَفِي خَمْسٍ وَعِشْرِينَ: بِنْتُ مَخَاضٍ لَهَا سَنَةٌ، وَفِي سِتٍّ وَثَلَاثِينَ: بِنْتُ لَبُونٍ لَهَا سَنَتَانِ، وَفِي سِتٍّ وَأَرْبَعِينَ: حِقَّةٌ لَهَا ثَلَاثُ سِنِينَ، وَفِي إِحْدَى وَسِتِّينَ: جَذَعَةٌ لَهَا أَرْبَعُ سِنِينَ، وَفِي سِتٍّ وَسَبْعِينَ: بِنْتَا لَبُونٍ، وَفِي إِحْدَى وَتِسْعِينَ: حِقَّتَانِ، وَفِي مِئَةٍ وَإِحْدَى وَعِشْرِينَ: ثَلَاثُ بَنَاتِ لَبُونٍ، ثُمَّ بَعْدَ هَذَا فِي كُلِّ أَرْبَعِينَ: بِنْتُ لَبُونٍ، وَفِي كُلِّ خَمْسِينَ: حِقَّةٌ."},
"zakat-317":{"mp": "317–318", "ar": "وَأَمَّا الْبَقَرُ: فَفِي كُلِّ ثَلَاثِينَ: تَبِيعٌ لَهُ سَنَةٌ، وَفِي كُلِّ أَرْبَعِينَ: مُسِنَّةٌ لَهَا سَنَتَانِ، ثُمَّ بَعْدَ هَذَا فِي كُلِّ ثَلَاثِينَ: تَبِيعٌ، وَفِي كُلِّ أَرْبَعِينَ: مُسِنَّةٌ."},
"zakat-318":{"mp": "318", "ar": "وَأَمَّا الْغَنَمُ: فَفِي كُلِّ أَرْبَعِينَ شَاةً: شَاةٌ، وَفِي مِئَةٍ وَإِحْدَى وَعِشْرِينَ: شَاتَانِ، وَفِي مِئَتَيْنِ وَوَاحِدَةٍ: ثَلَاثُ شِيَاهٍ، وَفِي أَرْبَعِ مِئَةٍ: أَرْبَعُ شِيَاهٍ، ثُمَّ فِي كُلِّ مِئَةٍ: شَاةٌ."},
"zakat-319":{"mp": "319–323", "ar": "وَلَا تَجِبُ فِي الزُّرُوعِ وَالثِّمَارِ إِلَّا فِيمَا يُقْتَاتُ فِي حَالَةِ الِاخْتِيَارِ، فَتَجِبُ بِبُدُوِّ صَلَاحِ الثَّمَرِ وَاشْتِدَادِ الْحَبِّ، بِشَرْطِ: أَنْ يَكُونَ ثَلَاثَ مِئَةِ صَاعٍ؛ وَالصَّاعُ: أَرْبَعَةُ أَمْدَادٍ. وَيَجِبُ فِي ذَلِكَ نِصْفُ الْعُشْرِ إِنْ سُقِيَ بِمُؤْنَةٍ، وَإِنْ سُقِيَ بِغَيْرِ مُؤْنَةٍ كَالْمَطَرِ.. فَفِيهِ الْعُشْرُ جَافّاً مُنَقًّى. وَتُضَمُّ الزُّرُوعُ بَعْضُهَا إِلَى بَعْضٍ فِي إِكْمَالِ النِّصَابِ إِذَا كَانَتْ جِنْساً وَحُصِدَتْ فِي سَنَةٍ وَاحِدَةٍ."},
"zakat-325":{"mp": "325–332", "ar": "فَصْلٌ: وَأَمَّا الذَّهَبُ.. فَنِصَابُهُ: عِشْرُونَ مِثْقَالاً. وَالْمِثْقَالُ: أَرْبَعَةٌ وَعِشْرُونَ قِيرَاطاً. وَنِصَابُ الْفِضَّةِ: مِئَتَا دِرْهَمٍ إِسْلَامِيٍّ فِضَّةً خَالِصَةً؛ وَالدِّرْهَمُ الْإِسْلَامِيُّ: سَبْعَةَ عَشَرَ قِيرَاطاً إِلَّا خُمُسَ قِيرَاطٍ. وَلَا تَجِبُ الزَّكَاةُ فِي ذَلِكَ حَتَّى يَحُولَ عَلَيْهِ الْحَوْلُ؛ وَزَكَاتُهُ: رُبُعُ الْعُشْرِ. وَيُشْتَرَطُ: أَنْ لَا يَكُونَ حُلِيّاً مُبَاحاً. وَيَجِبُ فِي الْمَعْدِنِ مِنَ الذَّهَبِ وَالْفِضَّةِ: رُبُعُ عُشْرِهِ إِذَا كَانَ نِصَاباً فِي الْحَالِ. وَأَمَّا الرِّكَازُ الْجَاهِلِيُّ.. فَفِيهِ: الْخُمُسُ فِي الْحَالِ، بِشَرْطِ أَنْ يَكُونَ ذَهَباً أَوْ فِضَّةً، وَأَنْ يُوجَدَ فِي مَوَاتٍ، أَوْ فِي مِلْكٍ أَحْيَاهُ. وَتَجِبُ زَكَاةُ التِّجَارَةِ إِذَا بَلَغَتْ نِصَاباً آخِرَ الْحَوْلِ، وَهِيَ: رُبُعُ عُشْرِ الْقِيمَةِ."},
"zakat-334":{"mp": "334–340", "ar": "فَصْلٌ: وَتَجِبُ زَكَاةُ الْفِطْرِ بِغُرُوبِ شَمْسِ آخِرِ يَوْمٍ مِنْ رَمَضَانَ، إِذَا كَانَ حُرّاً؛ فَتَجِبُ عَلَيْهِ فِطْرَةُ نَفْسِهِ وَفِطْرَةُ مَنْ عَلَيْهِ مُؤْنَتُهُ مِنْ زَوْجَةٍ وَوَالِدٍ وَوَلَدٍ وَعَبْدٍ إِذَا كَانُوا مُسْلِمِينَ وَوَجَدَ مَا يُؤَدَّى عَنْهُمْ. وَيَحْرُمُ تَأْخِيرُهَا عَنْ يَوْمِ الْعِيدِ، فَإِنْ أَخَّرَهَا.. أَثِمَ وَصَارَتْ قَضَاءً. وَلَا فِطْرَةَ عَلَى مُعْسِرٍ، وَهُوَ مَنْ لَا يَجِدُ شَيْئاً، أَوْ لَا يَجِدُ إِلَّا مَا يَكْفِيهِ لَيْلَةَ الْعِيدِ وَيَوْمَهُ، وَلَا يَجِبُ بَيْعُ مَسْكَنِهِ وَخَادِمٍ يَحْتَاجُ إِلَيْهِ. وَهِيَ: صَاعٌ؛ وَالصَّاعُ أَرْبَعَةُ أَمْدَادٍ بِمُدِّ النَّبِيِّ ﷺ، وَالْمُدُّ: رِطْلٌ وَثُلُثٌ. وَلَا تَجِبُ إِلَّا مِنْ غَالِبِ قُوتِ الْبَلَدِ."},
"shiyam-341":{"mp": "343–345", "ar": "[بَابُ الصِّيَامِ] يَثْبُتُ دُخُولُ رَمَضَانَ بِاسْتِكْمَالِ شَعْبَانَ ثَلَاثِينَ، أَوْ بِرُؤْيَةِ الْهِلَالِ، وَيَكْفِي شَهَادَةُ عَدْلٍ."},
"shiyam-347":{"mp": "347–355", "ar": "فَصْلٌ: وَشُرُوطُ صِحَّةِ الصَّوْمِ: النِّيَّةُ، فَإِنْ كَانَ فَرْضاً.. اشْتُرِطَ التَّبْيِيتُ، وَالتَّعْيِينُ كَصَوْمِ رَمَضَانَ أَوْ نَذْرٍ. وَشَرْطُ صِحَّةِ الصَّوْمِ أَيْضاً: الْإِمْسَاكُ عَنِ الْجِمَاعِ عَمْداً، وَعَنِ الِاسْتِمْنَاءِ، وَعَنِ الِاسْتِقَاءَةِ، وَعَنْ وُصُولِ عَيْنٍ إِلَى مَا يُسَمَّى جَوْفاً؛ كَبَاطِنِ أُذُنٍ أَوْ إِحْلِيلٍ مِنْ مَنْفَذٍ مَفْتُوحٍ، فَلَا يَضُرُّ وُصُولُ دُهْنٍ بِتَشَرُّبِ الْمَسَامِّ، وَلَا طَعْمِ الْكُحْلِ بِحَلْقِهِ. وَلَا يُفْطِرُ إِذَا فَعَلَ ذَلِكَ نَاسِياً أَوْ جَاهِلاً أَوْ مُكْرَهاً. وَيُفْطِرُ بِخُرُوجِ الْمَنِيِّ بِلَمْسٍ بِلَا حَائِلٍ، أَوْ قُبْلَةٍ، أَوْ مُضَاجَعَةٍ، لَا بِفِكْرٍ وَنَظَرٍ. وَشَرْطُ صِحَّةِ الصَّوْمِ أَيْضاً: الْإِسْلَامُ، وَالْعَقْلُ، وَالنَّقَاءُ عَنِ الْحَيْضِ وَالنِّفَاسِ فِي جَمِيعِ النَّهَارِ. وَيَحْرُمُ صَوْمُ الْعِيدَيْنِ وَأَيَّامِ التَّشْرِيقِ، وَيَحْرُمُ صَوْمُ النِّصْفِ الْأَخِيرِ مِنْ شَعْبَانَ إِلَّا لِنَذْرٍ أَوْ قَضَاءٍ أَوْ كَفَّارَةٍ أَوْ وِرْدٍ."},
"shiyam-358":{"mp": "358–365", "ar": "فَصْلٌ: وَشَرْطُ وُجُوبِ صَوْمِ رَمَضَانَ: الْعَقْلُ، وَالْبُلُوغُ، وَالْقُدْرَةُ عَلَى الصَّوْمِ. وَيُؤْمَرُ بِهِ الصَّبِيُّ إِذَا أَطَاقَ لِسَبْعٍ، وَيُضْرَبُ عَلَى تَرْكِهِ لِعَشْرٍ. وَيَجُوزُ الْفِطْرُ لِلْمُسَافِرِ سَفَراً طَوِيلاً مُبَاحاً، وَلِلْمَرِيضِ إِذَا خَافَ الضَّرَرَ، وَلِلْحَامِلِ وَالْمُرْضِعِ إِذَا خَافَتَا عَلَى أَنْفُسِهِمَا أَوْ عَلَى الْوَلَدِ، وَلِمُنْقِذِ حَيَوَانٍ مُشْرِفٍ عَلَى الْهَلَاكِ. وَيَقْضُونَ كُلُّهُمْ، وَيَجِبُ مَعَ الْقَضَاءِ لِكُلِّ يَوْمٍ مُدٌّ عَلَى مَنْ أَفْطَرَ لِإِنْقَاذِ حَيَوَانٍ مُحْتَرَمٍ مُشْرِفٍ عَلَى الْهَلَاكِ، وَعَلَى الْحَامِلِ وَالْمُرْضِعِ إِذَا أَفْطَرَتَا خَوْفاً عَلَى الْوَلَدِ، وَعَلَى مَنْ أَخَّرَ الْقَضَاءَ إِلَى رَمَضَانَ آخَرَ بِغَيْرِ عُذْرٍ. وَمَنْ أَفْطَرَ بِغَيْرِ عُذْرٍ.. وَجَبَ عَلَيْهِ الْقَضَاءُ عَلَى الْفَوْرِ."},
"shiyam-366":{"mp": "366–370", "ar": "فَصْلٌ: وَشُرُوطُ صِحَّةِ الِاعْتِكَافِ: النِّيَّةُ، وَاللُّبْثُ فِي الْمَسْجِدِ، وَالْإِسْلَامُ، وَالْعَقْلُ، وَالنَّقَاءُ عَنِ الْحَيْضِ وَالنِّفَاسِ، وَالطَّهَارَةُ عَنِ الْجَنَابَةِ."},
"hajj-374":{"mp": "373–375", "ar": "[بَابُ الْحَجِّ] وَيَجِبُ الْحَجُّ وَالْعُمْرَةُ عَلَى الْمُسْلِمِ، الْبَالِغِ، الْعَاقِلِ، الْحُرِّ، الْقَادِرِ عَلَيْهِ بِنَفْسِهِ أَوْ بِغَيْرِهِ إِنْ عَجَزَ بِمَرَضٍ لَا يُرْجَى بُرْؤُهُ أَوْ كِبَرٍ."},
"hajj-379":{"mp": "379–382", "ar": "فَصْلٌ: فُرُوضُ الْحَجِّ خَمْسَةٌ: الْإِحْرَامُ، وَهُوَ النِّيَّةُ بِالْقَلْبِ. وَالْوُقُوفُ بِعَرَفَةَ. وَالطَّوَافُ بَعْدَ الْوُقُوفِ. ثُمَّ السَّعْيُ. وَالْحَلْقُ أَوِ التَّقْصِيرُ."},
"hajj-383":{"mp": "383–389", "ar": "وَوَاجِبَاتُهُ سِتَّةٌ: الْإِحْرَامُ مِنَ الْمِيقَاتِ. وَالْمَبِيتُ بِمُزْدَلِفَةَ لَيْلَةَ النَّحْرِ. وَالْمَبِيتُ لَيَالِيَ التَّشْرِيقِ بِمِنًى. وَرَمْيُ جَمْرَةِ الْعَقَبَةِ يَوْمَ النَّحْرِ سَبْعَ حَصَيَاتٍ. وَرَمْيُ الْجِمَارِ الثَّلَاثِ كُلَّ يَوْمٍ مِنْ أَيَّامِ التَّشْرِيقِ بَعْدَ الزَّوَالِ، كُلَّ وَاحِدَةٍ سَبْعَ حَصَيَاتٍ، وَيَجُوزُ النَّفْرُ فِي الْيَوْمِ الثَّانِي قَبْلَ الْغُرُوبِ. وَطَوَافُ الْوَدَاعِ."},
"hajj-390":{"mp": "390–391", "ar": "وَفُرُوضُ الْعُمْرَةِ أَرْبَعَةٌ: الْإِحْرَامُ، ثُمَّ الطَّوَافُ، ثُمَّ السَّعْيُ، ثُمَّ الْحَلْقُ أَوِ التَّقْصِيرُ. وَوَاجِبَاتُهَا: الْإِحْرَامُ مِنَ الْمِيقَاتِ."},
"hajj-392":{"mp": "392–395", "ar": "فَصْلٌ: فُرُوضُ الطَّوَافِ: سَتْرُ الْعَوْرَةِ، وَطَهَارَةُ الْحَدَثَيْنِ، وَطَهَارَةُ النَّجَاسَةِ فِي الثَّوْبِ وَالْبَدَنِ وَالْمَكَانِ، وَأَنْ يَجْعَلَ الْكَعْبَةَ عَنْ يَسَارِهِ، وَأَنْ يَطُوفَ سَبْعَ مَرَّاتٍ خَارِجَ الْكَعْبَةِ دَاخِلَ الْمَسْجِدِ الْحَرَامِ، وَأَنْ يَبْتَدِئَ بِالْحَجَرِ الْأَسْوَدِ."},
"hajj-397":{"mp": "397–399", "ar": "فَصْلٌ: وَفُرُوضُ السَّعْيِ: أَنْ يَبْدَأَ بِالصَّفَا فِي الْمَرَّةِ الْأُولَى، وَبِالْمَرْوَةِ فِي الثَّانِيَةِ، وَهَكَذَا سَبْعاً، وَأَنْ يَكُونَ بَعْدَ طَوَافِ الرُّكْنِ أَوِ الْقُدُومِ بِحَيْثُ لَا يَتَخَلَّلُ بَيْنَهُمَا الْوُقُوفُ بِعَرَفَةَ."},
"hajj-400":{"mp": "400–401", "ar": "فَصْلٌ: لِلْحَجِّ تَحَلُّلَانِ: فَالْأَوَّلُ: يَحْصُلُ بِاثْنَيْنِ مِنْ ثَلَاثَةٍ، وَهِيَ: الطَّوَافُ، وَالْحَلْقُ، وَرَمْيُ جَمْرَةِ الْعَقَبَةِ؛ وَبِالثَّالِثِ يَحْصُلُ التَّحَلُّلُ الثَّانِي. وَيَحِلُّ بِالْأَوَّلِ جَمِيعُ الْمُحَرَّمَاتِ إِلَّا النِّسَاءَ وَعَقْدَ النِّكَاحِ. وَالتَّحَلُّلُ مِنَ الْعُمْرَةِ بِفَرَاغِهَا."},
"hajj-402":{"mp": "402–416", "ar": "فَصْلٌ: وَيَحْرُمُ بِالْإِحْرَامِ سِتَّةُ أَشْيَاءَ: الْأَوَّلُ: سَتْرُ رَأْسِ الرَّجُلِ، وَوَجْهِ الْمَرْأَةِ، وَلُبْسُ الْمَخِيطِ فِي بَدَنِهِ إِنْ كَانَ رَجُلاً، وَلُبْسُ الْقُفَّازَيْنِ لِلْمَرْأَةِ. الثَّانِي: التَّطَيُّبُ فِي بَدَنِهِ أَوْ ثَوْبِهِ أَوْ فِرَاشِهِ أَوْ طَعَامِهِ أَوْ شَرَابِهِ. الثَّالِثُ: دَهْنُ شَعْرِ الرَّأْسِ وَاللِّحْيَةِ. الرَّابِعُ: إِزَالَةُ الشَّعْرِ وَالظُّفْرِ. وَكَفَّارَةُ هَذِهِ الْأَرْبَعَةِ: شَاةٌ، أَوْ إِطْعَامُ ثَلَاثَةِ آصُعٍ لِسِتَّةِ فُقَرَاءَ، لِكُلِّ وَاحِدٍ نِصْفُ صَاعٍ، أَوْ صَوْمُ ثَلَاثَةِ أَيَّامٍ. الْخَامِسُ: الْجِمَاعُ، فَإِنْ جَامَعَ فِي الْعُمْرَةِ.. فَسَدَتْ وَلَزِمَهُ إِتْمَامُهَا، أَوْ فِي الْحَجِّ قَبْلَ التَّحَلُّلِ الْأَوَّلِ وَكَانَ عَامِداً مُخْتَاراً.. فَسَدَ، وَإِذَا فَسَدَ وَجَبَ عَلَيْهِ إِتْمَامُهُ، وَيَقْضِيهِمَا، وَيُخْرِجُ الْكَفَّارَةَ، وَهِيَ: بَدَنَةٌ، ثُمَّ بَقَرَةٌ، ثُمَّ سَبْعُ شِيَاهٍ، ثُمَّ طَعَامٌ بِقِيمَةِ الْبَدَنَةِ، ثُمَّ صِيَامٌ بِعَدَدِ الْأَمْدَادِ. السَّادِسُ: اصْطِيَادُ الصَّيْدِ؛ وَيَحْرُمُ صَيْدُ الْحَرَمَيْنِ، وَقَطْعُ أَشْجَارِهِمَا عَلَى الْمُحْرِمِ وَالْحَلَالِ؛ وَإِذَا فَعَلَ شَيْئاً مِنْ ذَلِكَ.. وَجَبَتِ الْفِدْيَةُ، إِلَّا صَيْدَ حَرَمِ الْمَدِينَةِ وَشَجَرَهَا."},
"buyu-417":{"mp": "420", "ar": "[بَابُ الْبَيْعِ] وَمَنْ أَرَادَ الْبَيْعَ وَالنِّكَاحَ وَغَيْرَ ذَلِكَ.. فَعَلَيْهِ أَنْ يَتَعَلَّمَ كَيْفِيَّتَهُ وَشُرُوطَهُ."},
"buyu-421":{"mp": "421–427", "ar": "وَشُرُوطُ الْبَيْعِ: الْإِيجَابُ مِنَ الْبَائِعِ، وَالْقَبُولُ مِنَ الْمُشْتَرِي. وَأَنْ يَكُونَ الْعَاقِدَانِ بَالِغَيْنِ، عَاقِلَيْنِ، رَشِيدَيْنِ، مُخْتَارَيْنِ. وَأَنْ يَكُونَ الْمَبِيعُ طَاهِراً أَوْ مُتَنَجِّساً يُمْكِنُ طُهْرُهُ بِالْمَاءِ، مُنْتَفَعاً بِهِ، مَقْدُوراً عَلَى تَسْلِيمِهِ، وَأَنْ يَكُونَ مَمْلُوكاً لِلْعَاقِدِ، أَوْ لَهُ عَلَيْهِ وِلَايَةٌ أَوْ وَكَالَةٌ، وَأَنْ يَكُونَ مَعْلُوماً لِلْعَاقِدَيْنِ عَيْنُهُ وَقَدْرُهُ وَصِفَتُهُ. فَلَا يَصِحُّ بَيْعُ أَحَدِ الثَّوْبَيْنِ أَوِ الْعَبْدَيْنِ، وَلَا الْبَيْعُ بِمِلْءِ هَذَا الْبَيْتِ طَعَاماً، وَلَا بَيْعُ مَا لَمْ يَرَهُ وَلَا شِرَاؤُهُ."},
"buyu-428":{"mp": "430–431", "ar": "فَصْلٌ: وَإِذَا بَاعَ طَعَاماً بِجِنْسِهِ، أَوْ فِضَّةً بِفِضَّةٍ، أَوْ ذَهَباً بِذَهَبٍ.. اشْتُرِطَ فِي الْبَيْعِ: الْحُلُولُ، وَالتَّقَابُضُ قَبْلَ التَّفَرُّقِ، وَالْمُمَاثَلَةُ بِالْكَيْلِ إِنْ كَانَ مِمَّا يُكَالُ، وَبِالْوَزْنِ إِذَا كَانَ مِمَّا يُوزَنُ. فَإِنْ بَاعَ طَعَاماً بِطَعَامٍ غَيْرِ جِنْسِهِ، أَوْ فِضَّةً بِذَهَبٍ.. اشْتُرِطَ أَمْرَانِ: الْحُلُولُ، وَالتَّقَابُضُ، دُونَ الْمُمَاثَلَةِ."},
"buyu-433":{"mp": "433–438", "ar": "فَصْلٌ: وَيَثْبُتُ الْخِيَارُ فِي الْمَجْلِسِ فِي جَمِيعِ أَصْنَافِ الْبَيْعِ، وَلَا يَنْقَطِعُ إِلَّا بِالتَّخَايُرِ أَوْ بِالتَّفَرُّقِ بِأَبْدَانِهِمَا. وَيَجُوزُ لِلْمُتَعَاقِدَيْنِ أَوْ لِأَحَدِهِمَا شَرْطُ الْخِيَارِ ثَلَاثَةَ أَيَّامٍ أَوْ أَقَلَّ، إِلَّا أَنْ يُشْتَرَطَ قَبْضُ الْعِوَضِ فِي الْمَجْلِسِ، وَبَيْعَ الطَّعَامِ بِالطَّعَامِ، وَالنَّقْدِ بِالنَّقْدِ. وَإِذَا وَجَدَ بِالْمَبِيعِ عَيْباً.. رَدَّهُ عَلَى الْفَوْرِ. وَلَا يَصِحُّ بَيْعُ الْمَبِيعِ حَتَّى يَقْبِضَهُ."},
"buyu-437":{"mp": "438–441", "ar": "وَيَحْرُمُ: بَيْعُ الْحَاضِرِ لِلْبَادِي فِي مَتَاعٍ تَعُمُّ الْحَاجَةُ إِلَيْهِ، وَتَلَقِّي الْقَافِلَةِ لِلشِّرَاءِ مِنْهُمْ إِذَا جَهِلُوا سِعْرَ الْبَلَدِ، وَالسَّوْمُ عَلَى سَوْمِ أَخِيهِ، وَالْبَيْعُ عَلَى بَيْعِ أَخِيهِ، وَالشِّرَاءُ عَلَى شِرَاءِ أَخِيهِ، وَالنَّجْشُ. وَيَحْرُمُ التَّفْرِيقُ بَيْنَ الْجَارِيَةِ وَوَلَدِهَا حَتَّى يُمَيِّزَ.", "note": "Di matan, bagian ini tidak berjudul fasal sendiri; teksnya lanjutan fasal khiyar."}
};
